class AchievementScene extends Phaser.Scene {
  constructor() { super('AchievementScene'); }
  create() {
    const width = this.cameras.main.width;
    const height = this.cameras.main.height;

    const totalKills = Achievements.getStat('totalKills');
    const totalPlays = Achievements.getStat('totalPlays');
    const bestSurvival = Achievements.getStat('bestSurvival');
    const totalItems = Achievements.getStat('totalItems');
    const statFor = (category) => {
      if (category === 'kills') return totalKills;
      if (category === 'plays') return totalPlays;
      if (category === 'survival') return bestSurvival;
      if (category === 'items') return totalItems;
      return 0;
    };

    this.add.rectangle(0, 0, width, height, 0x000000, 0.9).setOrigin(0);
    this.add.text(width/2, 44, '🏆 나의 상장함', { fontSize: '38px', fontStyle: 'bold', color: '#f1c40f' }).setOrigin(0.5);

    // 📊 전체 진행률 - 몇 개의 상장이 남았는지 한눈에 보이도록 개수 + 진행바 표시
    const totalAchCount = ACHIEVEMENT_DEFS.length;
    const unlockedAchCount = ACHIEVEMENT_DEFS.filter(a => Achievements.isUnlocked(a.id)).length;
    const isAllClear = unlockedAchCount === totalAchCount;
    this.add.text(width/2, 68, isAllClear ? `${unlockedAchCount} / ${totalAchCount} 달성 (모두 달성!) 🎉` : `${unlockedAchCount} / ${totalAchCount} 달성`,
      { fontSize: '18px', fontStyle: 'bold', color: isAllClear ? '#2ecc71' : '#ecf0f1' }).setOrigin(0.5);
    const progressBarW = 300;
    this.add.rectangle(width/2, 82, progressBarW, 10, 0x1c2833).setOrigin(0.5).setStrokeStyle(2, 0x7f8c8d);
    const progressFillW = Math.max(4, progressBarW * (unlockedAchCount / totalAchCount));
    this.add.rectangle(width/2 - progressBarW / 2, 82, progressFillW, 10, isAllClear ? 0x2ecc71 : 0xf1c40f).setOrigin(0, 0.5);

    const startY = 100;
    // 상장 개수가 늘어나도 닫기 버튼과 겹치지 않도록, 남은 세로 공간에 맞춰 한 줄 높이를 자동으로 조절
    const availableH = (height - 34 - 20) - startY;
    const rowH = Math.min(33, availableH / ACHIEVEMENT_DEFS.length);
    ACHIEVEMENT_DEFS.forEach((ach, i) => {
      const y = startY + i * rowH;
      const unlocked = Achievements.isUnlocked(ach.id);
      this.add.rectangle(width/2, y, 1180, rowH - 4, unlocked ? 0x1e8449 : 0x2c3e50, 0.7).setOrigin(0.5);
      this.add.text(width/2 - 570, y, unlocked ? ach.icon : '🔒', { fontSize: '20px' }).setOrigin(0, 0.5);
      this.add.text(width/2 - 530, y, ach.name, { fontSize: '17px', color: unlocked ? '#fff' : '#95a5a6', fontStyle: 'bold' }).setOrigin(0, 0.5);
      this.add.text(width/2 - 210, y, ach.desc, { fontSize: '13px', color: unlocked ? '#d5f5e3' : '#7f8c8d' }).setOrigin(0, 0.5);
      this.add.text(width/2 + 430, y, `🪙${ach.goldReward}G`, { fontSize: '13px', color: unlocked ? '#f1c40f' : '#7f8c8d' }).setOrigin(0.5, 0.5);

      let progressStr;
      if (ach.threshold !== undefined) {
        const val = Math.min(statFor(ach.category), ach.threshold);
        progressStr = `${val}/${ach.threshold}`;
      } else {
        progressStr = unlocked ? '✓ 달성' : '미달성';
      }
      this.add.text(width/2 + 560, y, progressStr, { fontSize: '14px', color: unlocked ? '#f1c40f' : '#7f8c8d', fontStyle: 'bold' }).setOrigin(1, 0.5);
    });

    const closeBtn = this.add.text(width/2, height - 34, '닫기', { fontSize: '24px', color: '#fff', backgroundColor: '#e74c3c', padding: { x: 30, y: 8 }, borderRadius: 10 }).setOrigin(0.5).setInteractive({ useHandCursor: true });
    closeBtn.on('pointerdown', () => { SFX.click(); this.scene.stop(); this.scene.resume('TitleScene'); });
  }
}

// ═══ UI 리뉴얼: 화면/문구/색상만 수정하려면 이 구역과 #school-ui-theme를 편집하세요. ═══
const SchoolUI = {
  selected: 0, supplies: (()=>{try{const s=JSON.parse(localStorage.getItem('schoolPendingSupplies'))||{};return Object.fromEntries(['oneTimeMagnet','oneTimeBomb','oneTimeStartItem'].filter(k=>s[k]===true).map(k=>[k,true]));}catch{return {};}})(),
  saveSupplies() { localStorage.setItem('schoolPendingSupplies',JSON.stringify(this.supplies)); },
  num(key) { return Math.max(0, parseInt(localStorage.getItem(key)) || 0); },
  fmt(value) { return Number(value || 0).toLocaleString('ko-KR'); },
  esc(value) { return String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); },
  time(t) { return `${String(Math.floor((t||0)/60)).padStart(2,'0')}:${String(Math.floor((t||0)%60)).padStart(2,'0')}`; },
  chars() { return [
    {name:'회장',tex:'player',weapon:'praise',role:'수집에 유리',desc:'경험치를 줍는 범위가 30% 넓어요.'},
    {name:'장난꾸러기',tex:'player_2',weapon:'airplane',role:'종이 비행기 공격',desc:'운동장에서 종이 비행기를 날리며 시작해요.'},
    {name:'운동선수',tex:'player_3',weapon:'soccer',role:'치명타 공격',desc:'치명타 확률 +20% · 튕기는 축구공으로 공격'},
    {name:'음악가',tex:'player_4',weapon:'recorder',role:'빠른 공격',desc:'모든 무기의 대기시간이 10% 짧아요.'},
    {name:'미술부원',tex:'player_5',weapon:'paint',role:'넓은 범위',desc:'웅덩이·안전지대 등 바닥에 남는 무기의 범위 +20%'},
    {name:'모범생',tex:'player_6',weapon:['library','praise'],role:'빠른 성장',desc:'경험치 획득량 +20% · 무기 2개로 시작',locked:!this.num('charScholarUnlocked'),cost:10000},
    {name:'선생님',tex:'player_7',weapon:'praise',role:'히든 캐릭터',desc:'모든 상장을 모으면 함께할 수 있어요.',locked:!Achievements.isUnlocked('teacher_unlock')}
  ]; },
  upgrades:[['upgHp','♥','체력 단련','레벨당 최대 체력 +15',5],['upgSpeed','↗','달리기 연습','이동속도 증가',5],['upgExp','✦','매점 VIP','경험치 획득량 증가',5],['upgMagnet','◎','자력 증가','아이템 수집 범위 증가',5],['upgStartItem','▣','선행 학습','시작 무기 추가',2]],
  items:[['oneTimeMagnet','🧲','강력 자석','주변 아이템 수집 · Z',30],['oneTimeBomb','💣','싹쓸이 폭탄','주변 방해꾼 정리 · X',50],['oneTimeStartItem','📖','선행 학습','이번 판 시작 무기 +1',500]],
  toast(message) {
    document.querySelector('.ui-toast')?.remove();
    const node=document.createElement('div'); node.className='ui-toast'; node.setAttribute('role','status'); node.textContent=message; document.body.append(node); setTimeout(()=>node.remove(),3000);
  },
  mount(scene, html, cls='modal-layer', onEscape) {
    scene._ui?.remove();
    const node=document.createElement('section'); node.className=`ui-layer ${cls}`; node.innerHTML=html; document.body.append(node); scene._ui=node;
    const previous=document.activeElement;
    const modal=cls==='modal-layer';
    if(modal){node.setAttribute('role','dialog');node.setAttribute('aria-modal','true');node.setAttribute('aria-label',node.querySelector('h2')?.textContent||'게임 메뉴');window.hideMobileControls?.();document.querySelector('.hud-layer')?.setAttribute('inert','');document.querySelector('.lobby')?.setAttribute('inert','');}
    const key=e=>{
      if(e.key==='Escape'&&onEscape){e.preventDefault();e.stopPropagation();onEscape();}
      if(modal&&e.key==='Tab'){const list=[...node.querySelectorAll('button:not(:disabled),[tabindex="0"]')];const first=list[0],last=list.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus();}}
    };
    node.addEventListener('keydown',key);
    if(cls!=='hud-layer') requestAnimationFrame(()=>node.querySelector('.primary:not(:disabled),.choice,button:not(:disabled)')?.focus({preventScroll:true}));
    scene.events.once('shutdown',()=>{node.remove();if(modal){document.querySelector('.hud-layer')?.removeAttribute('inert');document.querySelector('.lobby')?.removeAttribute('inert');if(previous?.isConnected)previous.focus();}if(scene._ui===node)scene._ui=null;});
    return node;
  },
  button(root, selector, action) { root.querySelector(selector)?.addEventListener('click',action); },
  resume(scene) { SFX.click(); scene.scene.resume('GameScene'); scene.scene.stop(); },
  home(scene) { scene.scene.stop('GameScene');scene.scene.stop('UIScene');scene.scene.start('TitleScene'); },
  dialog(title, sub, body, footer='', narrow=false) { return `<div class="dialog ${narrow?'narrow':''}"><header class="dialog-header"><div><p class="eyebrow">SCHOOL SURVIVAL</p><h2>${title}</h2><p class="muted small">${sub}</p></div></header>${body}${footer?`<footer class="dialog-footer">${footer}</footer>`:''}</div>`; },
  stats(scene) { const r=scene.registry;return `<div class="result-stats"><div><strong>${this.time(r.get('time'))}</strong><span>생존 시간</span></div><div><strong>${r.get('level')||1}</strong><span>도달 레벨</span></div><div><strong>${this.fmt(r.get('kills'))}</strong><span>물리친 방해꾼</span></div></div>`; }
};

span class="tag">영구</span></div><div class="shop">${upgradeRows}</div></section><section class="panel"><div class="panel-heading"><div><h2>오늘의 준비물</h2><p class="muted small">선택 구매 · 다음 한 판에만 적용</p></div><span class="tag">1회</span></div><div class="supply-list">${supplies}</div></section></div></div><footer class="footer-note"><span>경험치를 모으고, 무기를 고르고, 더 오래 살아남으세요.</span><span>진행도는 현재 브라우저에 자동 저장됩니다.</span></footer></main>`,'lobby');

    if(focus)requestAnimationFrame(()=>root.querySelector(focus)?.focus({preventScroll:true}));
  };
  render();

// 레벨업/보물상자의 후보 생성과 보상 계산은 원래 게임 로직을 그대로 사용합니다.
const originalLevelCreate=LevelUpScene.prototype.create;
LevelUpScene.prototype.create=function(){
  originalLevelCreate.call(this);
  const cards=this.children.list.filter(o=>o.type==='Container');
  const choices=cards.map(card=>({bg:card.list[0],title:card.list[1].text,desc:card.list[2].text,icon:card.list[3].text}));
  this.children.list.forEach(o=>o.setVisible(false));

  let picked=false;const choose=i=>{if(picked||!choices[i])return;picked=true;choices[i].bg.emit('pointerdown');};
  root.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>choose(Number(b.dataset.choice)));
  root.addEventListener('keydown',e=>{if(['1','2','3'].includes(e.key)){e.preventDefault();choose(Number(e.key)-1);}});
};

  const root=U.mount(this,U.dialog('내 가방','게임이 일시정지되었습니다. 장착한 무기와 장비를 확인하세요.',`<div class="inventory-grid"><section><h3>⚔ 무기 · 자동 공격</h3>${section('active')}</section><section><h3>◈ 장비 · 능력 강화</h3>${section('passive')}</section></div>`,'<button class="btn primary" id="bag-close">게임으로 돌아가기 <kbd>Esc</kbd></button>'),'modal-layer',()=>U.resume(this));

AchievementScene.prototype.create=function(){

  const stat={kills:'totalKills',plays:'totalPlays',survival:'bestSurvival',items:'totalItems'};
  const rows=ACHIEVEMENT_DEFS.map(a=>{const done=Achievements.isUnlocked(a.id),v=Math.min(a.threshold||1,Achievements.getStat(stat[a.category]));return `<div class="achievement-row"><span style="font-size:26px">${a.icon}</span><div><h3>${U.esc(a.name)} ${done?'<span class="tag green">달성 ✓</span>':''}</h3><p>${U.esc(a.desc)}</p>${a.threshold?`<progress value="${done?a.threshold:v}" max="${a.threshold}" aria-label="${U.esc(a.name)} 진행도"></progress><p>${U.fmt(done?a.threshold:v)} / ${U.fmt(a.threshold)}</p>`:''}</div><span class="gold small">+${U.fmt(a.goldReward)} G</span></div>`;}).join('');

GameOverScene.prototype.create=function(){window.hideMobileControls?.();const U=SchoolUI;const root=U.mount(this,U.dialog('오늘의 도전, 수고했어요!','모은 골드로 성장하고 다시 도전해 보세요.',U.stats(this),'<button class="btn primary" id="home">상점과 캐릭터 선택으로 →</button>',true));U.button(root,'#home',()=>U.home(this));};
const originalClearCreate=GameClearScene.prototype.create;
GameClearScene.prototype.create=function(){originalClearCreate.call(this);this.children.list.forEach(o=>o.setVisible(false));const U=SchoolUI,root=U.mount(this,U.dialog('졸업을 축하합니다!','30분 생존 성공 · 방과후에도 도전을 이어갈 수 있어요.',U.stats(this),'<button class="btn" id="home">하교하기</button><button class="btn primary" id="continue">방과후 계속하기 →</button>',true));U.button(root,'#home',()=>U.home(this));U.button(root,'#continue',()=>U.resume(this));};
class PauseScene extends Phaser.Scene {
  constructor(){super('PauseScene');}
  create(){const U=SchoolUI;const root=U.mount(this,U.dialog('잠깐 쉬어가세요','게임이 일시정지되었습니다.',`${U.stats(this)}<p class="muted">이동: WASD / 방향키 · 공격: 자동<br>자석: Z · 폭탄: X · 일시정지: Esc</p>`,'<button class="btn danger" id="leave">메인으로 나가기</button><button class="btn primary" id="resume">계속하기 <kbd>Esc</kbd></button>',true),'modal-layer',()=>U.resume(this));U.button(root,'#resume',()=>U.resume(this));U.button(root,'#leave',()=>{root.querySelector('.dialog').innerHTML=U.dialog('이번 도전을 마칠까요?','모은 골드는 보관되지만, 현재 판은 이어할 수 없어요.','', '<button class="btn" id="cancel">계속 쉬기</button><button class="btn danger" id="confirm">도전 마치기</button>',true);U.button(root,'#cancel',()=>{this.scene.restart();});U.button(root,'#confirm',()=>U.home(this));root.querySelector('#cancel').focus();});}

const originalUICreate=UIScene.prototype.create,originalUIUpdate=UIScene.prototype.update;
UIScene.prototype.create=function(){
  originalUICreate.call(this);
  // 기존 미니맵과 화면 효과는 유지하고, HUD 텍스트/버튼을 반응형 HTML로 교체합니다.
  this.children.list.forEach(o=>{if(o.type==='Text'||o===this.expBar||o.input||this.consumableSlots.some(s=>[s.bg,s.ico,s.keyLbl].includes(o)))o.setVisible(false);});
  this.children.list[0].setVisible(false);
  this.bossBars.forEach(bar=>{bar.nameText.setVisible(false);bar.barBg.setVisible(false);bar.barFill.setVisible(false);});
  const U=SchoolUI,root=U.mount(this,`<div class="hud-top"><div class="hud-box"><div class="hp-label"><strong id="hud-level">Lv.1</strong><span id="hud-hp">체력 100 / 100</span></div><div class="hp-meter" role="meter" aria-label="체력" aria-valuemin="0"><span id="hp-fill"></span></div><div class="exp-meter" role="meter" aria-label="경험치" aria-valuemin="0"><span id="exp-fill"></span></div></div><div class="hud-box clock"><small>생존 시간</small><strong id="hud-time">00:00</strong></div><div class="hud-box hud-right"><div>방해꾼 <strong id="hud-kills">0</strong> 처치</div><div class="gold">◈ <span id="hud-gold">0</span> G</div></div></div><div class="hud-actions"><button class="btn" id="hud-bag">🎒 내 가방</button><button class="btn" id="hud-pause">Ⅱ 일시정지</button><button class="btn" id="hud-sound" aria-label="소리 켜기 또는 끄기">${SFX.isMuted()?'🔇':'🔊'}</button></div><div class="hud-box hud-boss" id="boss-list" hidden></div><div class="hud-consumables"><button class="btn" id="use-magnet">🧲 자석 <kbd>Z</kbd></button><button class="btn" id="use-bomb">💣 폭탄 <kbd>X</kbd></button></div>`,'hud-layer');
  this.domRefs=Object.fromEntries([...root.querySelectorAll('[id]')].map(n=>[n.id,n]));
  const open=name=>{if(!this.scene.isActive('GameScene'))return;SFX.click();this.scene.pause('GameScene');this.scene.launch(name);};
  U.button(root,'#hud-bag',()=>open('InventoryScene'));U.button(root,'#hud-pause',()=>open('PauseScene'));U.button(root,'#hud-sound',()=>{SFX.toggleMuted();this.domRefs['hud-sound'].textContent=SFX.isMuted()?'🔇':'🔊';});
  U.button(root,'#use-magnet',()=>{if(this.scene.isActive('GameScene'))window.touchZPressed=true;});U.button(root,'#use-bomb',()=>{if(this.scene.isActive('GameScene'))window.touchXPressed=true;});
  const pauseKey=e=>{if(e.key==='Escape'&&this.scene.isActive('GameScene')){e.preventDefault();open('PauseScene');}};document.addEventListener('keydown',pauseKey);this.events.once('shutdown',()=>document.removeEventListener('keydown',pauseKey));
};
UIScene.prototype.update=function(time,delta){
  originalUIUpdate.call(this,time,delta);
  this.bossBars.forEach(bar=>{bar.nameText.setVisible(false);bar.barBg.setVisible(false);bar.barFill.setVisible(false);});
  if(!this.domRefs)return;const r=this.registry,d=this.domRefs,U=SchoolUI,gs=this.scene.get('GameScene');
  const set=(id,text)=>{if(d[id].textContent!==String(text))d[id].textContent=text;};
  set('hud-level',`Lv.${r.get('level')||1}`);set('hud-hp',`체력 ${Math.max(0,Math.floor(r.get('hp')||0))} / ${r.get('maxHp')||100}`);set('hud-time',U.time(r.get('time')));set('hud-kills',U.fmt(r.get('kills')));set('hud-gold',U.fmt(U.num('gold')));
  const hp=Math.max(0,Math.min(1,(r.get('hp')||0)/(r.get('maxHp')||1))),exp=Math.min(1,(r.get('exp')||0)/(r.get('maxExp')||1));
  d['hp-fill'].style.width=`${hp*100}%`;d['exp-fill'].style.width=`${exp*100}%`;
  for(const [id,value,max] of [['hp-fill',Math.max(0,r.get('hp')||0),r.get('maxHp')||1],['exp-fill',r.get('exp')||0,r.get('maxExp')||1]]){d[id].parentElement.setAttribute('aria-valuenow',value);d[id].parentElement.setAttribute('aria-valuemax',max);}
  d['use-magnet'].disabled=!gs.consumables?.magnet;d['use-bomb'].disabled=!gs.consumables?.bomb;
  const bosses=(gs.enemies?.getChildren()||[]).filter(e=>e.active&&e.isBoss).sort((a,b)=>(a.hp/(a.maxHp||a.hp))-(b.hp/(b.maxHp||b.hp)));
  const limit=this.MAX_BOSS_BARS||3,shown=bosses.slice(0,limit),extra=Math.max(0,bosses.length-limit),list=d['boss-list'];list.hidden=!bosses.length;
  while(list.children.length<shown.length){const row=document.createElement('div');row.innerHTML='<span></span><progress></progress>';list.append(row);}
  while(list.children.length>shown.length)list.lastElementChild.remove();
  shown.forEach((boss,i)=>{const row=list.children[i],label=({boss_shooter:'종합평가',boss_tank:'단원평가',boss_final:'방학숙제'})[boss.enemyType]||'보스';row.firstElementChild.textContent=label+(i===shown.length-1&&extra?' 외 '+extra+'마리':'');const bar=row.lastElementChild;bar.max=boss.maxHp||boss.hp||1;bar.value=Math.max(0,boss.hp);bar.setAttribute('aria-label',label+' '+(i+1)+' 체력');});
};


const config = {
  type: Phaser.AUTO, width: 1280, height: 720, parent: 'game-container', pixelArt: true, roundPixels: true,
  scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
  physics: { default: 'arcade', arcade: { gravity: { y: 0 }, debug: false } },
  scene: [BootScene, TitleScene, GameScene, UIScene, LevelUpScene, ChestScene, GameOverScene, InventoryScene, GameClearScene, AchievementScene, ToastScene, PauseScene]
};
// 🈶 웹폰트(Noto Sans KR) 로드를 기다린 뒤 게임 시작 - 캔버스 텍스트는 그려진 후엔
// 폰트가 나중에 로드돼도 다시 그려지지 않으므로, 첫 렌더링 전에 폰트 준비를 보장한다.
// (네트워크 문제 등으로 폰트 로드가 오래 걸리면 1.5초 뒤 타임아웃으로 그냥 시작)
(function startGameWhenFontReady() {
  const start = () => { if (!window.__gameStarted) { window.__gameStarted = true; new Phaser.Game(config); } };
  if (window.document && document.fonts && document.fonts.load) {
    const fontPromise = Promise.all([
      document.fonts.load('400 16px "Noto Sans KR"'),
      document.fonts.load('700 16px "Noto Sans KR"'),
      document.fonts.load('900 16px "Noto Sans KR"')
    ]).catch(() => {});
    const timeout = new Promise((resolve) => setTimeout(resolve, 1500));
    Promise.race([fontPromise, timeout]).then(start);
  } else {
    start();
  }
})();
  </script>
