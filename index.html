      enemy.setTint(0xfff2a8);
    }
  }

  spawnBoss() {
    SFX.bossWarn();
    const enemy = this.enemies.get();
    if (enemy) {
      const angle = Phaser.Math.Between(0, 360);
      const radius = 900;
      const x = this.player.x + radius * Math.cos(angle * Math.PI/180);
      const y = this.player.y + radius * Math.sin(angle * Math.PI/180);
      
      enemy.enableBody(true, x, y, true, true);
      enemy.spawnId = ++this.enemySpawnCounter;
      enemy.clearTint();
      enemy.enemyType = 'boss_shooter'; // 종합평가: 탱커형 대신 탄막을 발사하는 공격형 보스

      enemy.setTexture('enemy_boss');
      const time = this.registry.get('time');
      const level = this.registry.get('level');
      
      enemy.hp = 700 + (level * 40) + (time * 10); // 5분마다 등장하는 만큼 적당히 유지하되 탱커형보다는 낮춤
      enemy.maxHp = enemy.hp; // 보스 체력바 표시용
      enemy.speed = 50 + Math.min(30, Math.floor(time / 15)); // 거리를 유지하며 탄막을 쏘므로 이동은 다소 느리게
      enemy.isBoss = true;
      enemy.lastRingTime = this.time.now + 800; // 등장 직후 바로 쏟아지지 않도록 약간의 유예
      enemy.lastSpreadTime = this.time.now + 2000;
      enemy.setScale(2.5);
      this.finalBossActive = true; // 종합평가가 살아있는 동안 단원평가 등장 억제

      let warn = this.add.text(this.player.x, this.player.y - 150, '⚠️ 공포의 종합 평가가 탄막을 준비합니다! ⚠️', { fontSize: '32px', fill: '#e74c3c', fontStyle: 'bold', stroke: '#000', strokeThickness: 5 }).setOrigin(0.5);
      this.tweens.add({ targets: warn, alpha: 0, duration: 3000, onComplete: () => warn.destroy() });
    }
  }

  spawnUnitTestBoss() {
    SFX.bossWarn();
    // 단원평가: 60초마다 등장하는 탱커형 보스 (탄막 없이 맷집+돌진 위주)
    const enemy = this.enemies.get();
    if (enemy) {
      const angle = Phaser.Math.Between(0, 360);
      const radius = 900;
      const x = this.player.x + radius * Math.cos(angle * Math.PI/180);
      const y = this.player.y + radius * Math.sin(angle * Math.PI/180);

      enemy.enableBody(true, x, y, true, true);
      enemy.spawnId = ++this.enemySpawnCounter;
      enemy.enemyType = 'boss_tank';

      enemy.setTexture('enemy_boss');
      enemy.setTint(0x95a5a6); // 종합평가(빨강 계열 없음)와 구분되는 회색 톤
      const time = this.registry.get('time');
      const level = this.registry.get('level');

      enemy.hp = 550 + (level * 35) + (time * 9); // 탱커형답게 체력을 크게 상향 (기존 300+25*lv+6*t 대비 대폭 증가)
      enemy.maxHp = enemy.hp; // 보스 체력바 표시용
      enemy.speed = 70 + Math.min(50, Math.floor(time / 10));
      enemy.isBoss = true;
      enemy.isDashing = false;
      enemy.lastDash = this.time.now + 1500; // 등장 직후 바로 돌진하지 않도록 약간의 유예
      enemy.setScale(2.0);

      let warn = this.add.text(this.player.x, this.player.y - 150, '⚠️ 공포의 단원 평가가 찾아옵니다! ⚠️', { fontSize: '28px', fill: '#e67e22', fontStyle: 'bold', stroke: '#000', strokeThickness: 5 }).setOrigin(0.5);
      this.tweens.add({ targets: warn, alpha: 0, duration: 3000, onComplete: () => warn.destroy() });
    }
  }

  spawnHomeworkBoss() {
    SFX.bossWarn();
    // 방학숙제: 15분마다 등장하는 최종보스. 탄막(종합평가)+돌진(단원평가) 패턴을 모두 사용하며
    // 체력이 50% 이하로 떨어지면 폭주(2페이즈)해서 더 자주, 더 강하게 공격합니다.
    const enemy = this.enemies.get();
    if (enemy) {
      const angle = Phaser.Math.Between(0, 360);
      const radius = 900;
      const x = this.player.x + radius * Math.cos(angle * Math.PI/180);
      const y = this.player.y + radius * Math.sin(angle * Math.PI/180);

      enemy.enableBody(true, x, y, true, true);
      enemy.spawnId = ++this.enemySpawnCounter;
      enemy.enemyType = 'boss_final';

      enemy.setTexture('enemy_boss');
      enemy.setTint(0xf39c12); // 다른 두 보스와 구분되는 금빛 톤
      const time = this.registry.get('time');
      const level = this.registry.get('level');

      enemy.hp = 5200 + (level * 130) + (time * 35); // 🔥 난이도 대폭 상승: 최종보스다운 압도적인 체력 (기존 3000+80*lv+20*t 대비 큰 폭 상향)
      enemy.maxHp = enemy.hp; // 보스 체력바 & 페이즈 전환 판정용
      enemy.speed = 75 + Math.min(55, Math.floor(time / 12)); // 이동속도도 함께 상향
      enemy.isBoss = true;
      enemy.isDashing = false;
      enemy.enrageAnnounced = false;
      enemy.lastDash = this.time.now + 2500; // 등장 직후 유예
      enemy.lastRingTime = this.time.now + 1200;
      enemy.setScale(3.2);
      this.finalBossActive = true; // 단원평가 스폰 억제
      this.homeworkBossActive = true; // 종합평가 스폰 억제

      let warn = this.add.text(this.player.x, this.player.y - 150, '🚨 산더미 방학숙제가 나타났습니다! 🚨', { fontSize: '34px', fill: '#f39c12', fontStyle: 'bold', stroke: '#000', strokeThickness: 6 }).setOrigin(0.5);
      this.tweens.add({ targets: warn, alpha: 0, duration: 3500, onComplete: () => warn.destroy() });

      // 🌑 최종보스 등장을 강조하기 위해 화면을 살짝 어둡게 (경고 문구와 비슷한 시간 동안 유지)
      this.registry.set('bossVignette', true);
      this.time.delayedCall(3500, () => this.registry.set('bossVignette', false));
    }
  }

  // ─── 📓 알림장 검사: 초록 안전지대 밖에 있으면 도트 피해 (이동할 여유 시간을 충분히 줌) ────────────────
  triggerNoticeCheck() {
    const zoneRadius = 130;
    const graceTime = 5000;   // 안전지대로 이동할 여유 시간 (충분히 길게)
    const dangerTime = 6000;  // 위험 구간 지속 시간
    const tickDamage = 8;

    // 플레이어 근처지만 걸어서 이동할 만한 약간의 거리를 두고 안전지대 위치 선정
    const angle = Phaser.Math.Between(0, 360) * Math.PI / 180;
    const dist = Phaser.Math.Between(180, 260);
    const zx = Phaser.Math.Clamp(this.player.x + Math.cos(angle) * dist, 150, 3850);
    const zy = Phaser.Math.Clamp(this.player.y + Math.sin(angle) * dist, 150, 3850);

    // 경고 문구
    let warn = this.add.text(zx, zy - zoneRadius - 30, '📓 알림장 검사! 초록 안전지대로 이동하세요!', { fontSize: '22px', fill: '#2ecc71', fontStyle: 'bold', stroke: '#000', strokeThickness: 4 }).setOrigin(0.5);
    this.tweens.add({ targets: warn, alpha: 0, duration: 2000, delay: graceTime, onComplete: () => warn.destroy() });

    // 안전지대 시각화 (초록 원, 점점 옅어지다가 사라짐)
    const zone = this.add.circle(zx, zy, zoneRadius, 0x2ecc71, 0.25);
    zone.setStrokeStyle(4, 0x2ecc71, 0.9);

    // 여유 시간이 지난 뒤에만 위험 구간(도트 데미지) 시작
    this.time.delayedCall(graceTime, () => {
      const ticks = Math.floor(dangerTime / 1000);
      this.time.addEvent({
        delay: 1000,
        repeat: ticks - 1,
        callback: () => {
          if (!this.player.active) return;
          const d = Phaser.Math.Distance.Between(this.player.x, this.player.y, zx, zy);
          if (d > zoneRadius) {
            const dmg = Math.max(1, tickDamage - this.stats.armor);
            this.damagePlayer(dmg);
          }
        }
      });
    });

    // 위험 구간까지 모두 끝나면 안전지대 이펙트 정리
    this.time.delayedCall(graceTime + dangerTime, () => {
      this.tweens.add({ targets: zone, alpha: 0, duration: 500, onComplete: () => zone.destroy() });
    });
  }

  // ─── 🟥 보스 전용 바닥 위험지대: 몬스터에겐 영향 없이 플레이어에게만 피해를 주는 장판 공격 ────────────────
  spawnBossGroundHazard(zoneCount = 2, dmg = 15, zoneRadius = 80, telegraphTime = 1200) {
    for (let i = 0; i < zoneCount; i++) {
      const angle = Phaser.Math.Between(0, 360) * Math.PI / 180;
      const dist = Phaser.Math.Between(80, 260);
      const zx = Phaser.Math.Clamp(this.player.x + Math.cos(angle) * dist, 100, 3900);
      const zy = Phaser.Math.Clamp(this.player.y + Math.sin(angle) * dist, 100, 3900);

      // 경고 표시 (반투명 빨간 테두리 원 - 아직 피해 없음)
      const warnZone = this.add.circle(zx, zy, zoneRadius, 0xe74c3c, 0.2);
      warnZone.setStrokeStyle(3, 0xe74c3c, 0.8);

      this.time.delayedCall(telegraphTime, () => {
        // 활성화 순간 - 플레이어가 안에 있으면 피해를 주고, 몬스터는 완전히 무시함
        warnZone.setFillStyle(0xe74c3c, 0.55);
        if (this.player.active) {
          const d = Phaser.Math.Distance.Between(this.player.x, this.player.y, zx, zy);
          if (d <= zoneRadius) {
            const finalDmg = Math.max(1, dmg - this.stats.armor);
            this.damagePlayer(finalDmg);
          }
        }
        this.tweens.add({ targets: warnZone, alpha: 0, duration: 400, delay: 200, onComplete: () => warnZone.destroy() });
      });
    }
  }

  flashEnemy(enemy) {
    if (enemy.active) {
      enemy.setTintFill(0xffffff);
      const sid = enemy.spawnId;
      this.time.delayedCall(100, () => { if (enemy.active && enemy.spawnId === sid) enemy.clearTint(); });
    }
  }

  hitEnemyWithProjectile(proj, enemy) {
    if (proj.active && enemy.active) {
      if (enemy.enemyType === 'projectile') return; // 🔴 보스 탄막(총알류)은 파괴 불가능 - 반드시 피해야 함. 스마트폰 투척물(smartphone_shot)은 여기 해당 없이 아래에서 정상적으로 몬스터처럼 파괴됨
      if (!enemy.lastProjHit || this.time.now - enemy.lastProjHit > 200 || proj.weaponType === 'praise') {
        enemy.hp -= proj.damage;
        enemy.lastProjHit = this.time.now;
        this.flashEnemy(enemy);
        
        // 비눗방울 슬로우 효과
        if (proj.weaponType === 'bubble' && !enemy.isSlowed) {
          enemy.isSlowed = true;
          enemy.speed *= 0.5;
          const sid1 = enemy.spawnId;
          this.time.delayedCall(3000, () => {
            if (enemy.active && enemy.spawnId === sid1) {
              enemy.speed *= 2;
              enemy.isSlowed = false;
            }
          });
        }
        // 알코올램프 불꽃 화상(도트 데미지) 효과
        if (proj.weaponType === 'alcohol' && !enemy.isBurned) {
          enemy.isBurned = true;
          const sid3 = enemy.spawnId;
          let burnTicks = 3;
          let burnEvent = this.time.addEvent({
            delay: 500,
            repeat: burnTicks - 1,
            callback: () => {
              if (enemy.active && enemy.spawnId === sid3) {
                enemy.hp -= proj.damage * 0.5; // 불꽃 데미지의 절반을 화상으로 줌
                this.flashEnemy(enemy);
                enemy.setTintFill(0xe74c3c); // 빨간색으로 깜빡임
                this.time.delayedCall(100, () => { if (enemy.active && enemy.spawnId === sid3) enemy.clearTint(); });
                this.checkEnemyDeath(enemy);
              }
            }
          });
          this.time.delayedCall(1500, () => { if (enemy.active && enemy.spawnId === sid3) enemy.isBurned = false; });
        }
        
        // 안전거리 유지(jumprope) / 딱지치기(ddakji) 밀쳐내기 넉백 효과
        if (proj.weaponType === 'jumprope' || proj.weaponType === 'ddakji') {
          const kb = proj.weaponType === 'ddakji' ? 70 : 40;
          enemy.x += Math.cos(Phaser.Math.Angle.Between(this.player.x, this.player.y, enemy.x, enemy.y)) * kb;
          enemy.y += Math.sin(Phaser.Math.Angle.Between(this.player.x, this.player.y, enemy.x, enemy.y)) * kb;
        }
        
        // ⚽ 축구공(비진화): 관통하지 않고 가장 가까운 다른 방해꾼 쪽으로 최대 2번 튕김
        if (proj.weaponType === 'soccer' && !proj.isEvo) {
          proj.bounceCount++;
          if (proj.bounceCount > proj.maxBounces) {
            proj.disableBody(true, true);
          } else {
            const nextTarget = this.getClosestEnemyFrom(proj.x, proj.y, enemy);
            let newAngle;
            if (nextTarget) {
              newAngle = Phaser.Math.Angle.Between(proj.x, proj.y, nextTarget.x, nextTarget.y);
            } else {
              // 튕길 다른 방해꾼이 없으면 들어온 방향의 반대쪽(+약간의 랜덤)으로 튕겨나감
              const incomingAngle = Math.atan2(proj.body.velocity.y, proj.body.velocity.x);
              newAngle = incomingAngle + Math.PI + Phaser.Math.Between(-30, 30) * Math.PI / 180;
            }
            const speed = proj.soccerSpeed || 550;
            proj.setVelocity(Math.cos(newAngle) * speed, Math.sin(newAngle) * speed);
          }
          this.checkEnemyDeath(enemy);
          return;
        }

        const noPierceTypes = ['notice', 'bubble', 'water', 'orbit', 'cleanroom', 'library', 'jumprope', 'ddakji'];
        if (!noPierceTypes.includes(proj.weaponType)) {
          proj.pierce--;
          if(proj.pierce < 0) {
            if (proj.weaponType === 'praise') proj.destroy();
            else proj.disableBody(true, true);
          }
        } else if (proj.weaponType === 'bubble' || proj.weaponType === 'water' || proj.weaponType === 'library') {
          proj.pierce--;
          if (proj.pierce <= 0) {
            proj.disableBody(true, true);
          }
        }
        this.checkEnemyDeath(enemy);
      }
    }
  }

  // 레벨업에 필요한 경험치량 계산. 기존엔 매번 1.3배씩 곱해서(지수 증가) 초반은 금방 오르다가
  // 후반부(레벨 15~20 이후)로 갈수록 필요량이 기하급수적으로 폭증해 사실상 안 오르는 문제가 있었음.
  // 곱셈 증가 대신 완만한 2차함수 증가로 바꿔서, 초반은 조금 더 천천히 / 후반은 훨씬 빠르게 오르도록 조정.
  // 🎚️ 밸런스 패치: 초반 레벨업이 너무 쉬웠던 문제 - 기본값/1차항을 올려 저레벨 구간의 요구 경험치를 30~50%
  // 늘리되, 2차항 증가폭은 최소화해 후반 레벨업 속도(강해지는 속도)는 기존과 크게 다르지 않게 유지.
  getMaxExpForLevel(level) {
    return Math.floor(30 + level * 16 + level * level * 2.4);
  }

  checkEnemyDeath(enemy) {
    if (enemy.hp <= 0) {
      const wasBomb = enemy.enemyType === 'bomb';
      const bx = enemy.x, by = enemy.y;
      enemy.disableBody(true, true);
      this.registry.set('kills', this.registry.get('kills') + 1);

      // 🏆 업적: 누적 방해꾼 처치 수
      const totalKills = Achievements.addStat('totalKills', 1);
      Achievements.showToasts(this, Achievements.checkCategory('kills', totalKills));

      // 숙제 폭탄: 처치되는 순간 주변에 폭발 피해
      if (wasBomb) {
        this.explodeHomeworkBomb(bx, by, enemy);
      }
      
      if (enemy.isBoss) {
        enemy.isBoss = false;
        SFX.bossDefeat();

        // 🏆 업적: 첫 보스 처치
        const bossAch = Achievements.unlock('first_boss');
        if (bossAch) Achievements.showToasts(this, [bossAch]);

        const isFinalBoss = enemy.enemyType === 'boss_shooter'; // 종합평가(공격형) 여부
        const isHomeworkBoss = enemy.enemyType === 'boss_final'; // 방학숙제(최종보스) 여부
        if (isFinalBoss && !this.homeworkBossActive) this.finalBossActive = false; // 종합평가가 쓰러지면 단원평가가 다시 등장 가능 (방학숙제가 활동 중이면 계속 억제)
        if (isHomeworkBoss) { this.finalBossActive = false; this.homeworkBossActive = false; } // 방학숙제가 쓰러지면 모든 억제 해제
        const chestCount = isHomeworkBoss ? 4 : (isFinalBoss ? 2 : 1); // 방학숙제: 4개 / 종합평가: 2개 / 단원평가: 1개
        // 보스를 근접해서 쓰러뜨렸을 때 상자가 플레이어 몸 위에 바로 생겨
        // 보상 화면이 즉시 열리고 게임이 멈춘 것처럼 보이지 않도록, 플레이어의
        // 반대 방향에 부채꼴로 펼쳐 놓는다.
        const awayAngle = Math.atan2(by - this.player.y, bx - this.player.x);
        const spread = chestCount > 1 ? BOSS_REWARD_DROP.spread : 0;
        for (let i = 0; i < chestCount; i++) {
          const item = this.items.get();
          if (item) {
            const offset = chestCount > 1 ? -spread / 2 + spread * (i / (chestCount - 1)) : 0;
            const radius = BOSS_REWARD_DROP.radius + (i % 2) * 12;
            const chestX = Phaser.Math.Clamp(
              bx + Math.cos(awayAngle + offset) * radius,
              BOSS_REWARD_DROP.edgePadding,
              4000 - BOSS_REWARD_DROP.edgePadding
            );
            const chestY = Phaser.Math.Clamp(
              by + Math.sin(awayAngle + offset) * radius,
              BOSS_REWARD_DROP.edgePadding,
              4000 - BOSS_REWARD_DROP.edgePadding
            );
            item.enableBody(true, chestX, chestY, true, true);
            item.setTexture('chest').setScale(2.0);
            item.itemType = 'chest';
            item.pickupReadyAt = this.time.now + BOSS_REWARD_DROP.pickupDelay;
          }
        }
      } else {
        SFX.killThrottled();
        const exp = this.exps.get();
        if (exp) {
          exp.enableBody(true, enemy.x, enemy.y, true, true);
          exp.setTexture('exp');
        }
        
        let rand = Math.random();
        // 용돈기입장(moneybook) 레벨당 골드 드랍 확률 +2%p (자석/폭탄 확률 폭은 그대로 유지)
        const goldExtra = this.skills.moneybook * 0.02;
        if (rand < 0.03) {
          const item = this.items.get();
          if (item) {
            item.enableBody(true, enemy.x + Phaser.Math.Between(-15, 15), enemy.y + Phaser.Math.Between(-15, 15), true, true);
            item.setTexture('bandaid').setScale(1.0);
            item.itemType = 'bandaid';
          }
        } else if (rand < 0.15 + goldExtra) {
          const item = this.items.get();
          if (item) {
            item.enableBody(true, enemy.x + Phaser.Math.Between(-15, 15), enemy.y + Phaser.Math.Between(-15, 15), true, true);
            item.setTexture('gold_coin');
            item.itemType = 'gold';
          }
        } else if (rand < 0.155 + goldExtra) {
          const item = this.items.get();
          if (item) {
            item.enableBody(true, enemy.x, enemy.y, true, true);
            item.setTexture('magnet_item');
            item.itemType = 'magnet';
          }
        } else if (rand < 0.158 + goldExtra) {
          const item = this.items.get();
          if (item) {
            item.enableBody(true, enemy.x, enemy.y, true, true);
            item.setTexture('bomb_item');
            item.itemType = 'bomb';
          }
        }
      }
    }
  }

  // ─── 💣 숙제 폭탄 폭발: 플레이어 스플래시 피해 + 주변 몬스터 연쇄 피해 + 이펙트 ────────────────
  explodeHomeworkBomb(x, y, sourceEnemy) {
    SFX.explode();
    const blastRadius = 100;

    // 플레이어가 폭발 범위 안에 있으면 피해 (무적 상태면 무시)
    if (this.player.active && !this.player.invulnerable) {
      const distP = Phaser.Math.Distance.Between(x, y, this.player.x, this.player.y);
      if (distP <= blastRadius) {
        const dmg = Math.max(1, 25 - this.stats.armor);
        const gameOver = this.damagePlayer(dmg);
        if (!gameOver) {
          this.player.invulnerable = true;
          this.player.setAlpha(0.5);
          this.time.delayedCall(1000, () => { if (this.player.active) { this.player.invulnerable = false; this.player.setAlpha(1); } });
        }
      }
    }

    // 주변 다른 방해꾼들에게도 연쇄 피해 (도미노 폭발)
    this.enemies.getChildren().forEach(other => {
      if (other.active && other !== sourceEnemy && !other.isBoss && other.enemyType !== 'projectile') {
        const d = Phaser.Math.Distance.Between(x, y, other.x, other.y);
        if (d <= blastRadius) {
          other.hp -= 30;
          this.flashEnemy(other);
          this.checkEnemyDeath(other);
        }
      }
    });

    // 폭발 이펙트 (주황 링이 빠르게 퍼짐)
    const boom = this.add.circle(x, y, 10, 0xe67e22, 0.6);
    boom.setStrokeStyle(4, 0xffffff, 0.8);
    this.tweens.add({ targets: boom, radius: blastRadius, alpha: 0, duration: 300, onComplete: () => boom.destroy() });
  }

  // 🛡️ 스마트워치 방어막: 방어막 바의 표시 여부와 채워진 정도를 갱신
  updateShieldVisual() {
    const hasShield = this.shieldMaxHp > 0 && this.shieldHp > 0;
    this.shieldBarBg.setVisible(hasShield);
    this.shieldBarFill.setVisible(hasShield);
    if (hasShield) {
      const ratio = Phaser.Math.Clamp(this.shieldHp / this.shieldMaxHp, 0, 1);
      this.shieldBarFill.width = this.hpBarWidth * ratio;
    }
  }

  // 🛡️ 방어막이 다 닳아 깨졌을 때: 사라짐 표시 + 일정 시간 뒤 가득 찬 상태로 재생성 예약
  breakShield() {
    let ft = this.add.text(this.player.x, this.player.y - 50, '🛡️ 방어막 파괴!', { fontSize: '18px', fill: '#3498db', fontStyle: 'bold', stroke: '#000', strokeThickness: 3 }).setOrigin(0.5);
    this.tweens.add({ targets: ft, y: ft.y - 30, alpha: 0, duration: 800, onComplete: () => ft.destroy() });
    this.updateShieldVisual();

    if (this.shieldRegenTimer) { this.shieldRegenTimer.remove(); }
    this.shieldRegenTimer = this.time.delayedCall(this.shieldRegenDelay, () => {
      this.shieldRegenTimer = null;
      if (this.player.active && this.shieldMaxHp > 0) {
        this.shieldHp = this.shieldMaxHp;
        this.updateShieldVisual();
        let ft2 = this.add.text(this.player.x, this.player.y - 50, '🛡️ 방어막 생성!', { fontSize: '18px', fill: '#3498db', fontStyle: 'bold', stroke: '#000', strokeThickness: 3 }).setOrigin(0.5);
        this.tweens.add({ targets: ft2, y: ft2.y - 30, alpha: 0, duration: 800, onComplete: () => ft2.destroy() });
      }
    });
  }

  // 플레이어가 받는 모든 피해가 거치는 공용 함수. 방어막이 있으면 먼저 방어막 체력을 깎고(무적이 아니라
  // 진짜 체력을 가진 방패), 넘치는 피해만 실제 체력에 적용함. 반환값: 이 피해로 게임오버가 됐으면 true.
  damagePlayer(dmg) {
    if (this.shieldHp > 0) {
      if (dmg >= this.shieldHp) {
        dmg -= this.shieldHp;
        this.shieldHp = 0;
        this.breakShield();
      } else {
        this.shieldHp -= dmg;
        this.updateShieldVisual();
        dmg = 0;
      }
      SFX.hurt();
      this.cameras.main.flash(150, 52, 152, 219); // 방어막이 흡수한 피해는 파란색 플래시로 구분
      if (dmg <= 0) return false; // 방어막이 전부 막아냄 - 실제 체력 변화 없음
    }

    this.registry.set('hp', this.registry.get('hp') - dmg);
    SFX.hurt();
    this.cameras.main.flash(150, 231, 76, 60);

    if (this.registry.get('hp') <= 0) {
      SFX.gameOver();
      this.scene.stop('UIScene');
      this.scene.start('GameOverScene');
      return true;
    }
    return false;
  }

  getDangerContactRadius(enemy) {
    const baseRadius = CONTACT_HITBOX.enemyRadius[enemy.enemyType]
      ?? CONTACT_HITBOX.enemyRadius.normal;
    const displayScale = Math.max(Math.abs(enemy.scaleX || 1), Math.abs(enemy.scaleY || 1));
    return baseRadius * displayScale;
  }

  isAccurateDangerContact(player, enemy) {
    if (!player.active || !enemy.active) return false;

    const dx = enemy.x - player.x;
    const dy = enemy.y - player.y;
    const reach = CONTACT_HITBOX.playerRadius + this.getDangerContactRadius(enemy);
    return (dx * dx) + (dy * dy) <= reach * reach;
  }

  hurtPlayer(player, enemy) {
    if (player.active && enemy.active && !player.invulnerable) {
      // 보스별 몸통 부딪힘 데미지 차등: 종합평가(80), 방학숙제(160)는 훨씬 아프게, 그 외 보스/일반 몬스터는 기존 그대로
      const contactDmg = enemy.isBoss
        ? (enemy.enemyType === 'boss_final' ? 160 : enemy.enemyType === 'boss_shooter' ? 80 : 40)
        : 15;
      let dmg = Math.max(1, contactDmg - this.stats.armor); 
      const gameOver = this.damagePlayer(dmg);

      // 🏆 업적: 피해를 입으면 무피해 생존 타이머 초기화
      this.damageFreeSince = this.time.now;
      
      if (enemy.enemyType === 'projectile' || enemy.enemyType === 'smartphone_shot') {
        enemy.disableBody(true, true);
      }

      if (!gameOver) {
        player.invulnerable = true;
        player.setAlpha(0.5);
        this.time.delayedCall(1000, () => { if (player.active) { player.invulnerable = false; player.setAlpha(1); } });
      }
    }
  }

  collectExp(player, exp) {
    if (exp.active) {
      exp.disableBody(true, true);
      SFX.xp();
      // 🔒 만렙(Lv.50) 도달 시에는 더 이상 경험치가 쌓이지 않고, 경험치바도 꽉 찬 상태로 고정
      if (this.registry.get('level') >= 50) {
        this.registry.set('exp', this.registry.get('maxExp'));
        return;
      }
      let cExp = this.registry.get('exp') + (10 * this.stats.expMult * (this.eventActive ? this.eventMultiplier : 1));
      this.registry.set('exp', cExp);
    }
  }

  collectItem(player, item) {
    if (item.active) {
      if (item.itemType === 'chest') {
        if (this.time.now < (item.pickupReadyAt || 0)) return;
        if (this.scene.isActive('LevelUpScene') || this.scene.isActive('ChestScene') || this.scene.isActive('InventoryScene')) {
          return; 
        }
        item.pickupReadyAt = 0;
        item.disableBody(true, true);
        this.scene.pause();
        SFX.chest();
        this.scene.launch('ChestScene');
      } 
      else if (item.itemType === 'bandaid') {
        item.disableBody(true, true);
        SFX.heal();
        let maxHp = this.registry.get('maxHp');
        let heal = Math.floor(maxHp * 0.1); 
        this.registry.set('hp', Math.min(maxHp, this.registry.get('hp') + heal));
        let flashText = this.add.text(player.x, player.y - 20, '+10% HP', { fontSize: '20px', fill: '#2ecc71', fontStyle: 'bold', stroke: '#000', strokeThickness: 3 }).setOrigin(0.5);
        this.tweens.add({ targets: flashText, y: player.y - 60, alpha: 0, duration: 1000, onComplete: () => flashText.destroy() });
      }
      else if (item.itemType === 'gold') {
        item.disableBody(true, true);
        SFX.gold();
        let gold = parseInt(localStorage.getItem('gold')) || 0;
        // 🎚️ 밸런스 패치: 몬스터 스폰 속도가 후반부로 갈수록 크게 빨라져서(스폰 딜레이가 최소 50ms까지 감소,
        // 한 번에 나오는 마릿수도 최대 12마리까지 증가) 처치 속도 = 골드 수급 속도도 같이 기하급수적으로
        // 폭증하는 문제가 있어, 8분(480초)부터 코인 한 개당 골드량을 줄이기 시작.
        // 15분(900초)엔 50%, 20분(1200초)엔 10%까지 줄어들고, 그 이후로는 10%에서 더 안 줄어들게 함.
        const t = this.registry.get('time');
        let lateGameGoldMult;
        if (t <= 480) {
          lateGameGoldMult = 1;
        } else if (t <= 900) {
          lateGameGoldMult = 1 - (t - 480) * (0.5 / 420); // 8분→15분: 100%→50%
        } else if (t <= 1200) {
          lateGameGoldMult = 0.5 - (t - 900) * (0.4 / 300); // 15분→20분: 50%→10%
        } else {
          lateGameGoldMult = 0.1; // 20분 이후 하한선
        }
        const goldGain = Math.floor((10 + (this.skills.moneybook || 0) * 3) * lateGameGoldMult * (this.eventActive ? this.eventMultiplier : 1)); // 용돈기입장 레벨당 획득 골드 +3, 🔥 이벤트 중 2배
        gold += goldGain;
        localStorage.setItem('gold', gold.toString());
        let flashText = this.add.text(player.x, player.y - 40, `+${goldGain} G`, { fontSize: '20px', fill: '#f1c40f', fontStyle: 'bold', stroke: '#000', strokeThickness: 3 }).setOrigin(0.5);
        this.tweens.add({ targets: flashText, y: player.y - 80, alpha: 0, duration: 1000, onComplete: () => flashText.destroy() });
      }
      else if (item.itemType === 'magnet') {
        item.disableBody(true, true);
        SFX.pickupItem();
        this.exps.getChildren().forEach(exp => {
          if (exp.active) exp.isMagnetized = true;
        });
        this.items.getChildren().forEach(i => {
          if (i.active && i.itemType === 'gold') i.isMagnetized = true;
        });
        let flashText = this.add.text(player.x, player.y - 40, '🧲 자석 획득!', { fontSize: '24px', fill: '#3498db', fontStyle: 'bold', stroke: '#000', strokeThickness: 3 }).setOrigin(0.5);
        this.tweens.add({ targets: flashText, y: player.y - 80, alpha: 0, duration: 1000, onComplete: () => flashText.destroy() });
      }
      else if (item.itemType === 'bomb') {
        item.disableBody(true, true);
        SFX.bigBoom();
        this.cameras.main.flash(500, 255, 255, 255);
        this.enemies.getChildren().forEach(e => {
          if (e.active && !e.isBoss) {
            e.hp = 0;
            this.checkEnemyDeath(e);
          }
        });
        let flashText = this.add.text(player.x, player.y - 40, '💣 싹쓸이!', { fontSize: '24px', fill: '#e74c3c', fontStyle: 'bold', stroke: '#000', strokeThickness: 3 }).setOrigin(0.5);
        this.tweens.add({ targets: flashText, y: player.y - 80, alpha: 0, duration: 1000, onComplete: () => flashText.destroy() });
      }
      else if (item.itemType === 'sticker') {
        item.disableBody(true, true);
        SFX.pickupItem();
        const buffDuration = 6000 + this.skills.sticker * 500;
        // 스택으로 곱해나가는 대신 만료 시각만 갱신(연장)하고, 실제 배율 적용은 항상 recalculateStats()가 담당.
        // 이러면 버프 지속시간 중에 하나를 더 주워도 서로의 효과를 끊어먹지 않음.
        this.stickerBuffExpireAt = this.time.now + buffDuration;
        this.recalculateStats();
        let flashText = this.add.text(player.x, player.y - 40, '⭐ 칭찬 스티커! 능력치 상승!', { fontSize: '22px', fill: '#f1c40f', fontStyle: 'bold', stroke: '#000', strokeThickness: 3 }).setOrigin(0.5);
        this.tweens.add({ targets: flashText, y: player.y - 80, alpha: 0, duration: 1200, onComplete: () => flashText.destroy() });
        this.time.delayedCall(buffDuration, () => {
          if (this.player.active) this.recalculateStats();
        });
      }

      // 🏆 업적: 누적 아이템 획득 수 (위 분기 중 하나를 실제로 통과했을 때만 집계)
      const totalItems = Achievements.addStat('totalItems', 1);
      Achievements.showToasts(this, Achievements.checkCategory('items', totalItems));
    }
  }

  // ─── ⭐ 칭찬 스티커판: 주기적으로 필드에 스티커를 띄움 ────────────────
  spawnStickerItem() {
    const item = this.items.get();
    if (item) {
      const rx = this.player.x + Phaser.Math.Between(-200, 200);
      const ry = this.player.y + Phaser.Math.Between(-200, 200);
      item.enableBody(true, rx, ry, true, true);
      item.setTexture('sticker_item').setScale(1.3);
      item.itemType = 'sticker';
    }
  }

  update(time, delta) {
    this.gameTime += delta;
    const timeSec = Math.floor(this.gameTime / 1000);
    this.registry.set('time', timeSec);

    // ❤️ 캐릭터 머리 위 체력바 위치 및 표시 갱신
    if (this.player && this.hpBarBg) {
      const barY = this.player.y + this.hpBarOffsetY;
      this.hpBarBg.setPosition(this.player.x, barY);
      this.hpBarFill.setPosition(this.player.x - this.hpBarWidth / 2, barY);
      const hp = this.registry.get('hp');
      const maxHp = this.registry.get('maxHp');
      const ratio = Phaser.Math.Clamp(hp / maxHp, 0, 1);
      this.hpBarFill.width = this.hpBarWidth * ratio;
      this.hpBarFill.setFillStyle(ratio > 0.5 ? 0x2ecc71 : ratio > 0.2 ? 0xf1c40f : 0xe74c3c);

      // 🛡️ 방어막 바 위치 갱신 (내용물 자체는 updateShieldVisual/breakShield에서 갱신)
      if (this.shieldBarBg) {
        this.shieldBarBg.setPosition(this.player.x, barY - 8);
        this.shieldBarFill.setPosition(this.player.x - this.hpBarWidth / 2, barY - 8);
      }
    }

    // 🏆 업적: 생존 시간 최고 기록 갱신 (1초에 한 번만 체크)
    if (timeSec !== this.lastAchievementTimeCheck) {
      this.lastAchievementTimeCheck = timeSec;
      const best = Math.max(Achievements.getStat('bestSurvival'), timeSec);
      Achievements.setStat('bestSurvival', best);
      Achievements.showToasts(this, Achievements.checkCategory('survival', best));
    }
    // 🏆 업적: 피해 없이 5분(300초) 버티기
    if (!this.noDamageAchieved && this.time.now - this.damageFreeSince >= 300000) {
      this.noDamageAchieved = true;
      const u = Achievements.unlock('no_damage_5min');
      if (u) Achievements.showToasts(this, [u]);
    }

    // 🔥 집중력 이벤트: 3~5분 간격으로 발생, 20초간 지속 (몬스터·경험치·골드 2배)
    if (!this.eventActive && this.gameTime >= this.nextEventTime) {
      this.startFocusEvent();
    } else if (this.eventActive && this.gameTime >= this.eventEndTime) {
      this.endFocusEvent();
    }

    // 🏃 몰려오는 무리: 90~150초 간격, 보스가 활동 중일 땐 겹치지 않도록 대기
    if (this.gameTime >= this.nextSwarmTime && !this.finalBossActive && !this.homeworkBossActive) {
      this.spawnSwarm();
      this.nextSwarmTime = this.gameTime + Phaser.Math.Between(90000, 150000);
    }
    
    if (this.registry.get('level') < 50 && this.registry.get('exp') >= this.registry.get('maxExp') && !this.scene.isActive('LevelUpScene') && !this.scene.isActive('ChestScene') && !this.scene.isActive('InventoryScene')) {
      let cExp = this.registry.get('exp');
      let mExp = this.registry.get('maxExp');
      this.registry.set('exp', cExp - mExp);
      const newLevel = this.registry.get('level') + 1;
      this.registry.set('level', newLevel);
      this.registry.set('maxExp', this.getMaxExpForLevel(newLevel));
      this.scene.pause();
      this.scene.launch('LevelUpScene');
    }

    // 방학숙제(최종보스): 기본 15분마다, 단 30분(엔들리스) 이후부터는 5분마다로 훨씬 자주 등장 (난이도 대폭 상향)
    if (timeSec >= this.nextHomeworkBossTime) {
      this.spawnHomeworkBoss();
      const homeworkInterval = timeSec >= 1800 ? 300 : 900;
      this.nextHomeworkBossTime = timeSec + homeworkInterval;
    }

    // 종합평가: 5분마다 등장, 단 방학숙제가 활동 중일 때는 등장하지 않음
    if (timeSec > 0 && timeSec % 300 === 0 && timeSec !== this.lastBossTime && !this.homeworkBossActive) {
      this.lastBossTime = timeSec;
      this.spawnBoss();
    }

    // 단원평가(탱커형 보스): 60초마다 등장, 단 종합평가나 방학숙제가 활동 중일 때는 등장하지 않음
    if (timeSec > 0 && timeSec % 60 === 0 && timeSec !== this.lastUnitBossTime && !this.finalBossActive) {
      this.lastUnitBossTime = timeSec;
      this.spawnUnitTestBoss();
    }

    // 알림장 검사: 45초마다 (15초 이후부터) 안전지대 이벤트 발생
    if (timeSec > 15 && timeSec % 45 === 0 && timeSec !== this.lastNoticeCheckTime) {
      this.lastNoticeCheckTime = timeSec;
      this.triggerNoticeCheck();
    }

    let newDelay = Math.max(50, 1000 - Math.floor(timeSec * 0.55));
    if (this.eventActive) newDelay = Math.max(50, Math.floor(newDelay / 2)); // 🔥 이벤트 중 몬스터 스폰 2배
    if (newDelay !== this.spawnDelay) { this.spawnDelay = newDelay; this.spawnTimerEvent.delay = this.spawnDelay; }
    
    // 30분 생존(클리어) 체크 (1800초)
    if (timeSec >= 1800 && !this.gameCleared) {
      this.gameCleared = true;
      this.scene.pause();
      this.scene.launch('GameClearScene');
    }

    const speed = 200 * this.stats.speedMult * (this.playerInDust ? 0.75 : 1) * (this.playerInGlue ? 0.5 : 1);
    let vx = 0, vy = 0;
    if (this.cursors.left.isDown || this.wasd.left.isDown) vx = -speed;
    else if (this.cursors.right.isDown || this.wasd.right.isDown) vx = speed;
    if (this.cursors.up.isDown || this.wasd.up.isDown) vy = -speed;
    else if (this.cursors.down.isDown || this.wasd.down.isDown) vy = speed;

    if (vx !== 0 && vy !== 0) { vx *= 0.7071; vy *= 0.7071; }

    // 키보드 입력이 없으면 모바일 가상 조이스틱 입력을 사용
    if (vx === 0 && vy === 0 && window.touchMove && window.touchMove.active) {
      vx = speed * window.touchMove.x;
      vy = speed * window.touchMove.y;
    }

    this.player.setVelocity(vx, vy);

    if (vx !== 0 || vy !== 0) {
      this.player.lastDirX = vx > 0 ? 1 : (vx < 0 ? -1 : 0);
      this.player.lastDirY = vy > 0 ? 1 : (vy < 0 ? -1 : 0);
    }

    // 소모품 단축키 처리 (키보드 Z/X 또는 모바일 화면 버튼)
    const zPressed = Phaser.Input.Keyboard.JustDown(this.keyZ) || window.touchZPressed;
    const xPressed = Phaser.Input.Keyboard.JustDown(this.keyX) || window.touchXPressed;
    window.touchZPressed = false;
    window.touchXPressed = false;

    if (zPressed && this.consumables.magnet) {
      this.consumables.magnet = false;
      this.exps.getChildren().forEach(exp => { if (exp.active) this.physics.moveToObject(exp, this.player, 800); });
      let ft = this.add.text(this.player.x, this.player.y - 40, '🧲 자석 사용!', { fontSize: '24px', fill: '#3498db', fontStyle: 'bold', stroke: '#000', strokeThickness: 3 }).setOrigin(0.5);
      this.tweens.add({ targets: ft, y: this.player.y - 80, alpha: 0, duration: 1000, onComplete: () => ft.destroy() });
    }
    if (xPressed && this.consumables.bomb) {
      this.consumables.bomb = false;
      this.cameras.main.flash(500, 255, 255, 255);
      this.enemies.getChildren().forEach(e => {
        if (e.active && !e.isBoss) { e.hp = 0; this.checkEnemyDeath(e); }
      });
      let ft = this.add.text(this.player.x, this.player.y - 40, '💣 싹쓸이!', { fontSize: '24px', fill: '#e74c3c', fontStyle: 'bold', stroke: '#000', strokeThickness: 3 }).setOrigin(0.5);
      this.tweens.add({ targets: ft, y: this.player.y - 80, alpha: 0, duration: 1000, onComplete: () => ft.destroy() });
    }

    this.projectiles.getChildren().forEach(p => {
      if (p.active && p.deathTime && time > p.deathTime) {
        p.deathTime = null;
        if (p.weaponType === 'praise') {
          p.destroy();
        } else {
          p.disableBody(true, true);
        }
      }
    });
    this.pools.getChildren().forEach(p => {
      if (p.active && p.deathTime && time > p.deathTime) {
        p.deathTime = null;
        if (p.safetyLabel) { p.safetyLabel.destroy(); p.safetyLabel = null; }
        p.disableBody(true, true);
      }
    });

    if (vx < 0) this.player.setFlipX(true);
    else if (vx > 0) this.player.setFlipX(false);

    // 이동 중일 때만 바운스 tween 활성화
    const nowMoving = (vx !== 0 || vy !== 0);
    if (nowMoving && !this._isMoving) {
      this._isMoving = true;
      if (this._bounceTween) this._bounceTween.resume();
    } else if (!nowMoving && this._isMoving) {
      this._isMoving = false;
      if (this._bounceTween) { this._bounceTween.pause(); this.player.setOrigin(0.5, 0.5); }
    }

    if (this.skills.orbit > 0) {
      this.orbitAngle += 0.05;
      const isEvo = this.skills.orbit >= 6;
      const count = (isEvo ? 3 : 1) * this.skills.orbit + this.stats.amount; 
      const radius = 80 * this.stats.sizeMult * (isEvo ? 1.5 : 1);
      
      // filter()로 매 프레임 새 배열을 만드는 대신, 개수만 세는 방식으로 변경 (GC 부담 감소, 동작은 동일)
      let orbitCount = 0;
      this.projectiles.getChildren().forEach(p => { if (p.active && p.weaponType === 'orbit') orbitCount++; });
      if (orbitCount < count) {
        const p = this.projectiles.get();
        if(p) { 
          p.enableBody(true, this.player.x, this.player.y, true, true);
          p.setTexture('orbit_bullet').setScale(this.stats.sizeMult * (isEvo ? 2 : 1)); 
          if(isEvo) p.setTint(0xffd700);
          else p.clearTint();
          p.weaponType = 'orbit'; p.damage = this.calculateDamage(8 + this.skills.orbit*2) * (isEvo ? 3 : 1); p.pierce=999; 
        }
      }
      let i = 0;
      this.projectiles.getChildren().forEach(p => {
        if (p.active && p.weaponType === 'orbit') {
          if (i >= count) p.disableBody(true, true);
          else {
            const angle = this.orbitAngle + (Math.PI * 2 / count) * i;
            p.x = this.player.x + Math.cos(angle) * radius;
            p.y = this.player.y + Math.sin(angle) * radius;
            i++;
          }
        }
      });
    }

    // ─── 지속 데미지 오라 (리코더) ───
    if (this.skills.recorder > 0) {
      const isEvo = this.skills.recorder >= 6;
      this.recorderAura.setVisible(true);
      this.recorderAura.x = this.player.x;
      this.recorderAura.y = this.player.y;
      if (isEvo) this.recorderAura.setFillStyle(0xffd700, 0.4);
      const r = 100 * this.stats.sizeMult * (isEvo ? 2 : 1) + (this.skills.recorder * 10);
      this.recorderAura.setRadius(r);
      
      // 음표 파티클 효과 (시각적)
      if (!this.lastNoteTime || time - this.lastNoteTime > 200) {
        this.lastNoteTime = time;
        const note = this.add.image(this.player.x + Phaser.Math.Between(-20, 20), this.player.y + Phaser.Math.Between(-20, 20), 'recorder_note');
        if (isEvo) note.setTint(0xffd700);
        this.tweens.add({
          targets: note,
          x: note.x + Phaser.Math.Between(-r, r),
          y: note.y + Phaser.Math.Between(-r, r),
          alpha: 0,
          scale: 1.5,
          angle: Phaser.Math.Between(-45, 45),
          duration: 800,
          onComplete: () => note.destroy()
        });
      }

      // 반경 비교는 제곱거리로 계산해 sqrt 연산을 생략 (결과는 기존과 동일)
      const rSq = r * r;
      this.enemies.getChildren().forEach(enemy => {
        if (!enemy.active) return;
        const dxAura = enemy.x - this.player.x, dyAura = enemy.y - this.player.y;
        if ((dxAura * dxAura + dyAura * dyAura) <= rSq) {
          if (!enemy.lastAuraHit || this.time.now - enemy.lastAuraHit > 500) {
            enemy.hp -= this.calculateDamage(5 + this.skills.recorder * 3) * (isEvo ? 4 : 1);
            enemy.lastAuraHit = this.time.now;
            enemy.x += Math.cos(Phaser.Math.Angle.Between(this.player.x, this.player.y, enemy.x, enemy.y)) * (isEvo ? 30 : 15);
            enemy.y += Math.sin(Phaser.Math.Angle.Between(this.player.x, this.player.y, enemy.x, enemy.y)) * (isEvo ? 30 : 15);
            this.flashEnemy(enemy);
            this.checkEnemyDeath(enemy);
          }
        }
      });
    } else this.recorderAura.setVisible(false);

    this.pools.getChildren().forEach(pool => {
      if (!pool.active) return;
      const poolRadius = 40 * pool.scale * this.stats.poolRadiusMult;
      const poolRadiusSq = poolRadius * poolRadius; // 제곱거리 비교로 sqrt 연산 생략 (결과는 기존과 동일)

      // 🏥 보건실: 몬스터에게는 어떤 영향도 주지 않고, 이 구역 안에 서 있는 플레이어만 회복시킴
      if (pool.isHealPool) {
        const dxHeal = this.player.x - pool.x, dyHeal = this.player.y - pool.y;
        if ((dxHeal * dxHeal + dyHeal * dyHeal) <= poolRadiusSq) {
          if (!pool.lastHealTick || this.time.now - pool.lastHealTick > 500) {
            pool.lastHealTick = this.time.now;
            const maxHp = this.registry.get('maxHp');
            const hp = this.registry.get('hp');
            if (hp < maxHp) {
              this.registry.set('hp', Math.min(maxHp, hp + pool.healAmount));
              SFX.heal();
            }
          }
        }
        return;
      }

      this.enemies.getChildren().forEach(enemy => {
        if (!enemy.active) return;
        const dxPool = enemy.x - pool.x, dyPool = enemy.y - pool.y;
        if ((dxPool * dxPool + dyPool * dyPool) <= poolRadiusSq) {
          if (!enemy.lastPoolHit || this.time.now - enemy.lastPoolHit > 500) {
            enemy.hp -= pool.damage;
            enemy.lastPoolHit = this.time.now;
            this.flashEnemy(enemy);
            this.checkEnemyDeath(enemy);
          }
          // 물감(수채화 그리기) 웅덩이 슬로우 효과 - 데미지 쿨다운과 무관하게, 범위 안에 있으면 계속 슬로우 유지
          if (pool.isPaintPool && enemy.active && !enemy.isSlowed) {
            enemy.isSlowed = true;
            enemy.speed *= 0.45;
            const sid2 = enemy.spawnId;
            this.time.delayedCall(2500, () => {
              if (enemy.active && enemy.spawnId === sid2) { enemy.speed /= 0.45; enemy.isSlowed = false; }
            });
          }
        }
      });
    });

    // 비행기(airplane)는 일직선으로 날아가며 관통하므로 update루프에서의 추가 처리가 필요없습니다.

    // 미세먼지 구름 근접 여부는 이번 프레임 기준으로 다시 계산
    this.playerInDust = false;
    // 끈끈이 장판 위에 있는지도 이번 프레임 기준으로 다시 계산
    this.playerInGlue = this.isInStickyZone(this.player.x, this.player.y);

    this.enemies.getChildren().forEach(enemy => {
      if (enemy.active) {
        // 수업 종(bell)에 얼어붙은 상태면 이동 로직을 건너뜁니다.
        if (enemy.frozenUntil && this.time.now < enemy.frozenUntil) {
          enemy.setVelocity(0, 0);
          return;
        }
        if (enemy.enemyType === 'smartphone') {
          const dist = Phaser.Math.Distance.Between(this.player.x, this.player.y, enemy.x, enemy.y);
          if (dist < 300) this.physics.moveToObject(enemy, this.player, -enemy.speed);
          else if (dist > 500) this.physics.moveToObject(enemy, this.player, enemy.speed);
          else enemy.setVelocity(0, 0);
          
          if (this.time.now - enemy.lastShoot > 3000) {
            enemy.lastShoot = this.time.now;
            let proj = this.enemies.get();
            if (proj) {
              proj.enableBody(true, enemy.x, enemy.y, true, true);
              proj.setTexture('exp').setTint(0xff0000).setScale(1.5);
              // 📱 스마트폰이 던지는 물체는 보스 탄막과 달리 '몬스터' 판정 - 플레이어가 부술 수 있음 (전용 타입: smartphone_shot)
              proj.hp = 1; proj.speed = 300; proj.enemyType = 'smartphone_shot'; proj.isBoss = false;
              this.physics.moveToObject(proj, this.player, proj.speed);
              proj.deathTime = this.time.now + 2000; // 매 프레임 smartphone_shot 분기에서 일괄 처리 (풀 재사용 시 다른 개체를 잘못 지우는 사고 방지)
            }
          }
        } else if (enemy.enemyType === 'sleep') {
          if (!enemy.isDashing) {
            if (this.time.now - enemy.lastDash > 4000) {
              enemy.isDashing = true;
              enemy.setVelocity(0, 0);
              let ft = this.add.text(enemy.x, enemy.y - 20, 'Zzz...', { fontSize: '20px', fill: '#9b59b6', fontStyle: 'bold' }).setOrigin(0.5);
              this.tweens.add({ targets: ft, y: enemy.y - 40, alpha: 0, duration: 800, onComplete: () => ft.destroy() });
              const sidSleep = enemy.spawnId;
              this.time.delayedCall(800, () => {
                if (enemy.active && enemy.spawnId === sidSleep) {
                  this.physics.moveToObject(enemy, this.player, 400); 
                  enemy.lastDash = this.time.now;
                  this.time.delayedCall(500, () => { if (enemy.active && enemy.spawnId === sidSleep) enemy.isDashing = false; });
                }
              });
            } else {
              this.physics.moveToObject(enemy, this.player, enemy.speed);
            }
          }
        } else if (enemy.enemyType === 'bomb') {
          // 숙제 폭탄: 평범하게 추적하다 처치되면 checkEnemyDeath에서 폭발
          this.physics.moveToObject(enemy, this.player, enemy.speed || 45);
        } else if (enemy.enemyType === 'dust') {
          // 미세먼지 구름: 아주 느리게 부유하며 접근, 근처에 있으면 플레이어를 슬로우 + 화면을 뿌옇게
          this.physics.moveToObject(enemy, this.player, enemy.speed || 30);
          if (Phaser.Math.Distance.Between(this.player.x, this.player.y, enemy.x, enemy.y) <= 140) {
            this.playerInDust = true;
          }
        } else if (enemy.enemyType === 'normal' || !enemy.enemyType) {
          this.physics.moveToObject(enemy, this.player, enemy.speed || 80);
        } else if (enemy.enemyType === 'boss_shooter') {
          // 탄막형 보스: 적당한 거리를 유지하며 주기적으로 탄막을 발사
          const distB = Phaser.Math.Distance.Between(this.player.x, this.player.y, enemy.x, enemy.y);
          if (distB < 320) this.physics.moveToObject(enemy, this.player, -enemy.speed);
          else if (distB > 480) this.physics.moveToObject(enemy, this.player, enemy.speed);
          else enemy.setVelocity(0, 0);

          // 패턴 A: 사방으로 퍼지는 원형 탄막
          if (!enemy.lastRingTime || this.time.now - enemy.lastRingTime > 2600) {
            enemy.lastRingTime = this.time.now;
            const bulletCount = 12;
            for (let i = 0; i < bulletCount; i++) {
              const bAngle = (Math.PI * 2 / bulletCount) * i;
              const b = this.enemies.get();
              if (b) {
                b.enableBody(true, enemy.x, enemy.y, true, true);
                b.setTexture('exp').setTint(0xff0000).setScale(1.4);
                b.hp = 1; b.speed = 220; b.enemyType = 'projectile'; b.isBoss = false;
                b.setVelocity(Math.cos(bAngle) * b.speed, Math.sin(bAngle) * b.speed);
                b.deathTime = this.time.now + 2500;
              }
            }
          }

          // 패턴 B: 플레이어를 겨냥한 부채꼴 탄막
          if (!enemy.lastSpreadTime || this.time.now - enemy.lastSpreadTime > 4200) {
            enemy.lastSpreadTime = this.time.now;
            const baseAngle = Phaser.Math.Angle.Between(enemy.x, enemy.y, this.player.x, this.player.y);
            const spreadOffsets = [-0.35, -0.17, 0, 0.17, 0.35];
            spreadOffsets.forEach(offset => {
              const b = this.enemies.get();
              if (b) {
                b.enableBody(true, enemy.x, enemy.y, true, true);
                b.setTexture('exp').setTint(0xff0000).setScale(1.6);
                b.hp = 1; b.speed = 260; b.enemyType = 'projectile'; b.isBoss = false;
                const a = baseAngle + offset;
                b.setVelocity(Math.cos(a) * b.speed, Math.sin(a) * b.speed);
                b.deathTime = this.time.now + 2200;
              }
            });
          }

          // 패턴 C: 회전하며 퍼져나가는 나선형 탄막
          if (!enemy.lastSpiralTime || this.time.now - enemy.lastSpiralTime > 6500) {
            enemy.lastSpiralTime = this.time.now;
            enemy.spiralAngle = Phaser.Math.Between(0, 360) * Math.PI / 180;
            this.time.addEvent({
              delay: 90,
              repeat: 19,
              callback: () => {
                if (enemy.active && enemy.enemyType === 'boss_shooter') {
                  const b = this.enemies.get();
                  if (b) {
                    b.enableBody(true, enemy.x, enemy.y, true, true);
                    b.setTexture('exp').setTint(0x9b59b6).setScale(1.3);
                    b.hp = 1; b.speed = 200; b.enemyType = 'projectile'; b.isBoss = false;
                    b.setVelocity(Math.cos(enemy.spiralAngle) * b.speed, Math.sin(enemy.spiralAngle) * b.speed);
                    b.deathTime = this.time.now + 2800;
                  }
                  enemy.spiralAngle += 0.6; // 매 발사마다 각도를 조금씩 틀어서 나선 모양을 만듦
                }
              }
            });
          }
          // 패턴 D: 바닥 위험지대 (몬스터 무관, 플레이어만 피해)
          if (!enemy.lastGroundZoneTime || this.time.now - enemy.lastGroundZoneTime > 5500) {
            enemy.lastGroundZoneTime = this.time.now;
            this.spawnBossGroundHazard(2);
          }
        } else if (enemy.enemyType === 'boss_tank') {
          // 단원평가(탱커형 보스): 평소엔 천천히 추적하다 주기적으로 강하게 돌진
          if (!enemy.isDashing) {
            if (this.time.now - enemy.lastDash > 3000) {
              enemy.isDashing = true;
              enemy.setVelocity(0, 0);
              let ft = this.add.text(enemy.x, enemy.y - 30, '💥 돌진 준비!', { fontSize: '20px', fill: '#e67e22', fontStyle: 'bold', stroke: '#000', strokeThickness: 3 }).setOrigin(0.5);
              this.tweens.add({ targets: ft, y: enemy.y - 50, alpha: 0, duration: 600, onComplete: () => ft.destroy() });
              const sidTank = enemy.spawnId;
              this.time.delayedCall(600, () => {
                if (enemy.active && enemy.spawnId === sidTank) {
                  this.physics.moveToObject(enemy, this.player, 450);
                  enemy.lastDash = this.time.now;
                  this.time.delayedCall(700, () => { if (enemy.active && enemy.spawnId === sidTank) enemy.isDashing = false; });
                }
              });
            } else {
              this.physics.moveToObject(enemy, this.player, enemy.speed);
            }
          }

          // 바닥 위험지대 (몬스터 무관, 플레이어만 피해) - 탱커형이라 접근을 압박하는 용도로 조금 더 자주
          if (!enemy.lastGroundZoneTime || this.time.now - enemy.lastGroundZoneTime > 4800) {
            enemy.lastGroundZoneTime = this.time.now;
            this.spawnBossGroundHazard(2);
          }
        } else if (enemy.enemyType === 'boss_final') {
          // 방학숙제(최종보스): 탄막(종합평가) + 돌진(단원평가)을 함께 사용, 체력 50% 이하부터 폭주(2페이즈)
          const isEnraged = enemy.hp <= (enemy.maxHp || enemy.hp) * 0.5;

          if (isEnraged && !enemy.enrageAnnounced) {
            enemy.enrageAnnounced = true;
            let ef = this.add.text(enemy.x, enemy.y - 90, '🔥 방학숙제가 폭주합니다!', { fontSize: '26px', fill: '#ff0000', fontStyle: 'bold', stroke: '#000', strokeThickness: 5 }).setOrigin(0.5);
            this.tweens.add({ targets: ef, alpha: 0, y: ef.y - 40, duration: 1500, onComplete: () => ef.destroy() });
          }

          if (!enemy.isDashing) {
            const distF = Phaser.Math.Distance.Between(this.player.x, this.player.y, enemy.x, enemy.y);
            if (distF < 300) this.physics.moveToObject(enemy, this.player, -enemy.speed);
            else if (distF > 460) this.physics.moveToObject(enemy, this.player, enemy.speed);
            else enemy.setVelocity(0, 0);
          }

          // 탄막 패턴: 사방으로 퍼지는 원형 탄막 (🔥 난이도 상승: 더 자주, 훨씬 많이 - 폭주 시 한층 더 강력)
          const ringInterval = isEnraged ? 1400 : 2400;
          if (!enemy.lastRingTime || this.time.now - enemy.lastRingTime > ringInterval) {
            enemy.lastRingTime = this.time.now;
            const bulletCount = isEnraged ? 24 : 16;
            for (let i = 0; i < bulletCount; i++) {
              const bAngle = (Math.PI * 2 / bulletCount) * i;
              const b = this.enemies.get();
              if (b) {
                b.enableBody(true, enemy.x, enemy.y, true, true);
                b.setTexture('exp').setTint(0xf39c12).setScale(1.4);
                b.hp = 1; b.speed = 240; b.enemyType = 'projectile'; b.isBoss = false;
                b.setVelocity(Math.cos(bAngle) * b.speed, Math.sin(bAngle) * b.speed);
                b.deathTime = this.time.now + 2600;
              }
            }
          }

          // 🔥 신규 패턴: 플레이어를 겨냥한 부채꼴 탄막 (폭주 시 더 촘촘하고 빠르게)
          const spreadInterval = isEnraged ? 1900 : 3200;
          if (!enemy.lastSpreadTime || this.time.now - enemy.lastSpreadTime > spreadInterval) {
            enemy.lastSpreadTime = this.time.now;
            const baseAngle = Phaser.Math.Angle.Between(enemy.x, enemy.y, this.player.x, this.player.y);
            const spreadOffsets = isEnraged ? [-0.45, -0.3, -0.15, 0, 0.15, 0.3, 0.45] : [-0.3, -0.15, 0, 0.15, 0.3];
            spreadOffsets.forEach(offset => {
              const b = this.enemies.get();
              if (b) {
                b.enableBody(true, enemy.x, enemy.y, true, true);
                b.setTexture('exp').setTint(0xf39c12).setScale(1.6);
                b.hp = 1; b.speed = 270; b.enemyType = 'projectile'; b.isBoss = false;
                const a = baseAngle + offset;
                b.setVelocity(Math.cos(a) * b.speed, Math.sin(a) * b.speed);
                b.deathTime = this.time.now + 2400;
              }
            });
          }

          // 🔥 신규 패턴: 바닥 위험지대 (몬스터 무관, 플레이어만 피해 - 폭주 시 더 자주, 더 아프게)
          const groundZoneInterval = isEnraged ? 3200 : 4500;
          if (!enemy.lastGroundZoneTime || this.time.now - enemy.lastGroundZoneTime > groundZoneInterval) {
            enemy.lastGroundZoneTime = this.time.now;
            this.spawnBossGroundHazard(isEnraged ? 3 : 2, isEnraged ? 26 : 20, 85, 1000);
          }

          // 돌진 패턴: 탱커형 요소로 주기적으로 강하게 돌진 (🔥 난이도 상승: 더 자주, 더 빠르게)
          const dashInterval = isEnraged ? 1800 : 3000;
          if (!enemy.isDashing && (this.time.now - enemy.lastDash > dashInterval)) {
            enemy.isDashing = true;
            enemy.setVelocity(0, 0);
            let ft2 = this.add.text(enemy.x, enemy.y - 30, '💥 돌진 준비!', { fontSize: '20px', fill: '#e67e22', fontStyle: 'bold', stroke: '#000', strokeThickness: 3 }).setOrigin(0.5);
            this.tweens.add({ targets: ft2, y: ft2.y - 50, alpha: 0, duration: 600, onComplete: () => ft2.destroy() });
            const dashSpeed = isEnraged ? 580 : 460;
            const sidFinal = enemy.spawnId;
            this.time.delayedCall(600, () => {
              if (enemy.active && enemy.spawnId === sidFinal) {
                this.physics.moveToObject(enemy, this.player, dashSpeed);
                enemy.lastDash = this.time.now;
                this.time.delayedCall(700, () => { if (enemy.active && enemy.spawnId === sidFinal) enemy.isDashing = false; });
              }
            });
          }
        } else if (enemy.enemyType === 'projectile') {
          // 🔴 보스 탄막 소멸 처리 (파괴 불가능 - 피해야만 하는 탄막): 맵 경계에 닿거나(edge) 수명이 다하면(deathTime) 사라짐.
          // ⚠️ 예전에는 각 발사 로직에서 this.time.delayedCall로 개별 disableBody를 걸었는데,
          // 그 타이머가 나중에 실행될 때 이 풀 슬롯이 이미 다른 몬스터(예: 단원평가 보스)로 재사용된
          // 상태라면 엉뚱하게 그 새 몬스터를 지워버리는 문제가 있었음. 그래서 소멸 판정을 전부
          // 이 매 프레임 루프 한 곳으로 모아서, 항상 "현재 이 프레임의 실제 대상"만 지우도록 함.
          if (enemy.x < 0 || enemy.x > 4000 || enemy.y < 0 || enemy.y > 4000 || (enemy.deathTime && this.time.now > enemy.deathTime)) {
            enemy.disableBody(true, true);
          }
        } else if (enemy.enemyType === 'smartphone_shot') {
          // 📱 스마트폰이 던진 물체 소멸 처리: 보스 탄막과 달리 '몬스터' 판정이라 플레이어 무기에 맞으면
          // hitEnemyWithProjectile에서 정상적으로 파괴됨. 여기서는 맞지 않고 수명이 다하거나 화면 밖으로
          // 나갔을 때만 정리한다 (풀 재사용 안전성을 위해 projectile과 동일하게 매 프레임 루프에서 처리).
          if (enemy.x < 0 || enemy.x > 4000 || enemy.y < 0 || enemy.y > 4000 || (enemy.deathTime && this.time.now > enemy.deathTime)) {
            enemy.disableBody(true, true);
          }
        }

        // 끈끈이 장판: 탄막류(보스 탄막 + 스마트폰 투척물)가 아닌 방해꾼이 위에 있으면 이동속도를 절반으로 줄임
        if (enemy.enemyType !== 'projectile' && enemy.enemyType !== 'smartphone_shot' && this.isInStickyZone(enemy.x, enemy.y)) {
          enemy.body.velocity.scale(0.5);
        }
      }
    });

    if (this.playerInDust !== this.prevInDust) {
      this.prevInDust = this.playerInDust;
      this.registry.set('inDust', this.playerInDust);
    }


    const pullDist = 120 * this.stats.magnetMult;
    this.exps.getChildren().forEach(exp => {
      if (exp.active) {
        if (exp.isMagnetized || Phaser.Math.Distance.Between(this.player.x, this.player.y, exp.x, exp.y) < pullDist) {
          this.physics.moveToObject(exp, this.player, exp.isMagnetized ? 800 : 400);
        } else {
          exp.setVelocity(0, 0);
        }
      }
    });
    this.items.getChildren().forEach(item => {
      if (item.active) {
        if (item.isMagnetized || Phaser.Math.Distance.Between(this.player.x, this.player.y, item.x, item.y) < pullDist) {
          this.physics.moveToObject(item, this.player, item.isMagnetized ? 800 : 400);
        } else {
          item.setVelocity(0, 0);
        }
      }
    });
  }
}

class UIScene extends Phaser.Scene {
  constructor() { super('UIScene'); }
  create() {
    const width = this.cameras.main.width;
    const height = this.cameras.main.height;
    this.add.rectangle(0, 0, width, 24, 0x2c3e50).setOrigin(0);
    this.expBar = this.add.rectangle(0, 0, 0, 24, 0x2ecc71).setOrigin(0);

    this.levelText = this.add.text(10, 30, '레벨: 1', { fontSize: '24px', fill: '#fff', fontStyle: 'bold', stroke: '#000', strokeThickness: 4 });
    this.hpText = this.add.text(width/2, 30, '체력: 100/100', { fontSize: '24px', fill: '#e74c3c', fontStyle: 'bold', stroke: '#000', strokeThickness: 4 }).setOrigin(0.5, 0);
    this.killsText = this.add.text(width - 10, 30, '물리친 수: 0', { fontSize: '24px', fill: '#f1c40f', fontStyle: 'bold', stroke: '#000', strokeThickness: 4 }).setOrigin(1, 0);
    this.timeText = this.add.text(width/2, 65, '00:00', { fontSize: '32px', fill: '#ecf0f1', fontStyle: 'bold', stroke: '#000', strokeThickness: 4 }).setOrigin(0.5, 0);

    // ── 보스 이름 + 체력바 (보스가 활성화된 동안만 표시) ──────────────────────────────
    // 🐛 버그 수정: 단원평가(60초마다)는 이전 보스가 살아있어도 새로 스폰될 수 있어 같은 화면에
    // 보스가 2마리 이상 동시에 존재할 수 있는데, 기존엔 체력바를 1개만 두고 "처음 찾은 보스"만
    // 표시해 나머지 보스의 체력바가 보이지 않았음. 여러 마리를 동시에 보여줄 수 있도록 슬롯 방식으로 변경.
    const bossBarWidth = Math.min(500, width * 0.5);
    this.bossBarWidth = bossBarWidth;
    this.MAX_BOSS_BARS = 3; // 화면에 동시에 표시할 수 있는 보스 체력바 최대 개수
    this.bossBars = [];
    for (let i = 0; i < this.MAX_BOSS_BARS; i++) {
      const rowY = 96 + i * 52;
      const nameText = this.add.text(width/2, rowY, '', { fontSize: '20px', fill: '#fff', fontStyle: 'bold', stroke: '#000', strokeThickness: 4 }).setOrigin(0.5).setVisible(false);
      const barBg = this.add.rectangle(width/2, rowY + 26, bossBarWidth, 18, 0x000000, 0.6).setOrigin(0.5).setStrokeStyle(2, 0xffffff).setVisible(false);
      const barFill = this.add.rectangle(width/2 - bossBarWidth/2, rowY + 26, bossBarWidth, 18, 0xe74c3c).setOrigin(0, 0.5).setVisible(false);
      this.bossBars.push({ nameText, barBg, barFill });
    }
    
    const bagBtn = this.add.text(10, 65, '🎒 가방 (아이템 확인)', { fontSize: '22px', fill: '#fff', backgroundColor: '#8e44ad', padding: { x: 15, y: 8 }, borderRadius: 5 }).setInteractive({ useHandCursor: true });
    bagBtn.on('pointerdown', () => {
      if (this.scene.isActive('LevelUpScene') || this.scene.isActive('ChestScene')) return;
      SFX.click();
      this.scene.pause('GameScene');
      this.scene.launch('InventoryScene');
    });

    // 🔊 음소거 버튼 (우측 상단)
    const muteBtn = this.add.text(width - 10, 65, SFX.isMuted() ? '🔇' : '🔊', { fontSize: '26px', fill: '#fff', backgroundColor: '#34495e', padding: { x: 12, y: 6 }, borderRadius: 5 }).setOrigin(1, 0).setInteractive({ useHandCursor: true });
    muteBtn.on('pointerdown', () => {
      const nowMuted = SFX.toggleMuted();
      muteBtn.setText(nowMuted ? '🔇' : '🔊');
      if (!nowMuted) SFX.click();
    });

    this.events.on('shutdown', () => {
      this.registry.events.off('changedata', this.updateData, this);
    });
    this.registry.events.on('changedata', this.updateData, this);
    
    // 소모품 슬롯 UI (화면 우측 하단)
    const gs = this.scene.get('GameScene');
    this.consumableSlots = [];
    if (gs.consumables) {
      const slotDefs = [
        { key: 'magnet', label: 'Z', icon: '🧲', color: '#3498db' },
        { key: 'bomb',   label: 'X', icon: '💣', color: '#e74c3c' }
      ];
      slotDefs.forEach((def, i) => {
        const x = width - 90;
        const y = 720 - 90 - i * 70;
        const bg = this.add.rectangle(x, y, 60, 60, 0x000000, 0.5).setOrigin(0.5).setStrokeStyle(2, 0xffffff);
        const ico = this.add.text(x, y - 8, def.icon, { fontSize: '28px' }).setOrigin(0.5);
        const keyLbl = this.add.text(x, y + 16, def.label + '키', { fontSize: '14px', fill: def.color, fontStyle: 'bold' }).setOrigin(0.5);
        // 보유 안 하면 흐릿하게
        if (!gs.consumables[def.key]) { bg.setFillStyle(0x000000, 0.15); ico.setAlpha(0.3); keyLbl.setAlpha(0.3); }
        this.consumableSlots.push({ def, bg, ico, keyLbl, active: gs.consumables[def.key] });
      });
    }

    // ── 미세먼지 구름 근접 시 화면을 뿌옇게 만드는 오버레이 (기본은 투명) ──────────────────────────────
    this.dustOverlay = this.add.rectangle(0, 0, width, height, 0xb2a99a, 0).setOrigin(0).setDepth(999);
    // 🌑 방학숙제(최종보스) 등장 시 화면을 살짝 어둡게 하는 비네트 오버레이
    this.bossVignette = this.add.rectangle(0, 0, width, height, 0x000000, 0).setOrigin(0).setDepth(998);

    // ── 미니맵 (좌측 하단, 몬스터=검정 점 / 나=초록 점) ──────────────────────────────
    this.minimap = { size: 150, margin: 14, worldW: 4000, worldH: 4000 };
    this.minimap.x = this.minimap.margin;
    this.minimap.y = height - this.minimap.size - this.minimap.margin;
    this.add.rectangle(this.minimap.x, this.minimap.y, this.minimap.size, this.minimap.size, 0x000000, 0.45)
      .setOrigin(0).setStrokeStyle(2, 0xffffff, 0.7);
    this.minimapGfx = this.add.graphics();
  }
  
  update() {
    const gs = this.scene.get('GameScene');
    if (!gs) return;

    // ── 미니맵 갱신 ──────────────────────────────
    if (this.minimapGfx && gs.player && gs.enemies) {
      const { x: mapX, y: mapY, size, worldW, worldH } = this.minimap;
      this.minimapGfx.clear();

      // 몬스터: 검정 점
      this.minimapGfx.fillStyle(0xdce6f4, 1);
      gs.enemies.getChildren().forEach(e => {
        if (e.active) {
          const ex = Phaser.Math.Clamp(mapX + (e.x / worldW) * size, mapX, mapX + size - 2);
          const ey = Phaser.Math.Clamp(mapY + (e.y / worldH) * size, mapY, mapY + size - 2);
          this.minimapGfx.fillRect(ex, ey, 2, 2);
        }
      });

      // 보스 전용 마커: 눈에 띄는 빨간 원 (일반 몬스터 점 위에 덧그림)
      gs.enemies.getChildren().forEach(e => {
        if (e.active && e.isBoss) {
          const bx = Phaser.Math.Clamp(mapX + (e.x / worldW) * size, mapX, mapX + size - 5);
          const by = Phaser.Math.Clamp(mapY + (e.y / worldH) * size, mapY, mapY + size - 5);
          this.minimapGfx.fillStyle(0xe74c3c, 1);
          this.minimapGfx.fillCircle(bx, by, 4);
          this.minimapGfx.lineStyle(1, 0xffffff, 0.9);
          this.minimapGfx.strokeCircle(bx, by, 4);
        }
      });

      // 나: 초록 점 (몬스터 점 위에 덧그려서 항상 잘 보이게)
      const px = Phaser.Math.Clamp(mapX + (gs.player.x / worldW) * size, mapX, mapX + size - 3);
      const py = Phaser.Math.Clamp(mapY + (gs.player.y / worldH) * size, mapY, mapY + size - 3);
      this.minimapGfx.fillStyle(0x2ecc71, 1);
      this.minimapGfx.fillRect(px, py, 3, 3);
    }

    // ── 보스 이름 + 체력바 갱신 (여러 마리가 동시에 있으면 슬롯별로 모두 표시) ──────────────────────────────
    if (this.bossBars && gs.enemies) {
      const bosses = [];
      gs.enemies.getChildren().forEach(e => { if (e.active && e.isBoss) bosses.push(e); });
      // 체력 비율이 낮은(더 위태로운) 보스를 위쪽 슬롯에 먼저 표시
      bosses.sort((a, b) => (a.hp / (a.maxHp || a.hp)) - (b.hp / (b.maxHp || b.hp)));
      const bossNames = { boss_shooter: '종합평가', boss_tank: '단원평가', boss_final: '방학숙제' };
      const extraCount = Math.max(0, bosses.length - this.bossBars.length);

      this.bossBars.forEach((bar, i) => {
        const boss = bosses[i];
        if (!boss) {
          bar.nameText.setVisible(false);
          bar.barBg.setVisible(false);
          bar.barFill.setVisible(false);
          return;
        }
        // 슬롯이 다 찼는데 표시 못 한 보스가 더 있다면, 맨 아래 슬롯에 "+N" 형태로 알려줌
        const isLastVisibleSlot = i === this.bossBars.length - 1 && extraCount > 0;
        const label = (bossNames[boss.enemyType] || '보스') + (isLastVisibleSlot ? ` 외 ${extraCount}` : '');
        bar.nameText.setText(label).setVisible(true);
        bar.barBg.setVisible(true);
        bar.barFill.setVisible(true);
        const ratio = Phaser.Math.Clamp(boss.hp / (boss.maxHp || boss.hp), 0, 1);
        bar.barFill.width = this.bossBarWidth * ratio;
      });
    }

    if (!gs.consumables || !this.consumableSlots) return;
    this.consumableSlots.forEach(slot => {
      const has = gs.consumables[slot.def.key];
      if (has !== slot.active) {
        slot.active = has;
        slot.bg.setFillStyle(0x000000, has ? 0.5 : 0.15);
        slot.ico.setAlpha(has ? 1 : 0.3);
        slot.keyLbl.setAlpha(has ? 1 : 0.3);
      }
    });
  }

  updateData(parent, key, data) {
    if (!this.expBar || !this.expBar.active) return; 
    if (key === 'exp' || key === 'maxExp') this.expBar.width = (this.registry.get('exp') / this.registry.get('maxExp')) * this.cameras.main.width;
    else if (key === 'level') this.levelText.setText('레벨: ' + data);
    else if (key === 'hp' || key === 'maxHp') this.hpText.setText(`체력: ${Math.floor(this.registry.get('hp'))} / ${this.registry.get('maxHp')}`);
    else if (key === 'kills') this.killsText.setText('물리친 수: ' + data);
    else if (key === 'time') {
      let m = String(Math.floor(data / 60)).padStart(2, '0');
      let s = String(data % 60).padStart(2, '0');
      this.timeText.setText(`${m}:${s}`);
    }
    else if (key === 'inDust' && this.dustOverlay) {
      this.tweens.add({ targets: this.dustOverlay, alpha: data ? 0.35 : 0, duration: 300 });
    }
    else if (key === 'bossVignette' && this.bossVignette) {
      this.tweens.add({ targets: this.bossVignette, alpha: data ? 0.4 : 0, duration: data ? 400 : 1200 });
    }
  }
}

class InventoryScene extends Phaser.Scene {
  constructor() { super('InventoryScene'); }
  create() {
    const width = this.cameras.main.width;
    const height = this.cameras.main.height;
    const gs = this.scene.get('GameScene');

    this.add.rectangle(0, 0, width, height, 0x000000, 0.9).setOrigin(0);
    this.add.text(width/2, 60, '🎒 내 가방 (현재 보유 아이템)', { fontSize: '40px', fill: '#f1c40f', fontStyle: 'bold' }).setOrigin(0.5);

    this.add.text(150, 130, '⚔️ 무기 (액티브)', { fontSize: '28px', fill: '#fff', fontStyle: 'bold' });
    let activeY = 180;
    
    this.add.text(width/2 + 150, 130, '🛡️ 장비 (패시브)', { fontSize: '28px', fill: '#fff', fontStyle: 'bold' });
    let passiveY = 180;

    let hasItems = false;

    Object.keys(gs.skills).forEach(key => {
      let lvl = gs.skills[key];
      if (lvl > 0) {
        hasItems = true;
        const sd = SKILL_DATA[key];
        const isEvo = lvl >= 6;
        const name = isEvo ? sd.evoName : sd.name;
        const displayLvl = isEvo ? 'MAX(진화)' : `Lv.${lvl}`;
        const color = isEvo ? '#f1c40f' : '#ecf0f1';
        
        let textStr = `${sd.icon} ${name} - ${displayLvl}`;
        
        if (sd.type === 'active') {
          this.add.text(150, activeY, textStr, { fontSize: '22px', fill: color });
          activeY += 45;
        } else {
          this.add.text(width/2 + 150, passiveY, textStr, { fontSize: '22px', fill: color });
          passiveY += 45;
        }
      }
    });

    if (!hasItems) {
      this.add.text(width/2, height/2, '아직 가진 아이템이 없습니다!', { fontSize: '24px', fill: '#7f8c8d' }).setOrigin(0.5);
    }

    const closeBtn = this.add.text(width/2, height - 80, '닫기 (게임으로 돌아가기)', { fontSize: '28px', fill: '#fff', backgroundColor: '#e74c3c', padding: { x: 30, y: 15 }, borderRadius: 10 }).setOrigin(0.5).setInteractive({ useHandCursor: true });
    closeBtn.on('pointerdown', () => {
      SFX.click();
      this.scene.resume('GameScene');
      this.scene.stop();
    });
  }
}

class ChestScene extends Phaser.Scene {
  constructor() { super('ChestScene'); }
  create() {
    const width = this.cameras.main.width;
    const height = this.cameras.main.height;
    const gs = this.scene.get('GameScene');

    this.add.rectangle(0, 0, width, height, 0x000000, 0.85).setOrigin(0);
    this.add.text(width/2, height/2 - 250, '🎁 황금 보물 상자 발견! 🎁', { fontSize: '48px', fill: '#f1c40f', fontStyle: 'bold', stroke: '#d35400', strokeThickness: 6 }).setOrigin(0.5);

    let availableOpts = [];
    Object.keys(SKILL_DATA).forEach(key => {
      const sd = SKILL_DATA[key];
      const lvl = gs.skills[key];
      if (sd.type === 'passive' && lvl > 0 && lvl < 5) availableOpts.push(key); 
      else if (sd.type === 'active') {
        if (lvl > 0 && lvl < 5) availableOpts.push(key);
        else if (lvl === 5 && gs.skills[sd.evoPassive] >= 1) availableOpts.push(key); 
      }
    });

    if (availableOpts.length === 0) {
      Object.keys(SKILL_DATA).forEach(key => {
        if (gs.skills[key] === 0) availableOpts.push(key);
      });
    }

    // 단짝친구는 너무 사기라 보물 상자에서도 낮은 확률(약 15%)로만 후보에 남김
    if (availableOpts.includes('friend') && Math.random() > 0.15) {
      availableOpts.splice(availableOpts.indexOf('friend'), 1);
    }
    
    Phaser.Utils.Array.Shuffle(availableOpts);
    
    const rand = Math.random();
    let numItems = 1;
    if (rand > 0.9) numItems = 3;
    else if (rand > 0.7) numItems = 2;

    let chosenOpts = availableOpts.slice(0, numItems);
    if (chosenOpts.length === 0) chosenOpts = ['heal', 'heal', 'heal'].slice(0, numItems);
    
    chosenOpts.forEach((key, i) => {
      let skillName;
      let isEvoCard = false;
      if (key === 'heal') {
        skillName = '💊 양호실 방문 (체력 회복)';
        gs.registry.set('hp', Math.min(gs.registry.get('maxHp'), gs.registry.get('hp') + 30));
      } else {
        const sd = SKILL_DATA[key];
        const lvl = gs.skills[key];
        const isEvo = lvl === 5;
        isEvoCard = isEvo;
        skillName = `${sd.icon} ${isEvo ? sd.evoName + ' (진화!)' : sd.name + ' (Lv.'+(lvl+1)+')'}`;
        gs.skills[key]++; 
      }
      
      const card = this.add.container(width/2, height/2 - 100 + (i * 100));
      const bg = this.add.rectangle(0, 0, 600, 70, 0xd35400);
      bg.setStrokeStyle(4, 0xf1c40f);
      const title = this.add.text(0, 0, skillName, { fontSize: '28px', fontStyle: 'bold', color: '#fff' }).setOrigin(0.5);
      card.add([bg, title]);
      
      card.setScale(0);
      this.tweens.add({ targets: card, scale: 1, duration: 500, delay: i * 400, ease: 'Back.easeOut' });
      this.time.delayedCall(i * 400, () => { isEvoCard ? SFX.evolve() : SFX.select(); });
    });

    gs.recalculateStats();

    const closeBtn = this.add.text(width/2, height - 100, '모두 받기 (돌아가기)', { fontSize: '28px', fill: '#fff', backgroundColor: '#e67e22', padding: { x: 30, y: 15 }, borderRadius: 10 }).setOrigin(0.5).setInteractive({ useHandCursor: true });
    closeBtn.setVisible(false);
    
    this.time.delayedCall(chosenOpts.length * 400 + 500, () => {
      closeBtn.setVisible(true);
    });

    closeBtn.on('pointerdown', () => {
      SFX.click();
      this.scene.resume('GameScene');
      this.scene.stop();
    });
  }
}

class LevelUpScene extends Phaser.Scene {
  constructor() { super('LevelUpScene'); }
  create() {
    const width = this.cameras.main.width;
    const height = this.cameras.main.height;
    const gs = this.scene.get('GameScene');
    SFX.levelUp();

    this.add.rectangle(0, 0, width, height, 0x000000, 0.8).setOrigin(0);
    this.add.text(width/2, height/2 - 250, '🎉 레벨 업! (새로운 배움) 🎉', { fontSize: '48px', fill: '#f1c40f', fontStyle: 'bold' }).setOrigin(0.5);

    let availableOpts = [];
    Object.keys(SKILL_DATA).forEach(key => {
      const sd = SKILL_DATA[key];
      const lvl = gs.skills[key];
      if (sd.type === 'passive' && lvl < 5) availableOpts.push(key);
      else if (sd.type === 'active') {
        if (lvl < 5) availableOpts.push(key);
        else if (lvl === 5 && gs.skills[sd.evoPassive] >= 1) availableOpts.push(key);
      }
    });

    // 단짝친구는 너무 사기라 일반 레벨업에서는 절대 등장하지 않고, 보스를 잡았을 때 나오는 보물 상자에서만 낮은 확률로 등장
    if (availableOpts.includes('friend')) {
      availableOpts.splice(availableOpts.indexOf('friend'), 1);
    }
    
    Phaser.Utils.Array.Shuffle(availableOpts);
    let chosenOpts = availableOpts.slice(0, 3);
    
    if (gs.registry.get('hp') < gs.registry.get('maxHp') && Math.random() < 0.15 && chosenOpts.length > 0) {
      chosenOpts[Phaser.Math.Between(0, chosenOpts.length - 1)] = 'clinic';
    }
    if (chosenOpts.length === 0) chosenOpts = ['clinic']; 

    chosenOpts.forEach((key, i) => {
      let skillName, skillDesc, icon, isEvo = false;
      if (key === 'clinic') {
        skillName = '🏥 보건실 휴식 (1회성)'; skillDesc = '체력을 100% 완전히 회복합니다.'; icon = '🩹';
      } else {
        const sd = SKILL_DATA[key];
        const lvl = gs.skills[key];
        isEvo = lvl === 5;
        skillName = `${sd.icon} ${isEvo ? sd.evoName : sd.name} ${lvl === 0 ? '(신규)' : isEvo ? '(진화!)' : '(Lv.'+(lvl+1)+')'}`;
        skillDesc = isEvo ? '궁극의 힘으로 각성합니다!' : sd.desc;
        icon = isEvo ? '🌟' : sd.type === 'active' ? '⚔️' : '🛡️';
      }

      const card = this.add.container(width/2, height/2 - 100 + (i * 100));
      const bg = this.add.rectangle(0, 0, 800, 80, isEvo ? 0xd35400 : key === 'clinic' ? 0x27ae60 : 0x2980b9).setInteractive({ useHandCursor: true });
      bg.setStrokeStyle(4, isEvo ? 0xf1c40f : 0x34495e);
      const title = this.add.text(-380, -20, skillName, { fontSize: '24px', fontStyle: 'bold', color: isEvo ? '#f1c40f' : '#fff' });
      const desc = this.add.text(-380, 10, skillDesc, { fontSize: '18px', color: '#ecf0f1' });
      const typeIcon = this.add.text(350, 0, icon, { fontSize: '32px' }).setOrigin(0.5);

      card.add([bg, title, desc, typeIcon]);
      bg.on('pointerover', () => bg.setFillStyle(isEvo ? 0xe67e22 : key === 'clinic' ? 0x2ecc71 : 0x3498db));
      bg.on('pointerout', () => bg.setFillStyle(isEvo ? 0xd35400 : key === 'clinic' ? 0x27ae60 : 0x2980b9));
      bg.on('pointerdown', () => this.selectSkill(key));
    });
  }

  selectSkill(key) {
    const gs = this.scene.get('GameScene');
    if (key === 'clinic') { gs.registry.set('hp', gs.registry.get('maxHp')); SFX.heal(); }
    else {
      const isEvo = gs.skills[key] === 5;
      gs.skills[key]++; gs.recalculateStats();
      isEvo ? SFX.evolve() : SFX.select();
    }
    this.scene.resume('GameScene');
    this.scene.stop();
  }
}
