    body, html {
      margin: 0;
      padding: 0;

      height: 100%;

      display: flex;

      align-items: center;
      overflow: hidden;

      height: 100vh;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
      overflow: hidden;
      touch-action: none;

    /* ══════════════════════════════════════════════
       📱 모바일/태블릿/전자칠판용 가상 조작 패드
       ══════════════════════════════════════════════ */
    #mobile-controls {
      display: none; /* GameScene이 시작될 때 JS에서 flex로 전환 */
      position: fixed;
      inset: 0;
      z-index: 1000;
      pointer-events: none; /* 자식 요소만 터치 반응 */
      user-select: none;
      -webkit-user-select: none;

    #joy-base {
      position: absolute;
      left: 30px;
      bottom: 30px;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: rgba(255,255,255,0.15);
      border: 3px solid rgba(255,255,255,0.4);
      touch-action: none;
      pointer-events: auto;
    }
    #joy-thumb {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 54px;
      height: 54px;
      margin-left: -27px;
      margin-top: -27px;
      border-radius: 50%;
      background: rgba(255,255,255,0.55);
      border: 2px solid rgba(255,255,255,0.7);
      pointer-events: none;

      right: 24px;
      bottom: 30px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      pointer-events: none;

      height: 64px;

      background: rgba(255,255,255,0.18);
      border: 3px solid rgba(255,255,255,0.4);

      font-size: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
      pointer-events: auto;
    }
    .action-btn:active, #joy-base:active {
      background: rgba(255,255,255,0.3);
    }

e:13px;color:var(--muted)}
    .hud-layer{pointer-events:none;padding:16px;z-index:1050}.hud-top{display:grid;grid-template-columns:minmax(190px,280px) 150px minmax(190px,280px);justify-content:space-between;gap:12px}.hud-box{background:#0c192ded;border:1px solid #3b506d;border-radius:16px;padding:12px 16px;box-shadow:0 4px 20px #0003}.hp-label{display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px}.hp-meter{height:9px;background:#4d2c3b;border-radius:9px;overflow:hidden}.hp-meter span{display:block;height:100%;background:#ff7c91;transition:width .15s}.exp-meter{height:5px;background:#35435b;border-radius:5px;overflow:hidden;margin-top:7px}.exp-meter span{display:block;height:100%;background:var(--accent)}.clock{text-align:center}.clock strong{font-size:28px;font-variant-numeric:tabular-nums;display:block;line-height:1.15}.clock small{color:#b3c4df;font-size:12px}.hud-right{text-align:right;font-size:14px}.hud-actions{margin-top:12px;display:flex;gap:8px;pointer-events:auto}.hud-actions .btn{background:#0c192ded;font-size:14px}.hud-consumables{position:absolute;right:18px;bottom:20px;display:flex;gap:10px;pointer-events:auto}.hud-consumables .btn{background:#122239ed;font-size:14px;min-width:100px}.hud-boss{margin:8px auto 0;max-width:360px;text-align:center;font-size:14px}.hud-boss progress{margin-top:4px}.ui-toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:2000;border:1px solid #6f8a5a;border-radius:12px;padding:13px 22px;background:#1e3526;color:#e3ffd4;max-width:90vw;box-shadow:0 8px 35px #0005;font:500 15px 'Noto Sans KR',sans-serif}.ui-layer[hidden]{display:none!important}#game-container canvas:focus-visible{outline:2px solid var(--accent)}

    @media(max-width:600px){.lobby{padding:18px 12px}.topline{flex-direction:column;gap:16px;margin-bottom:18px}.actions{gap:8px}.actions .btn{padding:9px 12px;font-size:14px}.balance{padding:9px 12px}.right-stack{grid-template-columns:1fr}.character-stage{grid-template-columns:100px 1fr;gap:16px;padding:20px 16px}.portrait{min-height:130px}.portrait img{width:88px;height:88px}.character-copy h2{font-size:27px}.character-copy p{font-size:14px}.roster{grid-template-columns:repeat(4,1fr);padding:0 16px 18px}.char-btn{font-size:13px}.panel-heading{padding:20px 18px 0}.choice-grid,.inventory-grid{grid-template-columns:1fr}.choice{min-height:180px}.dialog{padding:22px 18px}.modal-layer{padding:12px}.dialog{max-height:calc(100dvh - 24px)}.dialog-header h2{font-size:25px}.dialog-footer{flex-wrap:wrap}.dialog-footer .btn{flex:1}.hud-layer{padding:8px}.hud-top{grid-template-columns:1fr 92px;gap:7px}.hud-right{display:none}.hud-actions{gap:6px;margin-top:8px}.hud-actions .btn{font-size:12px;padding:8px 10px}.hp-label{font-size:12px}.guide{padding:16px;gap:10px}.achievement-row{grid-template-columns:30px 1fr}.achievement-row>.gold{grid-column:2}.footer-note{flex-direction:column}.result-stats{gap:6px}.result-stats div{padding:12px 6px}}
    .shop-row p{font-size:14px}.char-btn{font-size:14px}.shop-row .btn{font-size:14px}.ui-layer{word-break:keep-all;overflow-wrap:break-word}.dialog-footer{position:sticky;bottom:-30px;background:#132139;padding:14px 0;margin-bottom:-14px}
    @media(max-width:760px){.choice-grid{grid-template-columns:1fr}.choice{min-height:0;gap:9px;padding:18px}.choice .big-icon{display:none}.choice .choose{margin-top:8px}.inventory-grid{grid-template-columns:1fr}}

<body>
  <div id="game-container"></div>

  <div id="mobile-controls">
    <div id="joy-base"><div id="joy-thumb"></div></div>
    <div id="action-buttons">
      <div id="btn-magnet" class="action-btn">🧲</div>
      <div id="btn-bomb" class="action-btn">💣</div>
    </div>
  </div>

  <script>
// Phaser 3 대규모 뱀파이어 서바이벌 / 탕탕특공대 스타일 (단일 파일 배포용)

// ══════════════════════════════════════════════
// 🈶 한글 폰트 강제 적용 (기본 폰트가 'Courier'라 한글 자모가 깨지거나
// 기기(PC/모바일/전자칠판)마다 다르게 보이는 문제를 방지)
// ══════════════════════════════════════════════
(function patchDefaultKoreanFont() {
  const FONT_STACK = '"Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", "Nanum Gothic", sans-serif';
  const origText = Phaser.GameObjects.GameObjectFactory.prototype.text;
  Phaser.GameObjects.GameObjectFactory.prototype.text = function (x, y, text, style) {
    style = style || {};
    if (!style.fontFamily) style.fontFamily = FONT_STACK;
    return origText.call(this, x, y, text, style);
  };
})();

// ══════════════════════════════════════════════
// 🔊 사운드 엔진 (음원 파일 없이 Web Audio API로 합성 — 별도 리소스 로딩 불필요)
// ══════════════════════════════════════════════
const SFX = (() => {
  let ctx = null;
  let muted = localStorage.getItem('sfxMuted') === '1';
  let lastShoot = 0;
  let lastXp = 0;
  let lastKill = 0;

  function getCtx() {
    if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  function tone(freq, delay = 0, dur = 0.1, type = 'sine', vol = 0.2) {
    if (muted) return;
    try {
      const c = getCtx();
      const o = c.createOscillator();
      const g = c.createGain();
      o.type = type;
      o.frequency.setValueAtTime(freq, c.currentTime + delay);
      g.gain.setValueAtTime(vol, c.currentTime + delay);
      g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + delay + dur);
      o.connect(g); g.connect(c.destination);
      o.start(c.currentTime + delay);
      o.stop(c.currentTime + delay + dur + 0.02);
    } catch (e) {}
  }
  function noise(delay = 0, dur = 0.1, vol = 0.15, hp = 700) {
    if (muted) return;
    try {
      const c = getCtx();
      const bufferSize = Math.max(1, Math.floor(c.sampleRate * dur));
      const buffer = c.createBuffer(1, bufferSize, c.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
      const src = c.createBufferSource();
      src.buffer = buffer;
      const hpFilter = c.createBiquadFilter();
      hpFilter.type = 'highpass';
      hpFilter.frequency.value = hp;
      const g = c.createGain();
      g.gain.setValueAtTime(vol, c.currentTime + delay);
      g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + delay + dur);
      src.connect(hpFilter); hpFilter.connect(g); g.connect(c.destination);
      src.start(c.currentTime + delay);
      src.stop(c.currentTime + delay + dur + 0.02);
    } catch (e) {}
  }

  return {
    setMuted(v) { muted = v; localStorage.setItem('sfxMuted', v ? '1' : '0'); },
    isMuted() { return muted; },
    toggleMuted() { muted = !muted; localStorage.setItem('sfxMuted', muted ? '1' : '0'); return muted; },

    // 무기 발사 (여러 무기가 동시에 발사돼도 너무 시끄럽지 않도록 짧게 쓰로틀링)
    shootThrottled() {
      const now = performance.now();
      if (now - lastShoot < 65) return;
      lastShoot = now;
      tone(520 + Math.random() * 160, 0, 0.045, 'square', 0.05);
    },
    hurt() { noise(0, 0.1, 0.16, 500); tone(140, 0, 0.16, 'sawtooth', 0.16); },
    kill() { tone(660, 0, 0.05, 'square', 0.07); tone(440, 0.03, 0.06, 'square', 0.05); },
    killThrottled() {
      // 후반부엔 한 프레임에 몬스터가 여러 마리 죽기도 해서, 소리가 뭉개지지 않도록 살짝 쓰로틀링
      const now = performance.now();
      if (now - lastKill < 45) return;
      lastKill = now;
      tone(660, 0, 0.045, 'square', 0.06);
    },
    bossHit() { tone(300, 0, 0.06, 'square', 0.08); },
    bossDefeat() {
      tone(200, 0, 0.15, 'sawtooth', 0.2); tone(150, 0.13, 0.15, 'sawtooth', 0.2); tone(100, 0.26, 0.32, 'sawtooth', 0.22);
      tone(523.25, 0.4, 0.12, 'triangle', 0.2); tone(659.25, 0.5, 0.12, 'triangle', 0.2); tone(783.99, 0.6, 0.2, 'triangle', 0.22);
    },
    xp() {
      // 짧은 시간에 여러 개 먹어도 삐-------- 계속 이어지지 않도록 살짝 쓰로틀링
      const now = performance.now();
      if (now - lastXp < 35) return;
      lastXp = now;
      tone(1000 + Math.random() * 200, 0, 0.035, 'sine', 0.045);
    },
    gold() { tone(1046.5, 0, 0.05, 'square', 0.09); tone(1318.5, 0.04, 0.08, 'square', 0.09); },
    heal() { tone(587.33, 0, 0.08, 'triangle', 0.15); tone(880, 0.07, 0.14, 'triangle', 0.15); },
    pickupItem() { tone(700, 0, 0.05, 'square', 0.1); tone(1000, 0.04, 0.08, 'square', 0.1); },
    levelUp() { tone(523.25, 0, 0.1, 'triangle', 0.2); tone(659.25, 0.09, 0.1, 'triangle', 0.2); tone(783.99, 0.18, 0.1, 'triangle', 0.2); tone(1046.5, 0.27, 0.26, 'triangle', 0.22); },
    chest() { tone(400, 0, 0.08, 'square', 0.15); tone(600, 0.07, 0.1, 'square', 0.15); tone(900, 0.14, 0.16, 'square', 0.15); },
    select() { tone(600, 0, 0.05, 'square', 0.14); tone(800, 0.05, 0.07, 'square', 0.12); },
    evolve() { [0, 0.08, 0.16, 0.24, 0.34].forEach((d, i) => tone(440 * (1 + i * 0.35), d, 0.16, 'triangle', 0.2)); },
    bossWarn() { tone(160, 0, 0.3, 'sawtooth', 0.22); tone(110, 0.26, 0.42, 'sawtooth', 0.22); },
    gameOver() { tone(300, 0, 0.2, 'sawtooth', 0.25); tone(250, 0.18, 0.2, 'sawtooth', 0.25); tone(180, 0.36, 0.4, 'sawtooth', 0.22); },
    gameClear() { [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach((f, i) => tone(f, i * 0.11, 0.22, 'triangle', 0.2)); },
    click() { tone(700, 0, 0.04, 'square', 0.1); },

window.touchMove = { x: 0, y: 0, active: false };
window.touchZPressed = false; // 자석 버튼
window.touchXPressed = false; // 폭탄 버튼

(function setupMobileControls() {
  const controlsRoot = document.getElementById('mobile-controls');
  const joyBase = document.getElementById('joy-base');
  const joyThumb = document.getElementById('joy-thumb');
  const btnMagnet = document.getElementById('btn-magnet');
  const btnBomb = document.getElementById('btn-bomb');

  let joyPointerId = null;

  function updateJoy(clientX, clientY) {
    const rect = joyBase.getBoundingClientRect();
    const maxDist = rect.width / 2;
    let dx = clientX - (rect.left + rect.width / 2);
    let dy = clientY - (rect.top + rect.height / 2);
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist > maxDist) { dx = (dx / dist) * maxDist; dy = (dy / dist) * maxDist; }
    joyThumb.style.transform = `translate(${dx}px, ${dy}px)`;
    const nx = dx / maxDist;
    const ny = dy / maxDist;
    window.touchMove.x = nx;
    window.touchMove.y = ny;
    window.touchMove.active = Math.sqrt(nx * nx + ny * ny) > 0.15;
  }

  function resetJoy() {
    joyPointerId = null;
    window.touchMove.x = 0;
    window.touchMove.y = 0;
    window.touchMove.active = false;
    joyThumb.style.transform = 'translate(0px, 0px)';
  }

  joyBase.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    if (joyPointerId !== null) return;
    joyPointerId = e.pointerId;
    joyBase.setPointerCapture(e.pointerId);
    updateJoy(e.clientX, e.clientY);
  });
  joyBase.addEventListener('pointermove', (e) => {
    if (e.pointerId !== joyPointerId) return;
    e.preventDefault();
    updateJoy(e.clientX, e.clientY);
  });
  joyBase.addEventListener('pointerup', (e) => { if (e.pointerId === joyPointerId) resetJoy(); });
  joyBase.addEventListener('pointercancel', (e) => { if (e.pointerId === joyPointerId) resetJoy(); });

  btnMagnet.addEventListener('pointerdown', (e) => { e.preventDefault(); window.touchZPressed = true; });
  btnBomb.addEventListener('pointerdown', (e) => { e.preventDefault(); window.touchXPressed = true; });

  // Phaser 씬 전환에 맞춰 조작 패드 표시/숨김
  window.showMobileControls = () => { controlsRoot.style.display = 'flex'; };
  window.hideMobileControls = () => { controlsRoot.style.display = 'none'; };
})();

const Achievements = {
  getStat(key) { return parseInt(localStorage.getItem('stat_' + key)) || 0; },
  setStat(key, value) { localStorage.setItem('stat_' + key, value); },
  addStat(key, amount) {
    const v = this.getStat(key) + amount;
    this.setStat(key, v);
    return v;
  },
  isUnlocked(id) { return localStorage.getItem('ach_' + id) === '1'; },
  // 처음 달성하는 순간에만 해당 업적 정보를 반환하고, 이미 달성했다면 null 반환
  unlock(id) {
    if (this.isUnlocked(id)) return null;
    localStorage.setItem('ach_' + id, '1');
    const def = ACHIEVEMENT_DEFS.find(a => a.id === id) || null;
    if (def && def.goldReward) {
      const gold = (parseInt(localStorage.getItem('gold')) || 0) + def.goldReward;
      localStorage.setItem('gold', gold);
    }
    return def;
  },
  // 누적 수치 기준 카테고리(kills/plays/survival/items)를 확인해 새로 달성한 업적 목록을 반환
  checkCategory(category, value) {
    const newlyUnlocked = [];
    ACHIEVEMENT_DEFS.filter(a => a.category === category && a.threshold !== undefined).forEach(a => {
      if (value >= a.threshold && !this.isUnlocked(a.id)) {
        const unlocked = this.unlock(a.id);
        if (unlocked) newlyUnlocked.push(unlocked);
      }
    });
    return newlyUnlocked;
  },
  getClearedChars() {
    try { return JSON.parse(localStorage.getItem('clearedChars')) || []; } catch (e) { return []; }
  },
  // 해당 캐릭터의 클리어 기록을 남기고, 전 캐릭터 클리어가 완성되면 업적을 반환
  recordCharClear(name) {
    const list = this.getClearedChars();
    if (!list.includes(name)) {
      list.push(name);
      localStorage.setItem('clearedChars', JSON.stringify(list));
    }
    const newlyUnlocked = [];
    if (ALL_CHAR_NAMES.every(n => list.includes(n))) {
      const u = this.unlock('all_chars_clear');
      if (u) newlyUnlocked.push(u);
    }
    return newlyUnlocked;
  },
  // 🍎 teacher_unlock 자신을 제외한 모든 상장이 달성되었는지 확인 후, 조건 충족 시 자동으로 해금
  checkAllComplete() {
    if (this.isUnlocked('teacher_unlock')) return null;
    const allDone = ACHIEVEMENT_DEFS.filter(a => a.id !== 'teacher_unlock').every(a => this.isUnlocked(a.id));
    if (!allDone) return null;
    return this.unlock('teacher_unlock');

  // 상장 획득 토스트를 화면 맨 위쪽에 눈에 띄게, 짧게 띄움
  // (전용 ToastScene을 사용해 어떤 화면 위에서든 항상 최상단에 보임)

    // 어떤 상장이 새로 뜨는 순간이든, 그로 인해 "모든 상장 달성"이 완성됐는지 함께 확인
    const list = achievements ? achievements.slice() : [];
    const teacherAch = this.checkAllComplete();
    if (teacherAch) list.push(teacherAch);
    if (!list.length || !scene) return;
    const toastScene = (scene.scene && typeof scene.scene.get === 'function' && scene.scene.get('ToastScene')) || scene;
    if (!toastScene || !toastScene.add || !toastScene.sys.isActive()) return;
    const width = toastScene.cameras.main.width;
    const hideY = -70;
    const showY = 34;
    list.forEach((ach, i) => {
      toastScene.time.delayedCall(i * 850, () => {
        if (!toastScene.sys.isActive()) return;
        SFX.evolve();
        const container = toastScene.add.container(width / 2, hideY).setDepth(9000).setAlpha(0).setScale(0.6);
        const glow = toastScene.add.rectangle(0, 0, 580, 92, 0xf1c40f, 0.35);
        const bg = toastScene.add.rectangle(0, 0, 550, 82, 0x1c2530, 0.97).setStrokeStyle(5, 0xf1c40f);
        const iconTxt = toastScene.add.text(-245, 0, ach.icon, { fontSize: '40px' }).setOrigin(0.5);
        const titleTxt = toastScene.add.text(-195, -18, '🏆 상장 획득!', { fontSize: '16px', color: '#f1c40f', fontStyle: 'bold' }).setOrigin(0, 0.5);
        const nameTxt = toastScene.add.text(-195, 16, ach.name, { fontSize: '26px', color: '#fff', fontStyle: 'bold' }).setOrigin(0, 0.5);
        container.add([glow, bg, iconTxt, titleTxt, nameTxt]);
        if (ach.goldReward) {
          const goldTxt = toastScene.add.text(245, 0, `+${ach.goldReward}G`, { fontSize: '22px', color: '#f1c40f', fontStyle: 'bold' }).setOrigin(1, 0.5);
          container.add(goldTxt);

// 화면 위쪽에 잠깐 크게 띄움 (상장 토스트보다 더 강하고 눈에 띄게, ToastScene 사용)
// ══════════════════════════════════════════════
const EventBanner = {
  show(scene, title, subtitle, accentColor = 0xe74c3c) {
    if (!scene) return;
    const toastScene = (scene.scene && typeof scene.scene.get === 'function' && scene.scene.get('ToastScene')) || scene;
    if (!toastScene || !toastScene.add || !toastScene.sys.isActive()) return;
    const width = toastScene.cameras.main.width;
    const hideY = -110;
    const showY = 46;

    const container = toastScene.add.container(width / 2, hideY).setDepth(9500).setAlpha(0).setScale(0.7);
    const glow = toastScene.add.rectangle(0, 0, 900, 130, accentColor, 0.28);
    const bg = toastScene.add.rectangle(0, 0, 860, 116, 0x1c2530, 0.97).setStrokeStyle(5, accentColor);
    const titleTxt = toastScene.add.text(0, -22, title, { fontSize: '30px', color: '#ffffff', fontStyle: 'bold', align: 'center' }).setOrigin(0.5);
    const subTxt = toastScene.add.text(0, 22, subtitle, { fontSize: '19px', color: '#f1c40f', fontStyle: 'bold', align: 'center' }).setOrigin(0.5);
    container.add([glow, bg, titleTxt, subTxt]);

    toastScene.tweens.add({
      targets: container, alpha: 1, y: showY, scale: 1, duration: 380, ease: 'Back.easeOut',
      onComplete: () => {
        toastScene.tweens.add({ targets: glow, alpha: { from: 0.55, to: 0.15 }, duration: 320, yoyo: true, repeat: 2 });
        toastScene.time.delayedCall(2200, () => {
          if (container.active) {
            toastScene.tweens.add({ targets: container, alpha: 0, y: hideY + 30, scale: 0.85, duration: 320, ease: 'Cubic.easeIn', onComplete: () => container.destroy() });
          }
        });
      }
    });
  }
};

    pxr(0, 0, 64, 64, 0xdcc07f);
    // 모래 알갱이 (약간 어두운 점들, 고정 패턴)
    g.fillStyle(0xcaa863, 1);
    [[4,6],[18,3],[30,10],[46,5],[58,14],[10,20],[24,26],[40,22],[52,28],[6,36],[20,40],[34,36],[48,42],[60,38],[14,52],[28,58],[44,54],[56,60],[2,58],[38,8]].forEach(([px,py]) => g.fillRect(px, py, 2, 2));

    pxr(0, 16, 64, 1, 0xefdca6);

    // ══════════════════════════════════════════════

    g.fillStyle(0xe8590c, 1);
    g.fillCircle(20, 16, 15);

    g.lineStyle(3, 0xffffff, 1);
    g.strokeCircle(20, 16, 10);
    // 콘 끝부분 (뾰족한 꼭대기, 중심의 작은 원)
    g.fillStyle(0xf47b3f, 1);
    g.fillCircle(20, 16, 4);
    g.generateTexture('obstacle_cone', 40, 36);

    // ══════════════════════════════════════════════
    // 물웅덩이 장판 (112x112) - 운동장 맵의 끈끈이(슬로우 지형) 대체 이미지
    // ══════════════════════════════════════════════
    g.clear();

    g.fillStyle(0x5dade2, 1);
    g.fillEllipse(56, 60, 92, 68);
    g.fillEllipse(28, 40, 40, 32);
    g.fillEllipse(84, 36, 36, 28);
    // 테두리 (젖은 흙의 진한 갈색)
    g.lineStyle(4, 0x8d6e4a, 1);
    g.strokeEllipse(56, 60, 92, 68);
    // 수면 반짝임 하이라이트

    g.fillEllipse(40, 48, 16, 8);
    g.fillEllipse(68, 68, 12, 6);
    g.fillEllipse(76, 44, 8, 5);
    g.generateTexture('terrain_puddle', 112, 112);

    // ══════════════════════════════════════════════

    pxr(9,3,4,4,0x1a1a1a);
    pxr(3,9,4,4,0x1a1a1a);
    pxr(15,9,4,4,0x1a1a1a);
    pxr(9,15,4,4,0x1a1a1a);
    pxr(9,9,4,4,0x1a1a1a);
    g.lineStyle(1, 0xbdc3c7); g.strokeCircle(11, 11, 11);

    // ══════════════════════════════════════════════
    g.clear();
    pxr(0, 0, 28, 28, 0xe74c3c);
    g.fillStyle(0x2980b9);
    g.fillTriangle(28, 0, 28, 28, 0, 28);
    g.lineStyle(2, 0xffffff);
    g.beginPath(); g.moveTo(0, 0); g.lineTo(28, 28); g.strokePath();

    pxr(6, 3, 8, 3, 0xf39c12);
    pxr(4, 6, 12, 6, 0xf39c12);
    pxr(3, 12, 14, 3, 0xd68910);
    pxr(2, 15, 16, 2, 0xb9770e);
    pxr(9, 17, 2, 3, 0x784212);
    pxr(7, 5, 3, 2, 0xf8c471);
    g.generateTexture('bell_gfx', 20, 20);

    // 텍스처 생성에만 쓰인 임시 그래픽 객체는 더 이상 필요 없으므로 해제
    g.destroy();
  }
  create() { this.scene.launch('ToastScene'); this.scene.start('TitleScene'); }
}

// ══════════════════════════════════════════════
// 🏆 상장 토스트 전용 스코어: 어떤 화면(타이틀/플레이 중/보스전/레벨업 메뉴 등) 위에서도
// 항상 최상단에 보이도록 게임 시작 시 한 번 실행되어 계속 켜져 있는 전용 오버레이 씬
// ══════════════════════════════════════════════
class ToastScene extends Phaser.Scene {
  constructor() { super('ToastScene'); }
  create() {}
}

class TitleScene extends Phaser.Scene {
  constructor() { super('TitleScene'); }
  // 🐛 버그 수정: 영구 업그레이드/캐릭터 잠금해제 구매 시 this.scene.restart()로 화면을
  // 다시 그리는데, 그 전에 구매해둔 "1회성 아이템(폭탄/자석/선행학습)"과 선택 중이던 캐릭터가
  // 지역 변수라서 재시작과 함께 초기화되어 사라지던 문제. init(data)로 이전 상태를 넘겨받아 복원한다.
  init(data) {
    data = data || {};
    this.restoredSelectedChar = data.selectedChar || 0;
    this.restoredOneTimeBomb = !!data.oneTimeBomb;
    this.restoredOneTimeMagnet = !!data.oneTimeMagnet;
    this.restoredOneTimeStartItem = !!data.oneTimeStartItem;
  }
  create() {
    if (window.hideMobileControls) window.hideMobileControls();
    const width = this.cameras.main.width;
    const height = this.cameras.main.height;
    
    // 데이터 로드
    let gold = parseInt(localStorage.getItem('gold')) || 0;
    let upgHp = parseInt(localStorage.getItem('upgHp')) || 0;
    let upgSpeed = parseInt(localStorage.getItem('upgSpeed')) || 0;
    let upgExp = parseInt(localStorage.getItem('upgExp')) || 0;
    let upgMagnet = parseInt(localStorage.getItem('upgMagnet')) || 0;
    let upgStartItem = parseInt(localStorage.getItem('upgStartItem')) || 0;
    let charScholarUnlocked = localStorage.getItem('charScholarUnlocked') === '1';
    if (charScholarUnlocked) {
      const u = Achievements.unlock('scholar_unlock');
      if (u) {
        Achievements.showToasts(this, [u]);
        gold = parseInt(localStorage.getItem('gold')) || 0; // 업적 골드 보상 반영
      }
    }
    const charTeacherUnlocked = Achievements.isUnlocked('teacher_unlock');
    
    let selectedChar = this.restoredSelectedChar || 0;
    const chars = [
      { name: '회장', desc: '경험치 획득 범위 30% 넓음\n무기: 바른말 고운말', tex: 'player', weapon: 'praise' },
      { name: '장난꾸러기', desc: '이동속도 20% 빠름, 체력 20 낮음\n무기: 종이 비행기', tex: 'player_2', weapon: 'airplane' },
      { name: '운동선수', desc: '최대 체력 30 높음, 크리티컬 증가\n무기: 축구 수업', tex: 'player_3', weapon: 'soccer' },
      { name: '음악가', desc: '모든 무기 쿨타임 10% 추가 감소\n무기: 리코더 연주', tex: 'player_4', weapon: 'recorder' },
      { name: '미술부원', desc: '장판형 무기(웅덩이·안전지대 등) 범위 20% 증가\n무기: 수채화 그리기', tex: 'player_5', weapon: 'paint' },
      { name: '모범생', desc: '경험치 획득량 20% 증가\n무기: 도서관 책 소나기 + 바른말 고운말', tex: 'player_6', weapon: ['library', 'praise'], locked: !charScholarUnlocked, lockType: 'purchase', cost: 10000, unlockKey: 'charScholarUnlocked' },
      { name: '선생님', desc: '선생님은 강하다.', tex: 'player_7', weapon: 'praise', locked: !charTeacherUnlocked, lockType: 'achievement' }
    ];

    this.add.text(width/2, 80, '학교 서바이벌', { fontSize: '56px', fontStyle: 'bold', color: '#fff', stroke: '#34495e', strokeThickness: 8 }).setOrigin(0.5);
    
    const goldText = this.add.text(width - 50, 50, `보유 골드: ${gold} 🪙`, { fontSize: '28px', color: '#f1c40f', fontStyle: 'bold' }).setOrigin(1, 0);

    // 🔊 음소거 버튼 (좌측 상단)
    const muteBtn = this.add.text(20, 20, SFX.isMuted() ? '🔇' : '🔊', { fontSize: '30px', fill: '#fff', backgroundColor: '#34495e', padding: { x: 12, y: 8 }, borderRadius: 5 }).setInteractive({ useHandCursor: true });
    muteBtn.on('pointerdown', () => {
      const nowMuted = SFX.toggleMuted();
      muteBtn.setText(nowMuted ? '🔇' : '🔊');
      if (!nowMuted) SFX.click();
    });

    // 🏆 상장첩 버튼 (좌측 상단, 음소거 버튼 아래)
    const achBtn = this.add.text(20, 70, '🏆 상장첩', { fontSize: '22px', fill: '#fff', backgroundColor: '#8e44ad', padding: { x: 12, y: 8 }, borderRadius: 5 }).setInteractive({ useHandCursor: true });
    achBtn.on('pointerdown', () => {
      SFX.click();
      this.scene.pause();
      this.scene.launch('AchievementScene');
    });

    // 상점 UI
    this.add.rectangle(width/2 - 300, 370, 440, 460, 0x2c3e50, 0.8).setOrigin(0.5).setStrokeStyle(4, 0x34495e);
    this.add.text(width/2 - 300, 180, '[ 영구 업그레이드 상점 ]', { fontSize: '28px', color: '#fff', fontStyle: 'bold' }).setOrigin(0.5);
    
    const costs = [10, 100, 500, 1000, 2000];
    const itemCosts = [3000, 10000]; // 선행학습 가격 인상
    
    const drawUpgrade = (y, label, level, maxLevel, costArr, key) => {
      this.add.text(width/2 - 480, y, `${label} (Lv.${level}/${maxLevel})`, { fontSize: '20px', color: '#ecf0f1' });
      if (level < maxLevel) {
        let cost = costArr[level];
        let btn = this.add.text(width/2 - 160, y, `${cost}G 구매`, { fontSize: '18px', backgroundColor: '#e67e22', padding: {x:10,y:5}, borderRadius:5 }).setInteractive({useHandCursor:true});
        btn.on('pointerdown', () => {
          if(gold >= cost) {
            SFX.buy();
            gold -= cost; localStorage.setItem('gold', gold);
            localStorage.setItem(key, level + 1);
            // 🐛 재시작해도 이미 골드를 낸 1회성 아이템과 선택 중이던 캐릭터가 사라지지 않도록 함께 전달
            this.scene.restart({ selectedChar, oneTimeBomb, oneTimeMagnet, oneTimeStartItem });
          } else {
            SFX.error();
          }
        });
      } else {
        this.add.text(width/2 - 160, y, `MAX`, { fontSize: '18px', color: '#2ecc71', fontStyle: 'bold' });
      }
    };
    
    drawUpgrade(240, '체력 단련 (+HP)', upgHp, 5, costs, 'upgHp');
    drawUpgrade(310, '달리기 연습 (+이속)', upgSpeed, 5, costs, 'upgSpeed');
    drawUpgrade(380, '매점 VIP (+경험치)', upgExp, 5, costs, 'upgExp');
    drawUpgrade(450, '자력 증가 (+아이템)', upgMagnet, 5, costs, 'upgMagnet');
    drawUpgrade(520, '선행 학습 (+시작아이템)', upgStartItem, 2, itemCosts, 'upgStartItem');

    // 캐릭터 선택 UI
    this.add.rectangle(width/2 + 300, 370, 440, 460, 0x2c3e50, 0.8).setOrigin(0.5).setStrokeStyle(4, 0x34495e);
    this.add.text(width/2 + 300, 160, '[ 캐릭터 선택 ]', { fontSize: '28px', color: '#fff', fontStyle: 'bold' }).setOrigin(0.5);

    // 🖼️ 실제 캐릭터 미리보기 스프라이트 (이름/설명 텍스트만으론 어떤 모습인지 안 보여서 추가)
    const charPreview = this.add.image(width/2 + 300, 208, chars[0].tex).setOrigin(0.5).setScale(2);
    const charPreviewLock = this.add.text(width/2 + 300, 208, '🔒', { fontSize: '40px' }).setOrigin(0.5).setVisible(false);

    const charName = this.add.text(width/2 + 300, 258, chars[0].name, { fontSize: '32px', color: '#3498db', fontStyle: 'bold' }).setOrigin(0.5);
    const charDesc = this.add.text(width/2 + 300, 325, chars[0].desc, { fontSize: '20px', color: '#ecf0f1', align: 'center', wordWrap: { width: 350 }, lineSpacing: 8 }).setOrigin(0.5);
    
    // 🌟 "선생님" 히든 캐릭터 전용 골드 테두리 반짝임 연출 (해금 후 선택했을 때만 등장)
    const teacherGlowRing = this.add.rectangle(width/2 + 300, 370, 456, 476, 0x000000, 0)
      .setStrokeStyle(6, 0xf1c40f).setVisible(false);
    const teacherSparklePositions = [
      { x: width/2 + 90,  y: 155 }, { x: width/2 + 510, y: 155 },
      { x: width/2 + 90,  y: 600 }, { x: width/2 + 510, y: 600 },
      { x: width/2 + 300, y: 138 }
    ];
    const teacherSparkles = teacherSparklePositions.map(p =>
      this.add.text(p.x, p.y, '✨', { fontSize: '26px' }).setOrigin(0.5).setVisible(false).setAlpha(0)
    );
    let teacherGlowTween = null;
    const teacherSparkleTweens = [];
    const setTeacherGlow = (active) => {
      if (active) {
        teacherGlowRing.setVisible(true);
        if (!teacherGlowTween) {
          teacherGlowTween = this.tweens.add({
            targets: teacherGlowRing, alpha: { from: 0.35, to: 1 },
            duration: 700, yoyo: true, repeat: -1, ease: 'Sine.easeInOut'
          });
        } else teacherGlowTween.play();
        teacherSparkles.forEach((star, idx) => {
          star.setVisible(true);
          if (!teacherSparkleTweens[idx]) {
            teacherSparkleTweens[idx] = this.tweens.add({
              targets: star, alpha: { from: 0, to: 1 }, scale: { from: 0.6, to: 1.3 },
              duration: 550, yoyo: true, repeat: -1, delay: idx * 180, ease: 'Sine.easeInOut'
            });
          } else teacherSparkleTweens[idx].play();
        });
      } else {
        if (teacherGlowTween) teacherGlowTween.pause();
        teacherGlowRing.setVisible(false);
        teacherSparkleTweens.forEach(t => t && t.pause());
        teacherSparkles.forEach(star => star.setVisible(false));
      }
    };

    const charColors = ['#3498db', '#e74c3c', '#2ecc71', '#9b59b6', '#e67e22', '#16a085', '#d4af37'];
    const updateChar = () => {
      const c = chars[selectedChar];
      charName.setText(c.name);
      charName.setColor(charColors[selectedChar] || '#ffffff');
      charDesc.setText(c.desc);

      charPreview.setTexture(c.tex);
      charPreview.setTint(c.locked ? 0x555555 : 0xffffff);
      charPreviewLock.setVisible(!!c.locked);
      this.tweens.killTweensOf(charPreview);
      charPreview.setScale(2.5);
      this.tweens.add({ targets: charPreview, scale: 2, duration: 220, ease: 'Back.easeOut' });

      setTeacherGlow(c.name === '선생님' && !c.locked);

      if (c.locked) {
        startBtn.setVisible(false);
        buyCharBtn.setVisible(true);
        if (c.lockType === 'achievement') {
          // 골드 구매가 아니라 업적 달성으로만 해금되는 캐릭터 - 클릭해도 아무 일도 일어나지 않음
          buyCharBtn.setFontSize(22);
          buyCharBtn.setText(`🔒 ${c.name}: 상장첩 모든 상장 달성 시 자동 해금`);
          buyCharBtn.setBackgroundColor('#7f8c8d');
          buyCharBtn.disableInteractive();
        } else {
          buyCharBtn.setFontSize(32);
          buyCharBtn.setText(`🔒 ${c.name} 잠금 해제 (${c.cost}G)`);
          buyCharBtn.setBackgroundColor(gold >= c.cost ? '#e67e22' : '#7f8c8d');
          buyCharBtn.setInteractive({ useHandCursor: true });
        }
      } else {
        startBtn.setVisible(true);
        buyCharBtn.setVisible(false);
      }
    };

    const prevBtn = this.add.text(width/2 + 130, 208, '◀', { fontSize: '30px', color: '#fff' }).setOrigin(0.5).setInteractive({useHandCursor:true});
    const nextBtn = this.add.text(width/2 + 470, 208, '▶', { fontSize: '30px', color: '#fff' }).setOrigin(0.5).setInteractive({useHandCursor:true});
    prevBtn.on('pointerdown', () => { SFX.click(); selectedChar = (selectedChar - 1 + chars.length) % chars.length; updateChar(); });
    nextBtn.on('pointerdown', () => { SFX.click(); selectedChar = (selectedChar + 1) % chars.length; updateChar(); });

    // 1회성 상점 UI
    this.add.text(width/2 + 300, 395, '[ 1회성 아이템 (이번 판만 적용) ]', { fontSize: '21px', color: '#f1c40f', fontStyle: 'bold' }).setOrigin(0.5);
    this.add.text(width/2 + 300, 425, '(Z: 자석  /  X: 폭탄 사용)', { fontSize: '16px', color: '#bdc3c7' }).setOrigin(0.5);
    
    // 🐛 영구 업그레이드/캐릭터 구매로 인한 scene.restart() 이후에도 이미 구매했던 1회성
    // 아이템이 사라지지 않도록, init()에서 넘겨받은 이전 상태로 초기값을 복원한다.
    let oneTimeBomb = this.restoredOneTimeBomb;
    let oneTimeMagnet = this.restoredOneTimeMagnet;
    let oneTimeStartItem = this.restoredOneTimeStartItem;
    
    const drawOneTime = (y, label, cost, alreadyPurchased, onBuy) => {
      let purchased = alreadyPurchased;
      let statusText = this.add.text(width/2 + 455, y, purchased ? '✓ 장착' : '대기', { fontSize: '16px', color: purchased ? '#2ecc71' : '#95a5a6' }).setOrigin(0, 0.5);
      let btn = this.add.text(width/2 + 130, y, `${cost}G`, { fontSize: '17px', backgroundColor: purchased ? '#7f8c8d' : '#8e44ad', padding: {x:8,y:4} }).setOrigin(0, 0.5).setInteractive({useHandCursor:true});
      this.add.text(width/2 + 200, y, label, { fontSize: '18px', color: '#ecf0f1' }).setOrigin(0, 0.5);
      
      btn.on('pointerdown', () => {
        if(gold >= cost && !purchased) {
          purchased = true;
          SFX.buy();
          gold -= cost; localStorage.setItem('gold', gold);
          goldText.setText(`보유 골드: ${gold} 🪙`);
          statusText.setText('✓ 장착'); statusText.setColor('#2ecc71');
          btn.setBackgroundColor('#7f8c8d');
          onBuy();
        } else if (!purchased) {
          SFX.error();
        }
      });
    };
    
    drawOneTime(460, '💣 싹쓸이 폭탄', 50, oneTimeBomb, () => { oneTimeBomb = true; });
    drawOneTime(500, '🧲 강력 자석', 30, oneTimeMagnet, () => { oneTimeMagnet = true; });
    drawOneTime(540, '📖 선행 학습 +1', 500, oneTimeStartItem, () => { oneTimeStartItem = true; });

    // 시작 버튼
    const startBtn = this.add.text(width/2, 650, '▶ 등교하기 (게임 시작)', { fontSize: '36px', color: '#ffffff', backgroundColor: '#2ecc71', padding: { x: 40, y: 15 }, borderRadius: 10 }).setOrigin(0.5).setInteractive({ useHandCursor: true });
    startBtn.on('pointerdown', () => {
      SFX.click();
      this.scene.start('GameScene', { 
        character: chars[selectedChar], 
        upgHp: upgHp, upgSpeed: upgSpeed, upgExp: upgExp, upgMagnet: upgMagnet, upgStartItem: upgStartItem,
        oneTimeBomb: oneTimeBomb, oneTimeMagnet: oneTimeMagnet, oneTimeStartItem: oneTimeStartItem
      });
    });

    // 잠긴 캐릭터(모범생 등) 영구 구매 버튼 - 시작 버튼과 같은 자리에 겹쳐두고 잠금 여부에 따라 표시 전환
    const buyCharBtn = this.add.text(width/2, 650, '🔒 잠금 해제', { fontSize: '32px', color: '#ffffff', backgroundColor: '#7f8c8d', padding: { x: 40, y: 15 }, borderRadius: 10 }).setOrigin(0.5).setInteractive({ useHandCursor: true }).setVisible(false);
    buyCharBtn.on('pointerdown', () => {
      const c = chars[selectedChar];
      if (c.locked && gold >= c.cost) {
        SFX.buy();
        gold -= c.cost;
        localStorage.setItem('gold', gold);
        localStorage.setItem(c.unlockKey, '1');
        // 🐛 재시작해도 이미 골드를 낸 1회성 아이템과 선택 중이던 캐릭터가 사라지지 않도록 함께 전달
        this.scene.restart({ selectedChar, oneTimeBomb, oneTimeMagnet, oneTimeStartItem });
      } else {
        SFX.error();
      }
    });
  }
}

class GameClearScene extends Phaser.Scene {

class GameScene extends Phaser.Scene {
  constructor() { super('GameScene'); }
  
  init(data) {
    if (!data) data = {};
    this.selectedChar = data.character || { name: '회장', tex: 'player', weapon: 'praise' };
    this.upgHp = data.upgHp || 0;
    this.upgSpeed = data.upgSpeed || 0;
    this.upgExp = data.upgExp || 0;
    this.upgMagnet = data.upgMagnet || 0;
    this.upgStartItem = data.upgStartItem || 0;
    this.oneTimeBomb = data.oneTimeBomb || false;
    this.oneTimeMagnet = data.oneTimeMagnet || false;
    this.oneTimeStartItem = data.oneTimeStartItem || false;
  }

  create() {
    // 운동장 맵: 장난꾸러기 / 운동선수 캐릭터로 플레이할 때만 적용 (바닥·지형 이미지만 교체)
    this.isPlaygroundMap = (this.selectedChar.name === '장난꾸러기' || this.selectedChar.name === '운동선수');

    this.cameras.main.setBackgroundColor('#ecf0f1');
    const bg = this.add.tileSprite(0, 0, 4000, 4000, this.isPlaygroundMap ? 'bg_tile_sand' : 'bg_tile').setOrigin(0);

    this.player = this.physics.add.sprite(2000, 2000, this.selectedChar.tex);
    this.player.setCollideWorldBounds(true);
    // Keep movement collisions close to the character's torso instead of the
    // transparent edges of the 32x32 sprite.
    this.player.body.setSize(18, 22, true);
    this.player.lastDirX = 1;
    this.player.lastDirY = 0;

    // ❤️ 캐릭터 머리 위에 작게 뜨는 체력바 (상단 UI 표시가 다른 요소에 가려 보기 힘들다는 피드백 반영)
    this.hpBarWidth = 40;
    this.hpBarOffsetY = -(this.player.displayHeight / 2) - 10;
    this.hpBarBg = this.add.rectangle(this.player.x, this.player.y + this.hpBarOffsetY, this.hpBarWidth, 6, 0x000000, 0.6)
      .setOrigin(0.5).setStrokeStyle(1, 0xffffff, 0.85).setDepth(500);
    this.hpBarFill = this.add.rectangle(this.player.x - this.hpBarWidth / 2, this.player.y + this.hpBarOffsetY, this.hpBarWidth, 6, 0x2ecc71)
      .setOrigin(0, 0.5).setDepth(501);

    // 🛡️ 스마트워치 방어막 바 (체력바 바로 위, 방어막을 가지고 있을 때만 표시)
    this.shieldHp = 0;
    this.shieldMaxHp = 0;
    this.shieldRegenDelay = 20000;
    this.shieldRegenTimer = null;
    this.shieldBarBg = this.add.rectangle(this.player.x, this.player.y + this.hpBarOffsetY - 8, this.hpBarWidth, 5, 0x000000, 0.6)
      .setOrigin(0.5).setStrokeStyle(1, 0xffffff, 0.85).setDepth(500).setVisible(false);
    this.shieldBarFill = this.add.rectangle(this.player.x - this.hpBarWidth / 2, this.player.y + this.hpBarOffsetY - 8, this.hpBarWidth, 5, 0x3498db)
      .setOrigin(0, 0.5).setDepth(501).setVisible(false);
    
    this.registry.set('level', 1);
    this.registry.set('exp', 0);
    this.registry.set('maxExp', this.getMaxExpForLevel(1));
    this.registry.set('hp', 100 + (this.upgHp * 15));
    this.registry.set('maxHp', 100 + (this.upgHp * 15));
    this.registry.set('time', 0);
    this.registry.set('kills', 0); 
    this.gameTime = 0;
    this.lastBossTime = 0; // 종합평가(5분마다) 스폰 타이밍
    this.lastUnitBossTime = 0; // 단원평가(60초마다) 스폰 타이밍
    this.nextHomeworkBossTime = 900; // 방학숙제(최종보스) 다음 등장 시각(초). 기본 15분 간격, 30분(엔들리스) 이후엔 5분 간격으로 단축됨
    this.finalBossActive = false; // 종합평가 또는 방학숙제가 활동 중인 동안 단원평가 스폰 억제용
    this.homeworkBossActive = false; // 방학숙제가 활동 중인 동안 종합평가 스폰 억제용
    this.stickerBuffExpireAt = 0; // ⭐ 칭찬 스티커 버프 만료 시각(this.time.now 기준). 새로 주우면 이 값만 갱신(연장)하고,
                                   // 실제 배율 적용/해제는 항상 recalculateStats()가 이 값을 보고 판단하므로 중첩 픽업에도 안전함
    this.enemySpawnCounter = 0; // 몬스터가 스폰될 때마다 1씩 증가하는 고유 번호(슬로우/화상 등 지연 효과가 나중에 실행될 때, 그 사이에 같은 풀 슬롯이 다른 몬스터로 재사용되지 않았는지 확인하는 용도)
    this.lastNoticeCheckTime = 0; // 알림장 검사 이벤트 트리거용
    this.playerInDust = false; // 미세먼지 구름 근접 여부 (매 프레임 갱신)
    this.prevInDust = false;
    this.playerInGlue = false; // 끈끈이 장판 위에 있는지 여부 (매 프레임 갱신)

    // 🏆 업적: 무피해 생존 타이머, 생존시간 체크 캐시
    this.damageFreeSince = this.time.now;
    this.noDamageAchieved = false;
    this.lastAchievementTimeCheck = -1;

    // 🏆 업적: 누적 플레이 횟수 갱신
    const totalPlays = Achievements.addStat('totalPlays', 1);
    this.time.delayedCall(500, () => Achievements.showToasts(this, Achievements.checkCategory('plays', totalPlays)));

    // 🔥 집중력 이벤트: 3~5분 간격으로 몬스터·경험치·골드 2배 이벤트 발생
    this.eventActive = false;
    this.eventMultiplier = 1;
    this.eventEndTime = 0;
    this.nextEventTime = Phaser.Math.Between(180000, 300000);

    // 🏃 몰려오는 무리(약한 몬스터 떼): 90~150초 간격, 보스 활동 중엔 발생하지 않음
    this.nextSwarmTime = Phaser.Math.Between(90000, 150000);

    this.skills = {};
    Object.keys(SKILL_DATA).forEach(k => this.skills[k] = 0);
    const starterWeapons = Array.isArray(this.selectedChar.weapon) ? this.selectedChar.weapon : [this.selectedChar.weapon];
    starterWeapons.forEach(w => { this.skills[w] = 1; });
    
    // 선행 학습: 영구 upgStartItem + 1회성 oneTimeStartItem 합산
    const totalStartItems = this.upgStartItem + (this.oneTimeStartItem ? 1 : 0);
    if (totalStartItems > 0) {
      let activeKeys = Object.keys(SKILL_DATA).filter(k => SKILL_DATA[k].type === 'active' && !starterWeapons.includes(k));
      Phaser.Utils.Array.Shuffle(activeKeys);
      for(let i=0; i<totalStartItems; i++) {
        if (activeKeys[i]) this.skills[activeKeys[i]] = 1;
      }
    }

    this.weaponTimers = {};
    this.stats = {};
    this.recalculateStats();

    this.enemies = this.physics.add.group({ classType: Phaser.Physics.Arcade.Sprite, maxSize: 450 }); // 무리 이벤트(최대 26마리)+탄막+보스가 한꺼번에 겹쳐도 여유가 있도록 300→450으로 상향
    this.projectiles = this.physics.add.group({ classType: Phaser.Physics.Arcade.Sprite, maxSize: 500 });
    this.exps = this.physics.add.group({ classType: Phaser.Physics.Arcade.Sprite, maxSize: 400 });
    this.pools = this.physics.add.group({ classType: Phaser.Physics.Arcade.Sprite, maxSize: 100 });
    this.items = this.physics.add.group({ classType: Phaser.Physics.Arcade.Sprite, maxSize: 50 });

    // 소모품 슬롯 (맵에 스폰 대신 키 입력 방식으로 사용)
    this.consumables = { bomb: this.oneTimeBomb, magnet: this.oneTimeMagnet };
    
    this.obstacles = this.physics.add.staticGroup();
    for(let i=0; i<50; i++) {
      let ox = Phaser.Math.Between(100, 3900);
      let oy = Phaser.Math.Between(100, 3900);
      if (Phaser.Math.Distance.Between(2000, 2000, ox, oy) > 500) {
        this.obstacles.create(ox, oy, this.isPlaygroundMap ? 'obstacle_cone' : 'obstacle_desk');
      }
    }

    // 끈끈이 장판: 충돌 없이 밟고 지나갈 수 있지만, 위에 있는 동안 이동속도가 느려짐
    this.stickyZones = [];
    for (let i = 0; i < 22; i++) {
      let sx = Phaser.Math.Between(100, 3900);
      let sy = Phaser.Math.Between(100, 3900);
      if (Phaser.Math.Distance.Between(2000, 2000, sx, sy) > 400) {
        this.add.image(sx, sy, this.isPlaygroundMap ? 'terrain_puddle' : 'terrain_glue');
        this.stickyZones.push({ x: sx, y: sy, radiusSq: 84 * 84 });
      }
    }

    this.recorderAura = this.add.circle(this.player.x, this.player.y, 100, 0x8e44ad, 0.3);
    this.physics.add.existing(this.recorderAura);
    this.recorderAura.body.setCircle(100);
    this.recorderAura.setVisible(false);

    this.spawnDelay = 1000;
    this.spawnTimerEvent = this.time.addEvent({ delay: this.spawnDelay, callback: this.spawnEnemy, callbackScope: this, loop: true });
    
    this.weaponTimers = {};
    this.updateWeaponTimers();
    this.time.addEvent({ delay: 1000, callback: this.regenHp, callbackScope: this, loop: true });

    this.physics.add.collider(this.player, this.obstacles);
    // 🪑 일반 몬스터는 책상/라바콘 같은 장애물에 막혀야 하지만, 보스 탄막(projectile)과 스마트폰
    // 투척물(smartphone_shot)은 장애물에 걸려 멈춰버리면 예측 불가능한 임시 장애물이 되어 회피 판정을
    // 방해하고, 매 프레임 불필요한 충돌 연산으로 렉을 유발할 수 있음. 플레이어 무기 투사체가 애초에
    // 장애물과 충돌하지 않는 것과 동일하게, 탄막류도 장애물을 그대로 통과하도록 제외한다.
    this.physics.add.collider(this.enemies, this.obstacles, null, (enemy) => {
      return enemy.enemyType !== 'projectile' && enemy.enemyType !== 'smartphone_shot';
    }, this);

    this.physics.add.overlap(this.projectiles, this.enemies, this.hitEnemyWithProjectile, null, this);
    this.physics.add.overlap(this.player, this.enemies, this.hurtPlayer, this.isAccurateDangerContact, this);
    this.physics.add.overlap(this.player, this.exps, this.collectExp, null, this);
    this.physics.add.overlap(this.player, this.items, this.collectItem, null, this);

    this.physics.world.setBounds(0, 0, 4000, 4000);
    this.cameras.main.setBounds(0, 0, 4000, 4000);
    this.cameras.main.startFollow(this.player, true, 0.1, 0.1);
    this.cursors = this.input.keyboard.createCursorKeys();
    this.wasd = this.input.keyboard.addKeys({ up: 87, down: 83, left: 65, right: 68 });
    
    // 소모품 단축키 등록
    this.keyZ = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.Z);
    this.keyX = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.X);

    // 모바일 가상 조작 패드: 플레이 중에만 표시, 일시정지(레벨업/보물상자 등) 중엔 숨김
    if (window.showMobileControls) window.showMobileControls();
    this.events.on('pause', () => { if (window.hideMobileControls) window.hideMobileControls(); });
    this.events.on('resume', () => { if (window.showMobileControls) window.showMobileControls(); });
    this.events.on('shutdown', () => { if (window.hideMobileControls) window.hideMobileControls(); });
    
    this.orbitAngle = 0;

    // ── 바운스 애니메이션 (걷기 상하 흔들림)
    // originY를 tween하여 카메라 흔들림 없이 시각적 바운스 효과 구현
    this.player.setOrigin(0.5, 0.5);
    this._bounceTween = this.tweens.add({
      targets: this.player,
      originY: { from: 0.5, to: 0.6 },
      duration: 180,
      yoyo: true,
      repeat: -1,
      ease: 'Sine.easeInOut',
      paused: true
    });
    this._isMoving = false;
    
    this.scene.launch('UIScene');
  }

  updateWeaponTimers() {
    for (let key in this.weaponTimers) this.weaponTimers[key].remove();
    const cd = this.stats.cooldownMult;

    if (this.skills.praise > 0)    this.weaponTimers.praise    = this.time.addEvent({ delay: (this.skills.praise >= 6    ? 150  : Math.max(200,  1000 - this.skills.praise * 100))  * cd, callback: this.firePraise,    callbackScope: this, loop: true });
    if (this.skills.bubble > 0)    this.weaponTimers.bubble    = this.time.addEvent({ delay: (this.skills.bubble >= 6    ? 300  : Math.max(500,  2500 - this.skills.bubble * 300))  * cd, callback: this.fireBubble,    callbackScope: this, loop: true });
    if (this.skills.crosswalk > 0) this.weaponTimers.crosswalk = this.time.addEvent({ delay: (this.skills.crosswalk >= 6 ? 400  : Math.max(800,  3000 - this.skills.crosswalk * 400)) * cd, callback: this.fireCrosswalk, callbackScope: this, loop: true });
    if (this.skills.airplane > 0)  this.weaponTimers.airplane  = this.time.addEvent({ delay: (this.skills.airplane >= 6  ? 300  : Math.max(800,  2000 - this.skills.airplane * 200))  * cd, callback: this.fireAirplane,  callbackScope: this, loop: true });
    if (this.skills.idea > 0)      this.weaponTimers.idea      = this.time.addEvent({ delay: (this.skills.idea >= 6      ? 500  : Math.max(1000, 3000 - this.skills.idea * 400))      * cd, callback: this.fireIdea,      callbackScope: this, loop: true });
    if (this.skills.water > 0)     this.weaponTimers.water     = this.time.addEvent({ delay: (this.skills.water >= 6     ? 500  : Math.max(1000, 3000 - this.skills.water * 300))     * cd, callback: this.fireWater,     callbackScope: this, loop: true });
    if (this.skills.library > 0)   this.weaponTimers.library   = this.time.addEvent({ delay: (this.skills.library >= 6   ? 400  : Math.max(600,  2500 - this.skills.library * 300))   * cd, callback: this.fireLibrary,   callbackScope: this, loop: true });
    if (this.skills.cleanroom > 0) this.weaponTimers.cleanroom = this.time.addEvent({ delay: (this.skills.cleanroom >= 6 ? 500  : Math.max(800,  3000 - this.skills.cleanroom * 350)) * cd, callback: this.fireCleanroom, callbackScope: this, loop: true });
    if (this.skills.paint > 0)     this.weaponTimers.paint     = this.time.addEvent({ delay: (this.skills.paint >= 6     ? 600  : Math.max(1000, 3500 - this.skills.paint * 400))     * cd, callback: this.firePaint,     callbackScope: this, loop: true });
    if (this.skills.math > 0)      this.weaponTimers.math      = this.time.addEvent({ delay: (this.skills.math >= 6      ? 300  : Math.max(500,  2000 - this.skills.math * 250))      * cd, callback: this.fireMath,      callbackScope: this, loop: true });
    if (this.skills.hula > 0)      this.weaponTimers.hula      = this.time.addEvent({ delay: (this.skills.hula >= 6      ? 800  : Math.max(1200, 4000 - this.skills.hula * 400))     * cd, callback: this.fireHula,      callbackScope: this, loop: true });
    if (this.skills.chalk > 0)     this.weaponTimers.chalk     = this.time.addEvent({ delay: (this.skills.chalk >= 6     ? 150  : Math.max(300,  1500 - this.skills.chalk * 200))     * cd, callback: this.fireChalk,     callbackScope: this, loop: true });
    if (this.skills.jumprope > 0)  this.weaponTimers.jumprope  = this.time.addEvent({ delay: (this.skills.jumprope >= 6  ? 300  : Math.max(450,  1250 - this.skills.jumprope * 150))  * cd, callback: this.fireJumprope,  callbackScope: this, loop: true });
    if (this.skills.alcohol > 0)   this.weaponTimers.alcohol   = this.time.addEvent({ delay: (this.skills.alcohol >= 6   ? 400  : Math.max(700,  3000 - this.skills.alcohol * 350))   * cd, callback: this.fireAlcohol,   callbackScope: this, loop: true });
    if (this.skills.bell > 0)      this.weaponTimers.bell      = this.time.addEvent({ delay: (this.skills.bell >= 6      ? 4000 : Math.max(5000, 9000 - this.skills.bell * 800))      * cd, callback: this.fireBell,      callbackScope: this, loop: true });
    if (this.skills.soccer > 0)    this.weaponTimers.soccer    = this.time.addEvent({ delay: (this.skills.soccer >= 6    ? 350  : Math.max(600,  2200 - this.skills.soccer * 250))    * cd, callback: this.fireSoccer,    callbackScope: this, loop: true });
    if (this.skills.ddakji > 0)    this.weaponTimers.ddakji    = this.time.addEvent({ delay: (this.skills.ddakji >= 6    ? 500  : Math.max(700,  2600 - this.skills.ddakji * 350))    * cd, callback: this.fireDdakji,    callbackScope: this, loop: true });
    if (this.skills.mop > 0)       this.weaponTimers.mop       = this.time.addEvent({ delay: (this.skills.mop >= 6       ? 500  : Math.max(900,  3200 - this.skills.mop * 350))     * cd, callback: this.fireMop,       callbackScope: this, loop: true });
    // 칭찬 스티커판: 공격 무기가 아니라 일정 주기로 필드에 스티커를 띄우는 패시브 (쿨타임 감소 영향은 받지 않음)
    if (this.skills.sticker > 0)   this.weaponTimers.sticker   = this.time.addEvent({ delay: Math.max(8000, 25000 - this.skills.sticker * 2000), callback: this.spawnStickerItem, callbackScope: this, loop: true });
  }

  regenHp() {
    if (this.stats.hpRegen > 0) {
      let hp = this.registry.get('hp');
      let maxHp = this.registry.get('maxHp');
      if (hp < maxHp) this.registry.set('hp', Math.min(maxHp, hp + this.stats.hpRegen));
    }
  }

  isInStickyZone(x, y) {
    if (!this.stickyZones || !this.stickyZones.length) return false;
    for (let i = 0; i < this.stickyZones.length; i++) {
      const z = this.stickyZones[i];
      const dx = x - z.x, dy = y - z.y;
      if ((dx * dx + dy * dy) <= z.radiusSq) return true;
    }
    return false;
  }

  // ─── 🔥 집중력 이벤트: 몬스터 스폰·경험치·골드 2배 (3~5분마다, 20초간 지속) ────────────────
  startFocusEvent() {
    this.eventActive = true;
    this.eventMultiplier = 2;
    this.eventEndTime = this.gameTime + 20000;
    SFX.bossWarn();
    EventBanner.show(this, '집중력이 떨어진다. 집중하자!!', '⚡ 몬스터 · 경험치 · 골드 2배 이벤트! (20초간)', 0xe74c3c);
  }

  endFocusEvent() {
    this.eventActive = false;
    this.eventMultiplier = 1;
    this.nextEventTime = this.gameTime + Phaser.Math.Between(180000, 300000);
  }

  recalculateStats() {
    const isTeacher = this.selectedChar.name === '선생님';
    this.stats.speedMult  = 1.0 + (this.skills.shoes * 0.15) + (this.upgSpeed * 0.1) + (isTeacher ? 0.2 : 0);
    this.registry.set('maxHp', 100 + (this.skills.milk * 10) + (this.skills.lunchbox * 20) + (this.upgHp * 15));
    this.stats.hpRegen    = this.skills.milk * 1 + this.skills.lunchbox * 0.5;
    // 🎚️ 밸런스 패치: 돋보기(크기)와 쿨타임 감소류가 너무 강력해 '사기' 조합으로 지적됨 - 계수 하향 및 쿨타임 하한선 상향
    this.stats.sizeMult   = 1.0 + (this.skills.glasses * 0.08);
    this.stats.cooldownMult = Math.max(0.35, (1.0 - (this.skills.diary * 0.05)) * (this.selectedChar.name === '음악가' ? 0.9 : 1) * (isTeacher ? 0.9 : 1));
    this.stats.magnetMult = 1.0 + (this.skills.magnet * 0.3) + (this.upgMagnet * 0.25) + (isTeacher ? 0.3 : 0) + (this.selectedChar.name === '회장' ? 0.3 : 0);
    this.stats.damageMult = 1.0 + (this.skills.power * 0.15) + (this.skills.pencilcase * 0.12) + (isTeacher ? 0.1 : 0);
    this.stats.armor      = this.skills.book * 3;
    this.stats.durationMult = 1.0 + (this.skills.hourglass * 0.15); // 🎚️ 너프: 레벨당 +25% → +15%
    this.stats.amount     = this.skills.friend;
    this.stats.expMult    = 1.0 + (this.skills.badge * 0.2) + (this.upgExp * 0.15) + (this.selectedChar.name === '모범생' ? 0.2 : 0) + (isTeacher ? 0.3 : 0);
    this.stats.crit       = this.skills.clover * 0.1 + (this.selectedChar.name === '운동선수' ? 0.2 : 0);
    this.stats.projSpeed  = 1.0 + (this.skills.fan * 0.2);
    this.stats.poolRadiusMult = 1.0 + (this.selectedChar.name === '미술부원' ? 0.2 : 0);

    // ⭐ 칭찬 스티커: 버프가 아직 유효한 동안만 배율을 곱해서 적용.
    // recalculateStats()가 매번 이 시각을 다시 확인해서 배율을 새로 계산하는 방식이라(직접 곱해두고 나중에
    // 되돌리는 방식이 아님), 버프 지속시간 중에 또 하나를 주워서 만료 시각을 늘려도 서로의 효과를 지우지 않음.
    if (this.time.now < (this.stickerBuffExpireAt || 0)) {
      this.stats.damageMult *= 1.2;
      this.stats.speedMult *= 1.15;
      this.stats.cooldownMult = Math.max(0.1, this.stats.cooldownMult * 0.85);
    }

    // ⌚ 스마트워치: 쿨타임 감소 대신, 일정 체력의 방어막을 두르는 패시브로 변경.
    // 방어막은 실제 체력과 별개의 체력을 가지며, 다 닳으면 깨지고 일정 시간 후 다시 가득 찬 상태로 생성됨(무적이 아니라 "막아주는 체력").
    const newShieldMax = this.skills.watch > 0 ? (20 + this.skills.watch * 15) : 0;
    if (newShieldMax > (this.shieldMaxHp || 0)) {
      // 처음 스마트워치를 얻었거나 레벨업으로 최대치가 늘어난 순간 - 방어막을 가득 채워줌
      this.shieldMaxHp = newShieldMax;
      this.shieldHp = this.shieldMaxHp;
      if (this.shieldRegenTimer) { this.shieldRegenTimer.remove(); this.shieldRegenTimer = null; } // 재생성 대기 중이었다면 취소하고 바로 채움
      this.updateShieldVisual();
    } else {
      this.shieldMaxHp = newShieldMax;
    }
    // 방어막 재생성까지 걸리는 시간: 레벨이 올라도 방어막 최대치만 늘어나고, 재생 속도는 항상 고정 (13초)
    // (기존엔 레벨이 오를수록 재생성 시간까지 계속 짧아져서 최대치+재생속도가 같이 사기적으로 강해지는 문제가 있었음)
    this.shieldRegenDelay = this.skills.watch > 0 ? 13000 : 20000;

    this.updateWeaponTimers();
  }

  getClosestEnemy() {
    let closest = null, minD = Infinity;
    this.enemies.getChildren().forEach(e => {
      if (e.active) {
        let d = Phaser.Math.Distance.Between(this.player.x, this.player.y, e.x, e.y);
        if (d < minD) { minD = d; closest = e; }
      }
    });
    return closest;
  }

  // 특정 좌표 기준으로 가장 가까운 방해꾼 찾기 (exclude로 지정한 대상은 제외) - 축구공 튕기기용
  getClosestEnemyFrom(x, y, exclude) {
    let closest = null, minD = Infinity;
    this.enemies.getChildren().forEach(e => {
      if (e.active && e !== exclude) {
        let d = Phaser.Math.Distance.Between(x, y, e.x, e.y);
        if (d < minD) { minD = d; closest = e; }
      }
    });
    return closest;
  }

  calculateDamage(base) {
    let dmg = base * this.stats.damageMult;
    if (Math.random() < this.stats.crit) dmg *= 2; 
    return dmg;
  }

  firePraise() {
    SFX.shootThrottled();
    const isEvo = this.skills.praise >= 6;
    let count = (isEvo ? 3 : 1) + this.stats.amount;
    const words = ['사랑', '감사', '배려', '친절'];
    for(let i=0; i<count; i++) {
      this.time.delayedCall(i * 50, () => {
        let e = this.getClosestEnemy();
        if(!e) return;
        
        // 텍스트 투사체 생성
        const word = Phaser.Utils.Array.GetRandom(words);
        const color = isEvo ? '#f1c40f' : '#ffffff';
        const txt = this.add.text(this.player.x, this.player.y, word, { 
          fontSize: (20 * this.stats.sizeMult * (isEvo ? 1.5 : 1)) + 'px', 
          fontStyle: 'bold', fill: color, stroke: '#000', strokeThickness: 3 
        }).setOrigin(0.5);
        
        this.physics.add.existing(txt);
        this.projectiles.add(txt);
        
        txt.body.setCircle(10); // 대략적인 충돌 영역
        txt.weaponType = 'praise'; 
        txt.damage = this.calculateDamage(10 + this.skills.praise * 5) * (isEvo ? 3 : 1); 
        txt.pierce = isEvo ? 999 : 0; 
        
        this.physics.moveToObject(txt, e, 500 * this.stats.projSpeed * (isEvo ? 1.5 : 1));
        txt.deathTime = this.time.now + 1500 * this.stats.durationMult;
      });
    }
  }

  fireBubble() {
    SFX.shootThrottled();
    const isEvo = this.skills.bubble >= 6;
    const count = (isEvo ? 3 : 1) + this.stats.amount;
    for(let i=0; i<count; i++) {
      const proj = this.projectiles.get();
      if (proj) {
        proj.enableBody(true, this.player.x, this.player.y, true, true);
        proj.setTexture('bubble_bullet').setScale(this.stats.sizeMult * (isEvo ? 3 : 1));
        if(isEvo) proj.setAlpha(0.6).setTint(0xff00ff);
        else proj.setAlpha(1).clearTint();
        proj.weaponType = 'bubble'; proj.damage = this.calculateDamage(15 + this.skills.bubble * 8) * (isEvo ? 4 : 1); proj.pierce = isEvo ? 999 : (3 + this.skills.bubble); 
        const angle = Phaser.Math.Between(0, 360) * Math.PI / 180;
        proj.setVelocity(Math.cos(angle) * 80 * this.stats.projSpeed, Math.sin(angle) * 80 * this.stats.projSpeed);
        proj.deathTime = this.time.now + 5000 * this.stats.durationMult;
      }
    }
  }

  fireCrosswalk() {
    SFX.shootThrottled();
    const isEvo = this.skills.crosswalk >= 6;
    const count = (isEvo ? 2 : 1) + this.stats.amount;
    for(let i=0; i<count; i++) {
      const pool = this.pools.get();
      if (pool) {
        const rx = this.player.x + Phaser.Math.Between(-200, 200);
        const ry = this.player.y + Phaser.Math.Between(-200, 200);
        pool.enableBody(true, rx, ry, true, true);
        pool.setTexture('crosswalk_pool');
        const scale = this.stats.sizeMult * (isEvo ? 2.5 : 1);
        pool.setScale(scale).setAlpha(0.6);
        if(isEvo) pool.setTint(0xffd700);
        else pool.clearTint();

        // 🏥 보건실: 몬스터에게는 아무 효과가 없고, 이 구역 안에 서 있는 나만 체력을 회복합니다.
        // 회복량 = 스킬 레벨 그대로 (1레벨=1, 2레벨=2, 3레벨=3 ...), 진화 시에만 3배
        pool.isPaintPool = false;
        pool.isHealPool = true;
        pool.healAmount = this.skills.crosswalk * (isEvo ? 3 : 1);
        pool.lastHealTick = 0;
        pool.deathTime = this.time.now + (3000 + this.skills.crosswalk * 500) * this.stats.durationMult * (isEvo ? 3 : 1);

        // "보건실" 텍스트 라벨을 풀과 같은 위치/수명으로 부착
        if (pool.safetyLabel) { pool.safetyLabel.destroy(); pool.safetyLabel = null; }
        const label = this.add.text(rx, ry, '보건실', { fontSize: '17px', color: '#1e6b3a', fontStyle: 'bold' }).setOrigin(0.5);
        label.setScale(scale);
        label.setAlpha(0.85);
        pool.safetyLabel = label;
      }
    }
  }

  // ─── 🪣 물청소: 슬로우 없이 순수 지속 피해를 주는 물걸레 자국 ────────────────
  fireMop() {
    SFX.shootThrottled();
    const isEvo = this.skills.mop >= 6;
    const count = (isEvo ? 3 : 1) + this.stats.amount;
    const scale = this.stats.sizeMult * (isEvo ? 2.2 : 1.3) * (1 + this.skills.mop * 0.1);

    for (let i = 0; i < count; i++) {
      const pool = this.pools.get();
      if (!pool) continue;
      const rx = this.player.x + Phaser.Math.Between(-220, 220);
      const ry = this.player.y + Phaser.Math.Between(-220, 220);
      pool.enableBody(true, rx, ry, true, true);
      pool.setTexture('mop_pool').setScale(scale).setAlpha(0.7);
      if (isEvo) pool.setTint(0x00e5ff); else pool.clearTint();
      pool.damage = this.calculateDamage(6 + this.skills.mop * 4) * (isEvo ? 3 : 1);
      pool.isPaintPool = false;
      pool.isHealPool = false;
      pool.deathTime = this.time.now + (2800 + this.skills.mop * 400) * this.stats.durationMult * (isEvo ? 2 : 1);
    }
  }

  fireAirplane() {
    SFX.shootThrottled();
    const isEvo = this.skills.airplane >= 6;
    const count = (isEvo ? 5 : 1) + this.stats.amount;
    let closest = this.getClosestEnemy();
    let baseAngle = closest ? Phaser.Math.Angle.Between(this.player.x, this.player.y, closest.x, closest.y) : 0;
    
    for(let i=0; i<count; i++) {
      const proj = this.projectiles.get();
      if (proj) {
        proj.enableBody(true, this.player.x, this.player.y, true, true);
        proj.setTexture('airplane_bullet').setScale(this.stats.sizeMult * (isEvo ? 1.5 : 1));
        if(isEvo) proj.setTint(0xffaa00);
        else proj.clearTint();
        proj.weaponType = 'airplane'; 
        proj.damage = this.calculateDamage(15 + this.skills.airplane * 5) * (isEvo ? 3 : 1); 
        proj.pierce = isEvo ? 999 : (3 + this.skills.airplane);
        
        let angle = baseAngle + (i - Math.floor(count/2)) * 0.15; 
        proj.rotation = angle;
        proj.setVelocity(Math.cos(angle) * 500 * this.stats.projSpeed * (isEvo ? 1.5 : 1), Math.sin(angle) * 500 * this.stats.projSpeed * (isEvo ? 1.5 : 1));

        proj.deathTime = this.time.now + 3000 * this.stats.durationMult;
      }
    }
  }

  fireIdea() {
    SFX.shootThrottled();
    const isEvo = this.skills.idea >= 6;
    const count = (isEvo ? 8 : (1 + Math.floor(this.skills.idea / 2))) + this.stats.amount;
    let activeEnemies = this.enemies.getChildren().filter(e => e.active);
    Phaser.Utils.Array.Shuffle(activeEnemies);
    
    for(let i=0; i<Math.min(count, activeEnemies.length); i++) {
        let e = activeEnemies[i];
        e.hp -= this.calculateDamage(20 + this.skills.idea * 10) * (isEvo ? 4 : 1);
        this.flashEnemy(e);
        
        let flash = this.add.circle(e.x, e.y, 40 * this.stats.sizeMult * (isEvo ? 2 : 1), 0xf1c40f, 0.8);
        this.tweens.add({ targets: flash, alpha: 0, duration: 300, onComplete: () => flash.destroy() });
        this.checkEnemyDeath(e);
    }
  }

  fireWater() {
    SFX.shootThrottled();
    const isEvo = this.skills.water >= 6;
    // 레벨업 시 발사되는 물방울 갯수 증가 (레벨당 2개씩 추가)
    const count = (isEvo ? 8 : 2 + (this.skills.water * 2)) + this.stats.amount;
    for(let i=0; i<count; i++) {
      const proj = this.projectiles.get();
      if (proj) {
        proj.enableBody(true, this.player.x, this.player.y, true, true);
        proj.setTexture('water_bullet').setScale(this.stats.sizeMult * (isEvo ? 2 : 1));
        if(isEvo) proj.setTint(0x00ffff);
        else proj.clearTint();
        // 레벨업 시 데미지 큰 폭으로 증가
        proj.weaponType = 'water'; proj.damage = this.calculateDamage(8 + this.skills.water * 8) * (isEvo ? 3 : 1); proj.pierce = 999;
        
        proj.setDrag(400); 
        const angle = Phaser.Math.Between(0, 360) * Math.PI / 180;
        proj.setVelocity(Math.cos(angle) * 500 * this.stats.projSpeed * (isEvo ? 1.5 : 1), Math.sin(angle) * 500 * this.stats.projSpeed * (isEvo ? 1.5 : 1));
        proj.deathTime = this.time.now + 3000 * this.stats.durationMult * (isEvo ? 2 : 1);
      }
    }
  }

  // ─── 📚 도서관 책 소나기: 8방향으로 책 발사 ───────────────────────────
  // ─── 📚 도서관 책 소나기: 8방향으로 책을 멀리, 강하게 밀고 나가며 공격 ───────────────────────────
  fireLibrary() {
    SFX.shootThrottled();
    const isEvo = this.skills.library >= 6;
    const dirs = isEvo ? 12 : 8;
    const count = 1 + this.stats.amount;
    for (let r = 0; r < count; r++) {
      for (let i = 0; i < dirs; i++) {
        const proj = this.projectiles.get();
        if (!proj) continue;
        proj.enableBody(true, this.player.x, this.player.y, true, true);
        proj.setTexture('library_bullet').setScale(this.stats.sizeMult * (isEvo ? 1.8 : 1));
        if (isEvo) proj.setTint(0xffd700); else proj.clearTint();
        proj.weaponType = 'library'; proj.damage = this.calculateDamage(12 + this.skills.library * 5) * (isEvo ? 3 : 1);
        // 지뢰처럼 제자리에서 소멸하지 않도록 관통 횟수를 넉넉하게 줘서 대열을 그대로 밀고 지나가게 함
        proj.pierce = isEvo ? 999 : (6 + this.skills.library * 2);
        const angle = (Math.PI * 2 / dirs) * i;
        proj.setRotation(angle);
        // 사거리를 크게 늘려 화면을 가로지르듯 쭉쭉 날아가게 하고, 그만큼 이동한 뒤엔 자동 소멸시켜 렉을 방지
        proj.setVelocity(Math.cos(angle) * 620 * this.stats.projSpeed, Math.sin(angle) * 620 * this.stats.projSpeed);
        proj.deathTime = this.time.now + 3000 * this.stats.durationMult;
      }
    }
  }

  // ─── 🧹 청소하기: 4방향 파동 ────────────────────────────────────
  fireCleanroom() {
    SFX.shootThrottled();
    const isEvo = this.skills.cleanroom >= 6;
    const waves = isEvo ? 4 : 2;
    const damage = this.calculateDamage(10 + this.skills.cleanroom * 6) * (isEvo ? 3 : 1);
    const dirs = [[1,0],[-1,0],[0,1],[0,-1]];
    for (let d = 0; d < waves * (isEvo ? 2 : 1); d++) {
      const proj = this.projectiles.get();
      if (!proj) continue;
      proj.enableBody(true, this.player.x, this.player.y, true, true);
      proj.setTexture('cleanroom_wave').setScale(this.stats.sizeMult * (isEvo ? 2 : 1));
      if (isEvo) proj.setTint(0x00eeff); else proj.clearTint();
      proj.setAlpha(0.75);
      proj.weaponType = 'cleanroom'; proj.damage = damage; proj.pierce = 999;
      const dir = dirs[d % 4];
      const speed = 200 * this.stats.projSpeed;
      proj.setVelocity(dir[0] * speed, dir[1] * speed);
      proj.deathTime = this.time.now + 1000 * this.stats.durationMult;
    }
  }

  // ─── ⭕ 훌라후프 날리기: 직선 관통 ────────────────────
  fireHula() {
    SFX.shootThrottled();
    const isEvo = this.skills.hula >= 6;
    const count = (isEvo ? 3 : 1) + this.stats.amount;
    for (let i = 0; i < count; i++) {
      const proj = this.projectiles.get();
      if (!proj) continue;
      proj.enableBody(true, this.player.x, this.player.y, true, true);
      proj.setTexture('hula_ring').setScale(this.stats.sizeMult * (isEvo ? 2.5 : 1.5));
      if (isEvo) proj.setTint(0xffd700); else proj.clearTint();
      
      proj.weaponType = 'hula'; 
      proj.damage = this.calculateDamage(15 + this.skills.hula * 5) * (isEvo ? 3 : 1); 
      proj.pierce = 999; 
      
      // 랜덤 방향이나 가까운 적 방향으로 발사
      let target = this.getClosestEnemy();
      let angle = Phaser.Math.Between(0, 360) * Math.PI / 180;
      if (target && Math.random() > 0.3) { // 70% 확률로 가까운 적 조준
        angle = Phaser.Math.Angle.Between(this.player.x, this.player.y, target.x, target.y);
      }
      
      // 여러 개 발사 시 부채꼴로 퍼지게
      angle += (i - Math.floor(count/2)) * 0.2; 
      
      proj.setVelocity(Math.cos(angle) * 450 * this.stats.projSpeed, Math.sin(angle) * 450 * this.stats.projSpeed);
      // 계속 돌아가는 효과 (회전)
      proj.setAngularVelocity(400); 
      proj.deathTime = this.time.now + 2500 * this.stats.durationMult;
    }
  }

  // ─── 🖍️ 집중의 시선: 플레이어가 바라보는 방향으로 발사 (단검) ────────────────
  fireChalk() {
    SFX.shootThrottled();
    const isEvo = this.skills.chalk >= 6;
    // 레벨1에서 1발, 레벨2에서 2발... 레벨5에서 5발, 진화시 8발
    const count = (isEvo ? 8 : this.skills.chalk);
    
    // 마지막으로 이동했던 방향(상하좌우/대각선 8방향)을 사용
    const baseAngle = Math.atan2(this.player.lastDirY, this.player.lastDirX);

    for (let i = 0; i < count; i++) {
      this.time.delayedCall(i * 100, () => {
        const proj = this.projectiles.get();
        if (!proj) return;
        proj.enableBody(true, this.player.x, this.player.y, true, true);
        proj.setTexture('chalk_bullet').setScale(this.stats.sizeMult * (isEvo ? 2 : 1.2));
        proj.setTint(0xff0000);
        
        proj.weaponType = 'chalk'; 
        proj.damage = this.calculateDamage(15 + this.skills.chalk * 10) * (isEvo ? 3 : 1); 
        proj.pierce = isEvo ? (1 + this.skills.chalk) : 0; 
        
        // 날아가는 각도 (조금씩 산탄)
        const spread = (Math.random() - 0.5) * 0.2;
        const angle = baseAngle + spread;
        
        proj.setRotation(angle);
        proj.setVelocity(Math.cos(angle) * 700 * this.stats.projSpeed, Math.sin(angle) * 700 * this.stats.projSpeed);
        proj.deathTime = this.time.now + 1500 * this.stats.durationMult;
      });
    }
  }

  // ─── 〰️ 안전거리 유지: 전방 가로로 넓게 휘두름 (채찍) ────────────────
  fireJumprope() {
    SFX.shootThrottled();
    const isEvo = this.skills.jumprope >= 6;
    const count = (isEvo ? 4 : 2) + Math.floor(this.skills.jumprope / 2) + this.stats.amount; 
    
    // 채찍은 항상 좌우로만 휘두릅니다.
    let dirX = this.player.lastDirX !== undefined && this.player.lastDirX !== 0 ? (this.player.lastDirX < 0 ? -1 : 1) : (this.player.flipX ? -1 : 1);
    
    for (let i = 0; i < count; i++) {
      this.time.delayedCall(i * 150, () => {
        const proj = this.projectiles.get();
        if (!proj) return;
        
        const scaleX = this.stats.sizeMult * 6 * 0.7 * (isEvo ? 1.5 : 1);
        const scaleY = this.stats.sizeMult * 6 * 0.5 * (isEvo ? 1.5 : 1);
        
        const offsetX = (80 * scaleX) / 2;
        
        // 캐릭터의 좌/우에 스폰
        proj.enableBody(true, this.player.x + (dirX * offsetX), this.player.y, true, true);
        
        proj.setTexture('jumprope_whip');
        proj.setScale(scaleX, scaleY);
        
        // 가로로만 공격하므로 회전값은 0
        proj.setRotation(0);
        proj.setFlipX(dirX < 0);
        proj.setFlipY(false);
        
        proj.setTint(isEvo ? 0x9b59b6 : 0x3498db); 
        
        proj.weaponType = 'jumprope'; 
        proj.damage = (this.calculateDamage(2.5 + (this.skills.jumprope * 1.5)) * (isEvo ? 2 : 1)) / 2; 
        proj.pierce = 999; 
        
        proj.setVelocity(0, 0); 
        proj.deathTime = this.time.now + 100 * this.stats.durationMult; 
      });
    }
  }

  // ─── 🔥 과학실 알코올램프: 불꽃 발사 및 지속 피해 (불의 지팡이) ────────────────
  fireAlcohol() {
    SFX.shootThrottled();
    const isEvo = this.skills.alcohol >= 6;
    const count = (isEvo ? 4 : 1) + this.stats.amount;
    
    for (let i = 0; i < count; i++) {
      this.time.delayedCall(i * 150, () => {
        let e = this.getClosestEnemy();
        // 적이 없으면 랜덤 방향
        let angle = e ? Phaser.Math.Angle.Between(this.player.x, this.player.y, e.x, e.y) : Phaser.Math.Between(0, 360) * Math.PI / 180;
        
        const proj = this.projectiles.get();
        if (!proj) return;
        proj.enableBody(true, this.player.x, this.player.y, true, true);
        proj.setTexture('alcohol_fire').setScale(this.stats.sizeMult * (isEvo ? 2 : 1.2));
        
        proj.weaponType = 'alcohol'; 
        proj.damage = this.calculateDamage(12 + this.skills.alcohol * 5) * (isEvo ? 3 : 1); 
        proj.pierce = isEvo ? 999 : 2 + this.skills.alcohol; 
        
        proj.setVelocity(Math.cos(angle) * 650 * this.stats.projSpeed, Math.sin(angle) * 650 * this.stats.projSpeed);
        proj.setAngularVelocity(0); // 회전 없이 쭉 날아가도록 (재사용된 풀 슬롯에 이전 회전값이 남아있지 않도록 명시적으로 초기화)
        proj.deathTime = this.time.now + 2000 * this.stats.durationMult;
      });
    }
  }

  // ─── 🔔 수업 종: 화면 전체 방해꾼 일시 정지 + 피해 ────────────────
  fireBell() {
    SFX.shootThrottled();
    const isEvo = this.skills.bell >= 6;
    const freezeDuration = isEvo ? 2500 : 1000 + this.skills.bell * 200;
    const dmg = this.calculateDamage(8 + this.skills.bell * 4) * (isEvo ? 3 : 1);

    this.enemies.getChildren().forEach(enemy => {
      if (enemy.active) {
        enemy.hp -= dmg;
        enemy.frozenUntil = this.time.now + freezeDuration;
        this.flashEnemy(enemy);
        this.checkEnemyDeath(enemy);
      }
    });

    // 종 이펙트: 종 아이콘이 살짝 흔들리다 사라짐
    const bell = this.add.image(this.player.x, this.player.y - 40, 'bell_gfx').setScale(isEvo ? 2 : 1.4);
    if (isEvo) bell.setTint(0xffd700);
    this.tweens.add({ targets: bell, angle: { from: -20, to: 20 }, duration: 100, yoyo: true, repeat: 4 });
    this.tweens.add({ targets: bell, alpha: 0, y: bell.y - 20, duration: 700, delay: 300, onComplete: () => bell.destroy() });

    // 종소리 퍼짐 이펙트 (링)
    const ring = this.add.circle(this.player.x, this.player.y, 20, 0xf1c40f, 0);
    ring.setStrokeStyle(6, isEvo ? 0xffd700 : 0xf1c40f, 0.9);
    this.tweens.add({ targets: ring, radius: 500, alpha: 0, duration: 600, onComplete: () => ring.destroy() });
  }

  // ─── ⚽ 축구 수업: 가까운 방해꾼에게 축구공 슛 ────────────────
  fireSoccer() {
    SFX.shootThrottled();
    const isEvo = this.skills.soccer >= 6;
    const count = (isEvo ? 3 : 1) + this.stats.amount;

    for (let i = 0; i < count; i++) {
      this.time.delayedCall(i * 120, () => {
        let target = this.getClosestEnemy();
        let angle = target ? Phaser.Math.Angle.Between(this.player.x, this.player.y, target.x, target.y) : Phaser.Math.Between(0, 360) * Math.PI / 180;

        const proj = this.projectiles.get();
        if (!proj) return;
        proj.enableBody(true, this.player.x, this.player.y, true, true);
        proj.setTexture('soccer_ball').setScale(this.stats.sizeMult * (isEvo ? 1.8 : 1.2));
        if (isEvo) proj.setTint(0xffd700); else proj.clearTint();

        proj.weaponType = 'soccer';
        proj.damage = this.calculateDamage(18 + this.skills.soccer * 7) * (isEvo ? 3 : 1);
        proj.pierce = isEvo ? 999 : 4 + this.skills.soccer;

        // 진화 전: 관통 대신 방해꾼 사이에서 최대 2번 튕김 / 진화 후(월드컵 슛): 기존처럼 관통
        proj.isEvo = isEvo;
        proj.bounceCount = 0;
        proj.maxBounces = 2;
        const soccerSpeed = 550 * this.stats.projSpeed;
        proj.soccerSpeed = soccerSpeed;

        proj.setVelocity(Math.cos(angle) * soccerSpeed, Math.sin(angle) * soccerSpeed);
        proj.deathTime = this.time.now + 2000 * this.stats.durationMult;

        // 회전하며 날아가게
        proj.setAngularVelocity(500);
      });
    }
  }

  // ─── 🎯 딱지치기: 사거리 안의 몬스터 중 랜덤 1명에게 강한 한 방 + 넉백 ────────────────
  fireDdakji() {
    SFX.shootThrottled();
    const isEvo = this.skills.ddakji >= 6;
    const count = (isEvo ? 3 : 1) + Math.floor(this.stats.amount / 2);
    // 공격 범위(사거리) - 좁은 대신 데미지를 강하게 넣는 컨셉이라 범위 자체는 넓히지 않음
    const range = 180 * this.stats.sizeMult;

    for (let i = 0; i < count; i++) {
      this.time.delayedCall(i * 200, () => {
        // 사거리 안에 있는 몬스터들 중 랜덤으로 1명 선택해서 그 자리를 공격
        const inRange = this.enemies.getChildren().filter(e => e.active && Phaser.Math.Distance.Between(this.player.x, this.player.y, e.x, e.y) <= range);
        let targetX, targetY;
        if (inRange.length > 0) {
          const target = Phaser.Utils.Array.GetRandom(inRange);
          targetX = target.x;
          targetY = target.y;
        } else {
          // 사거리 안에 몬스터가 없으면 기존처럼 바라보는 방향으로 헛스윙
          const dirX = this.player.lastDirX !== undefined && this.player.lastDirX !== 0 ? (this.player.lastDirX < 0 ? -1 : 1) : (this.player.flipX ? -1 : 1);
          const dirY = this.player.lastDirY || 0;
          targetX = this.player.x + dirX * range * 0.6;
          targetY = this.player.y + dirY * range * 0.6;
        }

        const proj = this.projectiles.get();
        if (!proj) return;
        const scale = this.stats.sizeMult * (isEvo ? 2.2 : 1.5);

        proj.enableBody(true, targetX, targetY, true, true);
        proj.setTexture('ddakji_bullet').setScale(scale);
        if (isEvo) proj.setTint(0xffd700); else proj.clearTint();

        proj.weaponType = 'ddakji';
        // 사거리가 좁은 만큼 데미지를 크게 강화 (기존 대비 약 2배)
        proj.damage = this.calculateDamage(70 + this.skills.ddakji * 30) * (isEvo ? 3 : 1);
        proj.pierce = 999;

        proj.setVelocity(0, 0);
        proj.deathTime = this.time.now + 200 * this.stats.durationMult;
      });
    }
  }

  // ─── 🎨 수채화 그리기: 슬로우 장판 ────────────────────────────────
  firePaint() {
    SFX.shootThrottled();
    const isEvo = this.skills.paint >= 6;
    const count = (isEvo ? 4 : 1) + this.stats.amount;
    // 레벨업 시 크기가 증가하도록 scale multiplier 추가
    const paintScale = this.stats.sizeMult * (isEvo ? 3 : 1.5) * (1 + (this.skills.paint * 0.15));
    
    for (let i = 0; i < count; i++) {
      const pool = this.pools.get();
      if (!pool) continue;
      const rx = this.player.x + Phaser.Math.Between(-250, 250);
      const ry = this.player.y + Phaser.Math.Between(-250, 250);
      pool.enableBody(true, rx, ry, true, true);
      pool.setTexture('paint_pool').setScale(paintScale).setAlpha(0.75);
      pool.setTint(isEvo ? 0xff00ff : [0xe74c3c, 0x3498db, 0x2ecc71, 0xf1c40f][i % 4]);
      pool.damage = this.calculateDamage(5 + this.skills.paint * 3) * (isEvo ? 3 : 1);
      pool.isPaintPool = true; // 슬로우 효과 태그
      pool.isHealPool = false;
      pool.deathTime = this.time.now + (2500 + this.skills.paint * 400) * this.stats.durationMult * (isEvo ? 2 : 1);
    }
  }

  // ─── ⚡ 수학 공식 번개: 연쇄 번개 ────────────────────────────────────
  fireMath() {
    SFX.shootThrottled();
    const isEvo = this.skills.math >= 6;
    const chains = isEvo ? 8 : (2 + this.skills.math);
    const dmg = this.calculateDamage(25 + this.skills.math * 12) * (isEvo ? 4 : 1);
    let enemies = this.enemies.getChildren().filter(e => e.active);
    if (enemies.length === 0) return;
    Phaser.Utils.Array.Shuffle(enemies);
    let hit = new Set();
    let cur = enemies[0];
    for (let c = 0; c < chains && cur; c++) {
      if (hit.has(cur)) break;
      hit.add(cur);
      cur.hp -= dmg; this.flashEnemy(cur);
      let flash = this.add.graphics();
      flash.lineStyle(isEvo ? 6 : 3, isEvo ? 0xffd700 : 0xf1c40f, 1);
      flash.strokeCircle(cur.x, cur.y, 30 * this.stats.sizeMult);
      this.tweens.add({ targets: flash, alpha: 0, duration: 300, onComplete: () => flash.destroy() });
      this.checkEnemyDeath(cur);
      // 연쇄: 주변 300px 이내 아직 안 맞은 적 찾기
      let next = null, minD = 300;
      enemies.forEach(e => {
        if (!hit.has(e) && e.active) {
          const d = Phaser.Math.Distance.Between(cur.x, cur.y, e.x, e.y);
          if (d < minD) { minD = d; next = e; }
        }
      });
      cur = next;
    }
  }

  spawnEnemy() {
    const time = this.registry.get('time');
    const level = this.registry.get('level');
    // 후반부로 갈수록 한번에 튀어나오는 몬스터 수가 폭발적으로 증가 (최대 12마리씩)
    const count = Math.min(12, 1 + Math.floor(time / 150));
    
    for (let i = 0; i < count; i++) {
      const enemy = this.enemies.get();
      if (enemy) {
        const angle = Phaser.Math.Between(0, 360);
        const radius = 800;
        const x = this.player.x + radius * Math.cos(angle * Math.PI/180);
        const y = this.player.y + radius * Math.sin(angle * Math.PI/180);
        
        enemy.enableBody(true, x, y, true, true);
        enemy.spawnId = ++this.enemySpawnCounter;
        enemy.clearTint();
        enemy.enemyType = 'normal';
        enemy.isDashing = false;

        const rand = Math.random();
      
      if (time >= 1800 && rand > 0.93) {
        // 🎚️ 엔들리스(30분 이후) 전용: 단원평가급 탱커가 "일반 몬스터"로 섞여서 나옴 (난이도 대폭 상향).
        // 정식 보스가 아니라 흔한 몹 중 하나로 취급되도록 isBoss는 false로 둠(보스 체력바/경고문구/상자 없음).
        enemy.setTexture('enemy_boss');
        enemy.setTint(0x95a5a6);
        enemy.hp = 400 + Math.floor(level * 30) + Math.floor(time * 7);
        enemy.speed = 70 + Math.min(50, Math.floor(time / 10));
        enemy.enemyType = 'boss_tank'; // 단원평가와 동일한 돌진 AI를 그대로 재사용
        enemy.lastDash = this.time.now;
        enemy.setScale(1.6);
      } else if (time > 30 && rand < 0.15) {
        enemy.setTexture('enemy_fast');
        // 🎚️ 밸런스 패치: 스마트폰형은 시간에 따른 체력 증가가 전혀 없어 후반부에 사실상 종잇장이었음 - 시간 스케일링 추가
        enemy.hp = 5 + Math.floor(level * 2) + Math.floor(time / 3);
        enemy.speed = 50 + Math.min(25, Math.floor(time / 10)); // 원거리 몹 속도 절반으로 하향
        enemy.enemyType = 'smartphone';
        enemy.lastShoot = this.time.now;
      } else if (time > 45 && rand >= 0.15 && rand < 0.25) {
        enemy.setTexture('enemy_bomb');
        enemy.hp = 15 + Math.floor(level * 5) + Math.floor(time / 4); // 🎚️ 밸런스 패치: 후반 체력 상향
        enemy.speed = 45 + Math.min(20, Math.floor(time / 12));
        enemy.enemyType = 'bomb';
      } else if (time > 50 && rand >= 0.25 && rand < 0.33) {
        enemy.setTexture('enemy_dust');
        enemy.hp = 40 + Math.floor(level * 12) + Math.floor(time * 1.8); // 🎚️ 밸런스 패치: 후반 체력 상향
        enemy.speed = 30 + Math.min(15, Math.floor(time / 15)); // 매우 느리게 부유
        enemy.enemyType = 'dust';
      } else if (time > 60 && rand > 0.85) {
        enemy.setTexture('enemy_tank');
        enemy.hp = 50 + Math.floor(level * 18) + Math.floor(time * 2.2); // 🎚️ 밸런스 패치: 후반 체력 상향
        enemy.speed = 40 + Math.min(30, Math.floor(time / 10));
        enemy.enemyType = 'sleep';
        enemy.lastDash = this.time.now;
      } else {
        enemy.setTexture('enemy');
        // 🎚️ 밸런스 패치: 가장 흔하게 등장하는 기본형 몬스터인데 시간에 따른 체력 증가가 너무 완만해서
        // 후반부에도 위협이 되지 않았음 - 시간 스케일링과 레벨 계수를 모두 상향
        enemy.hp = 10 + Math.floor(level * 4) + Math.floor(time / 2.5);
        enemy.speed = 80 + Math.min(100, Math.floor(time / 5)); 
      }
      enemy.isBoss = false;
      if (enemy.enemyType !== 'boss_tank') enemy.setScale(1.0); // 엔들리스 전용 탱커는 위에서 이미 1.6배로 설정해뒀으므로 덮어쓰지 않음
      }
    }
  }

  // ─── 🏃 몰려오는 무리: 약하지만 숫자가 많은 방해꾼 떼가 한쪽에서 우르르 몰려옴 ────────────────
  spawnSwarm() {
    const time = this.registry.get('time');
    const count = Phaser.Math.Clamp(14 + Math.floor(time / 90), 14, 26); // 후반부로 갈수록 살짝 늘지만 최대 26마리로 제한
    const dirAngle = Phaser.Math.Between(0, 360) * Math.PI / 180; // 몰려오는 방향
    const spawnRadius = 750;
    const spread = 300; // 대열 폭

    SFX.select();
    EventBanner.show(this, '쉬는 시간 종료 알림!', '🏃 얘들아 뛰지 마!! 방해꾼 무리가 몰려옵니다!', 0x3498db);

    for (let i = 0; i < count; i++) {
      const enemy = this.enemies.get();
      if (!enemy) continue;
      const perp = (i - count / 2) * (spread / count) + Phaser.Math.Between(-15, 15);
      const px = this.player.x + Math.cos(dirAngle) * spawnRadius + Math.cos(dirAngle + Math.PI / 2) * perp;
      const py = this.player.y + Math.sin(dirAngle) * spawnRadius + Math.sin(dirAngle + Math.PI / 2) * perp;

      enemy.enableBody(true, px, py, true, true);
      enemy.spawnId = ++this.enemySpawnCounter;
      enemy.clearTint();
      enemy.setTexture('enemy');
      enemy.enemyType = 'normal';
      enemy.isDashing = false;
      enemy.isBoss = false;
      enemy.hp = 4; // 밸런스를 해치지 않도록 한두 방이면 처치되는 매우 약한 개체
      enemy.speed = 130 + Phaser.Math.Between(0, 20); // 뛰어오는 느낌으로 다소 빠르게
      enemy.setScale(0.85); // 살짝 작게 표시해 '무리'처럼 보이도록
